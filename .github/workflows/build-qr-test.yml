name: build-qr-test

on:
  workflow_dispatch:   # прототип; QR-ядро перенесено в product-core (см. build-apks). Только ручной запуск.

jobs:
  qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crypto deps
        run: pip install cryptography

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x product-core-qr/android_shell/gradlew

      - name: Build QR-test APK (interactive-map-qr, skip_activation=false, v4-only)
        run: |
          set -e
          cd product-core-qr
          # тестовый _secret.py (только публичный ключ) из тестового ecosystem.keys
          python -m product_core.keygen embed 4 > ../products/interactive-map-qr/_secret.py
          echo "--- _secret.py head ---"; head -8 ../products/interactive-map-qr/_secret.py
          python -m build ../products/interactive-map-qr --android
          echo "--- APK ---"; find ../products/interactive-map-qr -path '*/builds/android/*.apk'

      - name: Upload QR-test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-test-apk
          path: products/interactive-map-qr/builds/android/*.apk
          if-no-files-found: warn
