name: build-apks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/azure-tts-and-3x-content
    paths:
      - 'products/**'
      - 'product-core/**'
      - '.github/workflows/build-apks.yml'

jobs:
  apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (шифрование контента)
        run: pip install --quiet cryptography

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x product-core/android_shell/gradlew

      - name: Build all 5 APKs (v4/QR protected)
        env:
          OI_CONTENT_MASTER: ${{ secrets.OI_CONTENT_MASTER }}
        run: |
          set -u
          java -version
          python --version
          cd product-core
          # ключ шифрования контента из секрета (приватного ключа подписи здесь НЕТ)
          python -c "import os,json; open('ecosystem.keys','w').write(json.dumps({'content_master': os.environ['OI_CONTENT_MASTER'].strip()}))"
          python -c "import json; assert len(json.load(open('ecosystem.keys'))['content_master'])==64, 'bad content_master'; print('ecosystem.keys OK')"
          ok=""; fail=""
          for slug in smart-dictionary interactive-map music-encyclopedia speech-therapy math-tools; do
            echo "::group::build $slug"
            if python -m build ../products/$slug --android; then ok="$ok $slug"; else fail="$fail $slug"; fi
            echo "::endgroup::"
          done
          echo "=== OK:$ok ==="
          echo "=== FAILED:$fail ==="
          mkdir -p ../_apks
          find ../products -path '*/builds/android/*.apk' -exec cp {} ../_apks/ \;
          echo "--- collected APKs ---"
          ls -la ../_apks || true
          [ -z "$fail" ]

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oi-orda-apks
          path: _apks/*.apk
          if-no-files-found: warn
