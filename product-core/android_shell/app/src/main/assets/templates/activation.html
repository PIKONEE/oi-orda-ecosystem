<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Активация</title>
<style>
  :root{--bg1:#0f172a;--bg2:#1e293b;--accent:#6366f1;--accent2:#8b5cf6;
        --ok:#22c55e;--err:#ef4444;--muted:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',Inter,system-ui,sans-serif;color:#e2e8f0;
       background:linear-gradient(160deg,var(--bg1),var(--bg2));
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{width:100%;max-width:460px;background:rgba(255,255,255,.04);
        border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:36px;
        box-shadow:0 30px 80px rgba(0,0,0,.45);}
  .logo{width:52px;height:52px;border-radius:14px;margin:0 auto 16px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:flex;align-items:center;justify-content:center;font-size:26px;}
  h1{font-size:20px;text-align:center;font-weight:700;margin-bottom:6px;}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px;}
  label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px 2px;
        text-transform:uppercase;letter-spacing:.5px;}
  input{width:100%;padding:14px;font-size:17px;letter-spacing:2px;text-align:center;
        border-radius:12px;border:1px solid rgba(255,255,255,.12);
        background:rgba(0,0,0,.25);color:#fff;outline:none;text-transform:uppercase;
        -webkit-user-select:text;user-select:text;}
  input:focus{border-color:var(--accent);}
  button{width:100%;margin-top:16px;padding:14px;font-size:15px;font-weight:600;
         border:none;border-radius:12px;cursor:pointer;color:#fff;
         background:linear-gradient(135deg,var(--accent),var(--accent2));}
  button:disabled{opacity:.6;}
  .msg{margin-top:14px;text-align:center;font-size:13px;min-height:18px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--err);}
  .device{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);text-align:center;}
  .device .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .device .val{margin-top:6px;font-family:monospace;font-size:18px;letter-spacing:3px;color:#fff;
               -webkit-user-select:text;user-select:text;}
  .hint{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.4;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🔑</div>
    <h1>Активация продукта</h1>
    <p class="sub">Введите лицензионный ключ для этого устройства</p>
    <label for="key">Лицензионный ключ</label>
    <input id="key" maxlength="29" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"
           autocomplete="off" spellcheck="false">
    <button id="btn">Активировать</button>
    <div id="msg" class="msg"></div>
    <div class="device">
      <div class="lbl">ID этого устройства</div>
      <div id="deviceId" class="val">…</div>
      <div class="hint">Сообщите этот ID при покупке ключа.</div>
    </div>
  </div>
<script>
  var input = document.getElementById('key');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  function setMsg(t,c){ msg.textContent=t; msg.className='msg '+(c||''); }

  input.addEventListener('input', function(){
    var v = input.value.toUpperCase().replace(/[^A-Z2-7]/g,'').substring(0,24);
    input.value = (v.match(/.{1,4}/g)||[]).join('-');
  });
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') activate(); });

  function activate(){
    var key = input.value.trim();
    if(key.replace(/-/g,'').length < 24){ setMsg('Введите полный ключ','err'); return; }
    btn.disabled = true; setMsg('Проверка…');
    // Android: core — это JsBridge через addJavascriptInterface
    if(typeof core !== 'undefined') core.activateKey(key);
  }
  btn.addEventListener('click', activate);

  window.onActivationSuccess = function(m){ setMsg(m,'ok'); };
  window.onActivationError = function(m){ btn.disabled=false; setMsg(m,'err'); };

  // Показать Device ID
  (function(){
    if(typeof core !== 'undefined'){
      document.getElementById('deviceId').textContent = core.getDeviceId();
    }
  })();
</script>
</body>
</html>
