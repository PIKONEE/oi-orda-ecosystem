<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Активация</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  :root{--bg1:#0f172a;--bg2:#1e293b;--accent:#6366f1;--accent2:#8b5cf6;
        --ok:#22c55e;--err:#ef4444;--muted:#94a3b8;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;}
  body{font-family:'Segoe UI',Inter,system-ui,sans-serif;color:#e2e8f0;
       background:radial-gradient(1200px 600px at 50% -10%,#33406b,transparent),
                  linear-gradient(160deg,var(--bg1),var(--bg2));
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{width:100%;max-width:520px;background:rgba(255,255,255,.04);
        border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px;
        box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(8px);}
  .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 18px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:flex;align-items:center;justify-content:center;font-size:28px;}
  h1{font-size:22px;text-align:center;font-weight:700;margin-bottom:6px;}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px;}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 8px 2px;
        text-transform:uppercase;letter-spacing:.5px;}
  textarea{width:100%;height:92px;padding:14px 16px;font-size:13px;line-height:1.5;
        border-radius:12px;border:1px solid rgba(255,255,255,.12);resize:none;
        background:rgba(0,0,0,.25);color:#fff;outline:none;
        font-family:'Consolas',monospace;word-break:break-all;
        -webkit-user-select:text;user-select:text;transition:border .2s;}
  textarea:focus{border-color:var(--accent);}
  button{width:100%;margin-top:18px;padding:15px;font-size:16px;font-weight:600;
         border:none;border-radius:12px;cursor:pointer;color:#fff;
         background:linear-gradient(135deg,var(--accent),var(--accent2));transition:filter .2s;}
  button:hover{filter:brightness(1.1);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:16px;text-align:center;font-size:14px;min-height:20px;}
  .msg.ok{color:var(--ok);} .msg.err{color:var(--err);}
  .device{margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);
          text-align:center;}
  .device .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .device .val{margin-top:8px;font-family:'Consolas',monospace;font-size:20px;
               letter-spacing:3px;color:#fff;-webkit-user-select:text;user-select:text;}
  .hint{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🔑</div>
    <h1>Активация продукта</h1>
    <p class="sub">Вставьте лицензию для этого устройства</p>

    <label for="key">Ключ активации</label>
    <textarea id="key" placeholder="XXXXX-XXXXX-XXXXX-XXXXX   или   OL1-…"
              autocomplete="off" spellcheck="false"></textarea>
    <button id="btn">Активировать</button>
    <button id="scanBtn" style="display:none;background:linear-gradient(135deg,#0ea5e9,#22d3ee);">📷 Сканировать QR-код</button>

    <div id="msg" class="msg"></div>

    <div class="device">
      <div class="lbl">ID этого устройства</div>
      <div id="deviceId" class="val">…</div>
      <div class="hint">Сообщите этот ID при покупке — лицензия выдаётся под конкретное устройство.</div>
    </div>
  </div>

<script>
  var core = null;
  var input = document.getElementById('key');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  function setMsg(text, cls){ msg.textContent = text; msg.className = 'msg ' + (cls||''); }

  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.ctrlKey || !e.shiftKey)) { e.preventDefault(); activate(); }
  });

  // Авто-форматирование короткого ключа: ВЕРХНИЙ регистр, дефис каждые 5 символов (20 макс).
  // Длинную лицензию OL1-… не трогаем.
  input.addEventListener('input', function(){
    if(/^OL1/i.test((input.value||'').replace(/\s/g,''))) return;
    var c = input.value.toUpperCase().replace(/[^A-Z2-7]/g,'').slice(0,20);
    input.value = c.replace(/(.{5})(?=.)/g,'$1-');
  });

  function activate(){
    var key = (input.value || '').trim();
    if(key.length < 8){ setMsg('Вставьте лицензию','err'); return; }
    if(!core){ setMsg('Мост не готов, подождите секунду…','err'); return; }
    btn.disabled = true; setMsg('Проверка…');
    core.activateKey(key);
  }
  btn.addEventListener('click', activate);

  // Колбэки, вызываемые из Python (Qt CoreBridge или мост pywebview)
  window.onActivationSuccess = function(m){ setMsg(m,'ok'); };
  window.onActivationError = function(m){ btn.disabled = false; setMsg(m,'err'); };

  function showDeviceId(id){ document.getElementById('deviceId').textContent = id; }

  // ── Мост: WebView2 (pywebview), QtWebEngine (QWebChannel) или Android (addJavascriptInterface) ──
  function usePywebview(){
    core = {
      getDeviceId: function(cb){ window.pywebview.api.get_device_id().then(function(v){ if(cb)cb(v); }); },
      activateKey: function(k){ window.pywebview.api.activate(k).then(function(r){
        if(r && r.ok){ window.onActivationSuccess(r.msg); }
        else { window.onActivationError((r && r.msg) || 'Ошибка'); } }); }
    };
    core.getDeviceId(showDeviceId);
  }
  if (window.AndroidShell) {                 // Android: синхронный мост addJavascriptInterface
    core = {
      getDeviceId: function(cb){ cb(window.AndroidShell.getDeviceId()); },
      activateKey: function(k){ window.AndroidShell.activateKey(k); }  // вызовет onActivationSuccess/Error
    };
    core.getDeviceId(showDeviceId);
    if (window.AndroidShell.scanQr) {
      var sb = document.getElementById('scanBtn'); sb.style.display = 'block';
      sb.addEventListener('click', function(){ setMsg('Открываю камеру…'); window.AndroidShell.scanQr(); });
    }

  } else if (window.pywebview && window.pywebview.api) { usePywebview(); }
  else { window.addEventListener('pywebviewready', usePywebview); }

  if (window.qt && window.qt.webChannelTransport && typeof QWebChannel !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function(channel){
      core = channel.objects.core;
      core.getDeviceId(showDeviceId);
    });
  }
</script>
</body>
</html>
