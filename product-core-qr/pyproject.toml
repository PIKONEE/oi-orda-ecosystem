[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-core"
version = "1.0.0"
description = "Централизованное ядро лицензирования и сборки для образовательных продуктов"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]   # проверка лицензий Ed25519

[project.optional-dependencies]
# Лёгкая оболочка (движок по умолчанию) — системный Edge WebView2:
shell = ["pywebview>=5.0", "pythonnet>=3.0"]
# Запасная тяжёлая оболочка (встроенный QtWebEngine):
shell-qt = ["PySide6>=6.5"]
# Сборка: упаковщики + иконки. PySide6 нужен только для движка qt.
build = ["pywebview>=5.0", "pythonnet>=3.0", "Pillow>=10.0",
         "pyinstaller>=6.0", "nuitka>=2.0", "PySide6>=6.5"]

[project.scripts]
product-keygen = "product_core.keygen:main"

[tool.setuptools.packages.find]
include = ["product_core*"]
