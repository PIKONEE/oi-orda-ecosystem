                Backbone: { title: 'Қант-фосфатты қаңқа', desc: 'Қос шиыршықтың сыртқы қаңқасы. Кезектесіп келетін дезоксирибоза (бес көміртекті қант) мен фосфат топтарының қалдықтарынан тұрады. Қаңқа теріс зарядталған, бұл ДНҚ-ға қышқылдық қасиет береді.', facts: 'Қант-фосфатты қаңқаның теріс заряды ДНҚ-ның арнайы сілтілі белоктармен — гистондармен байланысуына мүмкіндік береді, олар екі метрлік ДНҚ жіпшесін жасушаның микроскопиялық ядросына жинақтап қаптайды.' }

        en: {

                Guanine: { title: 'Guanine (G)', desc: 'A purine nitrogenous base. In the DNA molecule, it forms a strong triple hydrogen bond with cytosine. Due to these three bonds, DNA segments rich in G-C pairs are more stable and heat-resistant.', facts: 'Guanine was first isolated from guano — the accumulated excrement of seabirds, which is where its name originates.' },
                Cytosine: { title: 'Cytosine (C)', desc: 'A pyrimidine nitrogenous base. It is complementary to guanine (G), bonding with it via three hydrogen bonds. Cytosine often undergoes enzymatic methylation, which plays a major role in regulating gene activity.', facts: 'Cytosine methylation is a cornerstone of epigenetics — the study of how environment and lifestyle can switch genes on and off without altering the genetic sequence itself.' },
                Backbone: { title: 'Sugar-phosphate backbone', desc: 'The outer framework of the double helix. It consists of alternating deoxyribose (a five-carbon sugar) and phosphate group residues. The backbone carries a negative charge, giving DNA its acidic properties.', facts: 'The negative charge of the sugar-phosphate backbone allows DNA to bind tightly with alkaline proteins called histones, which pack the two-meter-long DNA strand into the microscopic cell nucleus.' }
            }
        }
    };

    const ZONES = [
        { id: 'Adenine',  subtitle: 'Adeninum',  color: 0x50e3c2 },
        { id: 'Thymine',  subtitle: 'Thyminum',  color: 0xff5f5f },
        { id: 'Guanine',  subtitle: 'Guaninum',  color: 0xf5a623 },
        { id: 'Cytosine', subtitle: 'Cytosinum', color: 0x4a90e2 },
        { id: 'Backbone', subtitle: 'Sceletum saccharo-phosphaticum', color: 0xe0e0e0 }
    ];

    function classify(x, y, z) {
        // Ось спирали направлена вдоль Z (после нормализации ~[-1.2, 1.2]).
        // Радиус считаем в плоскости поперечного сечения (XY).
        const r = Math.sqrt(x*x + y*y);
        if (r > 0.11) {
            return 4; // Сахаро-фосфатный остов (внешние нити)
        }
        // Азотистые основания-«ступеньки» чередуются вдоль оси Z
        const segment = Math.floor((z + 1.2) / 0.18);
        return ((segment % 4) + 4) % 4; // 0: Аденин, 1: Тимин, 2: Гуанин, 3: Цитозин
    }

    initPoster({ modelFile: 'dna.glb', zones: ZONES, classify, i18n: I18N, modelScale: 1.0, modelRotation: [Math.PI / 2, 0, 0] });
