        { id: 'sepals', subtitle: 'Sepala (Calyx)',   color: 0x6bcb77 },
        { id: 'stamen', subtitle: 'Stamen',           color: 0xffd93d },
        { id: 'pistil', subtitle: 'Pistillum',        color: 0xc77dff },
        { id: 'ovary',  subtitle: 'Ovarium',          color: 0x4d96ff }
    ];

    // classify(x, y, z): vertical axis, top=stigma, bottom=ovary
    function classify(x, y, z) {
        const rad = Math.sqrt(x * x + z * z); // distance from vertical axis
        if (rad < 0.18) return y > -0.1 ? 3 : 4; // pistil / ovary
        if (rad < 0.42 && y > -0.15) return 2;    // stamen
        return y > 0 ? 0 : 1;                      // petals / sepals
    }

    initPoster({ modelFile: 'flower.glb', zones: ZONES, classify, i18n: I18N });
