    const ZONES = [
        { id: 'outer_membrane', subtitle: 'Membrana externa',         color: 0xff6b6b },
        { id: 'intermembrane',  subtitle: 'Spatium intermembranosum', color: 0xffd93d },
        { id: 'inner_membrane', subtitle: 'Membrana interna',         color: 0x4d96ff },
        { id: 'cristae',        subtitle: 'Cristae',                  color: 0x6bcb77 },
        { id: 'matrix',         subtitle: 'Matrix mitochondrialis',   color: 0xc77dff }
    ];

    // classify(x, y, z): concentric layers by distance from center
    function classify(x, y, z) {
        const dc = Math.sqrt(x * x + y * y + z * z);
        if (dc > 0.85) return 0; // outer_membrane
        if (dc > 0.72) return 1; // intermembrane
        if (dc > 0.6)  return 2; // inner_membrane
        if (dc > 0.3)  return 3; // cristae
        return 4; // matrix
    }

    initPoster({ modelFile: 'mitochondria.glb', zones: ZONES, classify, i18n: I18N });
