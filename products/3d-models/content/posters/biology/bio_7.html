        { id: 'patella',   subtitle: 'Patella',          color: 0x4d96ff },
        { id: 'tibia',     subtitle: 'Tibia',            color: 0xffd93d },
        { id: 'fibula',    subtitle: 'Fibula',           color: 0x6bcb77 },

    ];

    // classify(x, y, z): x=right, y=up, z=front
    // Knee: femur on top, tibia/fibula below, patella in front, meniscus/ligaments in middle
    function classify(x, y, z) {
        // Femur — upper half
        if (y > 0.3) return 0;
        // Tibia / Fibula — lower half
        if (y < -0.2) {
            if (x > 0.35) return 3; // fibula (lateral)
            return 2; // tibia
        }
        // Middle zone — the joint itself
        // Patella — front
        if (z > 0.35) return 1;
        // Meniscus — thin central band around y≈0
        if (y > -0.15 && y < 0.15 && Math.abs(z) < 0.45) return 4;
        // Ligaments — everything else in middle (central, behind patella)
        return 5;
    }
