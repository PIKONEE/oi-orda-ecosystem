        },
        kz: {

            header_subtitle: 'Жүйке жасушасының интерактивті моделі — 5 негізгі бөлік',
            hint: 'Толығырақ білу үшін нейронның кез келген бөлігіне басыңыз',
            reset_btn: '↺ Көріністі қалпына келтіру', reset_btn_title: 'Көріністі қалпына келтіру', close_btn_label: 'Жабу',
            loading: 'Модель жүктелуде…', error_load: 'neuron.glb файлын жүктеу мүмкін болмады', error_no_mesh: 'Модельде меш табылмады',
            facts_label: 'Қызықты факт',
            zones: {
                dendrites: { title: 'Дендриттер', desc: 'Нейронның денесінен таралатын ағаш тәрізді тармақталған өсінділер. Синапстар арқылы мыңдаған басқа нейрондардан сигналдар қабылдап, оларды жасуша денесіне жеткізеді.', facts: 'Ми қыртысының бір нейронының барлық дендриттерін сызыққа жайса, ұзындығы 10 метрге дейін, ал тікенектерінің саны 200 000-ға жетеді.' },
                soma: { title: 'Нейрон денесі (сома)', desc: 'Жүйке жасушасының орталық бөлігі, ядроны және органеллалардың көпшілігін қамтиды. Мұнда барлық белоктар мен нейромедиаторлар синтезделеді.', facts: 'Нейрон денесінің мөлшері 4 мкм-ден 130 мкм-ге дейін — 30 есе айырмашылықпен өзгереді!' },
                axon_hillock: { title: 'Аксон төбешігі', desc: 'Аксонның нейрон денесінен шығатын жеріндегі конус тәрізді жоғарылау. Бұл сигналдарды интеграциялаудың сыни аймағы.', facts: 'Аксон төбешігіндегі жиынтық қоздырғыш сигнал −55 мВ шегінен асса, секундына 120 м-ге дейінгі жылдамдықпен жүйке импульсі түзіледі.' },
                axon: { title: 'Аксон миелин қабығымен', desc: 'Нейронның ұзын өсіндісі, электрлік импульстерді жасуша денесінен басқа нейрондарға немесе бұлшықеттерге жеткізеді. Миелинмен қапталған.', facts: 'Адамның ең ұзын аксондары жұлыннан аяқтың саусақтарына дейін 1 метрге жетеді.' },

        en: {
            page_title: 'Neuron — Nerve Cell',
            header_title: 'Neuron',

            facts_label: 'Did you know?',
            zones: {
                dendrites: { title: 'Dendrites', desc: 'Tree-like branching extensions that receive signals from thousands of other neurons via synapses and transmit them to the cell body.', facts: 'If all dendrites of a single cortical neuron were laid out in a line, their length would reach up to 10 meters.' },
                soma: { title: 'Soma (Cell Body)', desc: 'The central part of the nerve cell containing the nucleus and most organelles. All proteins and neurotransmitters are synthesized here.', facts: 'Neuron body size varies from 4 μm to 130 μm — a 30-fold difference!' },
                axon_hillock: { title: 'Axon Hillock', desc: 'A cone-shaped elevation where the axon emerges from the neuron body. The critical zone for signal integration with the lowest excitability threshold.', facts: 'If the excitatory signal exceeds the −55 mV threshold, a nerve impulse is generated traveling at up to 120 m/s.' },
                axon: { title: 'Axon with Myelin Sheath', desc: 'A long process that transmits electrical impulses from the cell body to other neurons or muscles. Covered with myelin for faster signal conduction.', facts: 'The longest human axons reach 1 meter in length while being only 5–25 μm thick.' },
                terminals: { title: 'Axon Terminals (Synapses)', desc: 'Terminal branches forming synaptic contacts with other neurons. Contain vesicles with neurotransmitters released into the synaptic cleft.', facts: 'A single neuron forms 1,000 to 10,000 synapses; the human brain has about 100 trillion synapses total.' }
            }
        }
    };

    const ZONES = [
        { id: 'dendrites',    subtitle: 'Dendritae',         color: 0xff6b6b },
        { id: 'soma',         subtitle: 'Soma neuralis',     color: 0x4d96ff },
        { id: 'axon_hillock', subtitle: 'Colliculus axonis', color: 0xffd93d },
        { id: 'axon',         subtitle: 'Axon + Myelinum',   color: 0x6bcb77 },
        { id: 'terminals',    subtitle: 'Telodendria',       color: 0xc77dff }
    ];

    // classify(x, y, z): x=right, y=up, z=front
    // Neuron oriented vertically: dendrites at top, soma upper-center, axon hillock just below,
    // axon extending down, terminals at very bottom
    function classify(x, y, z) {
        // Dendrites — top (branching)
        if (y > 0.5) return 0;
        // Soma — upper center, roughly spherical
        if (y > -0.05 && y < 0.5 && Math.abs(x) < 0.4 && Math.abs(z) < 0.4) return 1;
        // Axon hillock — transition zone just below soma
        if (y > -0.25 && y < 0.0) return 2;
        // Terminals — very bottom (branching)
        if (y < -0.7) return 4;
        // Axon — long middle section (default)
        return 3;
    }

    initPoster({ modelFile: 'neuron.glb', zones: ZONES, classify, i18n: I18N });
</script>
