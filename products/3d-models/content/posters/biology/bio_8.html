        { id: 'lung_upper_r', subtitle: 'Lobus superior dexter',   color: 0xff6b6b },

    // classify(x, y, z): x=right, y=up, z=front
    // Trachea+bronchi at top center, lungs left/right with upper/lower split
    function classify(x, y, z) {
        // Trachea — top center, narrow tube
        if (y > 0.55 && Math.abs(x) < 0.2) return 0;
        // Bronchi — branching region below trachea, still central
        if (y > 0.25 && Math.abs(x) < 0.4) return 1;
        // Right lung (x > 0)
        if (x > 0.05) {
            return y > -0.1 ? 2 : 3; // upper / lower
        }
        // Left lung (x <= 0)
        return y > -0.1 ? 4 : 5; // upper / lower
    }
