    // classify(x, y, z): concentric layers, thylakoids/grana in mid
    function classify(x, y, z) {
        const dc = Math.sqrt(x * x + y * y + z * z);
        if (dc > 0.85) return 0; // outer_membrane
        if (dc > 0.75) return 1; // inner_membrane
        if (dc < 0.35) return 2; // stroma
        if (y > 0) return 3;     // thylakoids
        return 4;                 // grana
    }
