    // classify(x, y, z): crown upper has enamel, root lower has cementum
    function classify(x, y, z) {
        const rad = Math.sqrt(x * x + z * z); // distance from vertical axis
        if (rad < 0.18) return y > 0 ? 2 : 3; // pulp / root_canal
        if (rad > 0.65) return y > 0 ? 0 : 4; // enamel / cementum
        return 1; // dentin
    }
