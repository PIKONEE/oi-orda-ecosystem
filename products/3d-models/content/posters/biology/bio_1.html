    const ZONES = [
        { id: 'left_ventricle',  subtitle: 'Ventriculus sinister', color: 0xff6b6b },
        { id: 'right_ventricle', subtitle: 'Ventriculus dexter',   color: 0x4d96ff },
        { id: 'left_atrium',     subtitle: 'Atrium sinistrum',     color: 0xffd93d },
        { id: 'right_atrium',    subtitle: 'Atrium dextrum',       color: 0x6bcb77 },
        { id: 'aorta',           subtitle: 'Aorta et vasa magna',  color: 0xc77dff },
        { id: 'valves',          subtitle: 'Valvae cordis',        color: 0xff9f45 }
    ];

    // classify(x, y, z): x=right, y=up, z=front
    // Heart anatomy: aorta/vessels at top, atria upper-middle, ventricles lower, valves in between
    function classify(x, y, z) {
        // Aorta and great vessels — top of the heart
        if (y > 0.45) return 4;
        // Atria — upper portion
        if (y > 0.05) {
            // Valves — narrow band at atrio-ventricular junction, central
            if (y < 0.2 && Math.abs(x) < 0.5 && Math.abs(z) < 0.5) return 5;
            return x > 0 ? 3 : 2; // right atrium (anatomical right = viewer's left in standard view) / left atrium
        }
        // Ventricles — lower portion (bulk of the heart)
        // Left ventricle is thicker, posterior-left; right ventricle is anterior-right
        if (z > 0.15 || x > 0.2) return 1; // right ventricle (anterior)
        return 0; // left ventricle (posterior-left, dominant mass)
    }

    initPoster({ modelFile: 'heart.glb', zones: ZONES, classify, i18n: I18N });
