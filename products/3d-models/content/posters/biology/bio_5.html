        { id: 'os_zygomaticum', subtitle: 'Os zygomaticum',        color: 0xff9f45 },
        { id: 'maxilla',        subtitle: 'Maxilla & Mandibula',   color: 0xf472b6 }
    ];

    // classify(x, y, z) — normalized coords: x right, y up, z front.
    // Returns zone index (0–7) based on where the click landed on the skull.
    function classify(x, y, z) {
        // 7: Mandible / Maxilla — bottom front
        if (y < -0.3 && z > -0.2) return 7;
        // 6: Zygomatic — side-front, mid-level (cheekbone area)
        if (y > -0.35 && y < 0.15 && z > 0.2 && Math.abs(x) > 0.3) return 6;
        // 5: Nasal bones & orbits — front center at face level
        if (y > -0.3 && y < 0.25 && z > 0.4 && Math.abs(x) < 0.35) return 5;
        // 3: Left temporal — left side
        if (x < -0.45 && y < 0.4) return 3;
        // 4: Right temporal — right side
        if (x > 0.45 && y < 0.4) return 4;
        // 2: Occipital — back
        if (z < -0.2 && y < 0.5) return 2;
        // 0: Frontal — front upper
        if (z > 0.1 && y > 0.15) return 0;
        // 1: Parietal — top
        if (y > 0.35) return 1;
        // Default: frontal for anything remaining
        return 0;
    }

    initPoster({ modelFile: 'skull.glb', zones: ZONES, classify, i18n: I18N });
