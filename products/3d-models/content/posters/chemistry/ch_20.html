scene.add(sun);
const fill = new THREE.DirectionalLight(0xf0e8ff, 0.5);
fill.position.set(-8, 4, -6);
scene.add(fill);

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentId  = 'o2';
let spinning   = true;
let showBonds  = true;
let showAngles = false;
let showLone   = false;
let isDragging = false;
let dragStart  = { x: 0, y: 0 };

const mainGroup   = new THREE.Group();
scene.add(mainGroup);

let atomMeshes  = [];
let bondMeshes  = [];
let angleMeshes = [];
let loneMeshes  = [];
let clickables  = [];

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function makeBond(p1, p2, r, color) {
    const dir = new THREE.Vector3().subVectors(p2, p1);
    const len = dir.length();
    const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
    const geo = new THREE.CylinderGeometry(r, r, len, 18);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.45 });
    const m   = new THREE.Mesh(geo, mat);
    m.position.copy(mid);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return m;
}

function makeAtom(r, color) {
    const geo = new THREE.SphereGeometry(r, 36, 36);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.22, metalness: 0.06 });
    return new THREE.Mesh(geo, mat);
}

function makeLobe(r, color) {
    const geo = new THREE.SphereGeometry(r, 18, 18);
    const mat = new THREE.MeshStandardMaterial({
        color,
        transparent: true,
        opacity: 0.52,
        roughness: 0.85
    });
    return new THREE.Mesh(geo, mat);
}

// ─── BUILD O₂ ─────────────────────────────────────────────────────────────────
function buildO2() {
    const g = new THREE.Group();
    atomMeshes = []; bondMeshes = []; angleMeshes = []; loneMeshes = []; clickables = [];

    const L = 3.0;
    const pA = new THREE.Vector3(-L / 2, 0, 0);
    const pB = new THREE.Vector3( L / 2, 0, 0);

    [pA, pB].forEach((pos, i) => {
        const m = makeAtom(0.74, i === 0 ? 0xdc2626 : 0xb91c1c);
        m.position.copy(pos);
        m.userData  = { allotrope: 'o2', type: 'oxygen' };
        m.castShadow = true;
        g.add(m);
        atomMeshes.push(m);
        clickables.push(m);
    });

    // Double bond: two offset cylinders
    [0.24, -0.24].forEach(dy => {
        const b = makeBond(
            pA.clone().add(new THREE.Vector3(0, dy, 0)),
            pB.clone().add(new THREE.Vector3(0, dy, 0)),
            0.10, 0xe53e3e
        );
        g.add(b);
        bondMeshes.push(b);
    });

    // Lone pair lobes — 2 pairs per atom, perpendicular to bond axis
    [pA, pB].forEach((pos, ai) => {
        const outDir = ai === 0 ? -1 : 1; // pointing away from molecule centre
        const outerPos = pos.clone().add(new THREE.Vector3(outDir * 0.8, 0, 0));
        // lobe 1: above
        const lp1 = makeLobe(0.32, 0x6366f1);
        lp1.position.copy(pos).add(new THREE.Vector3(0,  0.72, 0.45));
        lp1.visible = false;
        g.add(lp1); loneMeshes.push(lp1);
        // lobe 2: below
        const lp2 = makeLobe(0.32, 0x6366f1);
        lp2.position.copy(pos).add(new THREE.Vector3(0, -0.72, 0.45));
        lp2.visible = false;
        g.add(lp2); loneMeshes.push(lp2);
        // lobe 3: outer z-side
        const lp3 = makeLobe(0.32, 0x6366f1);
        lp3.position.copy(outerPos);
        lp3.visible = false;
        g.add(lp3); loneMeshes.push(lp3);
    });

    return g;
}

// ─── BUILD O₃ ─────────────────────────────────────────────────────────────────
function buildO3() {
    const g = new THREE.Group();
    atomMeshes = []; bondMeshes = []; angleMeshes = []; loneMeshes = []; clickables = [];

    const L    = 2.8;
    const half = (116.8 / 2) * (Math.PI / 180); // half-angle in radians

    // Bisector along +y; terminals spread to left and right
    const pC  = new THREE.Vector3( 0,                        0,                0); // central
    const pL  = new THREE.Vector3(-Math.sin(half) * L,  Math.cos(half) * L, 0); // left terminal
    const pR  = new THREE.Vector3( Math.sin(half) * L,  Math.cos(half) * L, 0); // right terminal

    // Centre of mass (equal atomic masses)
    const com = new THREE.Vector3().add(pC).add(pL).add(pR).divideScalar(3);
    [pC, pL, pR].forEach(p => p.sub(com));

    // Central O (slightly larger — carries lone pair)
    const mC = makeAtom(0.78, 0xb91c1c);
    mC.position.copy(pC);
    mC.userData  = { allotrope: 'o3', type: 'central' };
    mC.castShadow = true;
    g.add(mC); atomMeshes.push(mC); clickables.push(mC);

    [pL, pR].forEach((pos, i) => {
        const m = makeAtom(0.70, 0xdc2626);
        m.position.copy(pos);
        m.userData  = { allotrope: 'o3', type: 'terminal', index: i };
        m.castShadow = true;
        g.add(m); atomMeshes.push(m); clickables.push(m);
    });

    // Bonds (order 1.5 — shown as one thick bond + a second thin parallel)
    [pL, pR].forEach(pos => {
        const main = makeBond(pC, pos, 0.13, 0xe53e3e);
        g.add(main); bondMeshes.push(main);
        // thin second line offset to hint at partial double-bond
        const perp = new THREE.Vector3().subVectors(pos, pC)
            .cross(new THREE.Vector3(0, 0, 1)).normalize().multiplyScalar(0.22);
        const side = makeBond(
            pC.clone().add(perp),
            pos.clone().add(perp),
            0.055, 0xf87171
        );
        side.userData.isSecondBond = true;
        g.add(side); bondMeshes.push(side);
    });

    // Angle arc at central atom
    const d1 = pL.clone().sub(pC).normalize().multiplyScalar(1.4);
    const d2 = pR.clone().sub(pC).normalize().multiplyScalar(1.4);
    const arcPts = [];
    for (let i = 0; i <= 36; i++) {
        const s   = i / 36;
        const dir = new THREE.Vector3().lerpVectors(d1, d2, s).normalize().multiplyScalar(1.4);
        arcPts.push(pC.clone().add(dir));
    }
    const arcGeo  = new THREE.BufferGeometry().setFromPoints(arcPts);
    const arcLine = new THREE.Line(arcGeo,
        new THREE.LineBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.85 })
    );
    arcLine.visible = false;
    g.add(arcLine); angleMeshes.push(arcLine);

    // Lone pair on central O — bisector reversed (downward = negative y direction)
    const bisDir = new THREE.Vector3().addVectors(
        pL.clone().sub(pC).normalize(),
        pR.clone().sub(pC).normalize()
    ).normalize();
    const lpCentral = makeLobe(0.44, 0x8b5cf6);
    lpCentral.position.copy(pC).addScaledVector(bisDir.clone().negate(), 1.25);
    lpCentral.visible = false;
    g.add(lpCentral); loneMeshes.push(lpCentral);

    // Lone pairs on terminal atoms (2 each — out-of-plane and outward)
    [pL, pR].forEach((pos, ti) => {
        const outward = pos.clone().sub(pC).normalize();
        const sign    = ti === 0 ? 1 : -1;
        // lobe 1: slightly outward along bond direction
        const lp1 = makeLobe(0.30, 0x8b5cf6);
        lp1.position.copy(pos).addScaledVector(outward, 1.1);
        lp1.visible = false;
        g.add(lp1); loneMeshes.push(lp1);
        // lobe 2: out of molecular plane (±z)
        const lp2 = makeLobe(0.30, 0x8b5cf6);
        lp2.position.copy(pos).add(new THREE.Vector3(0, 0, sign * 1.0));
        lp2.visible = false;
        g.add(lp2); loneMeshes.push(lp2);
    });

    return g;
}

// ─── SWITCH ───────────────────────────────────────────────────────────────────
const builders = { o2: buildO2, o3: buildO3 };

function rebuildProps(id) {
    const d = PROPS[id];
    document.getElementById('props-content').innerHTML = d.rows
        .map(([k, v]) =>
            `<div class="prop-row"><span class="prop-key">${k}</span><span class="prop-val">${v}</span></div>`)
        .join('');
}

window.switchTo = function(id) {
    if (id === currentId) return;
    currentId = id;

    while (mainGroup.children.length) mainGroup.remove(mainGroup.children[0]);
    const g = builders[id]();
    mainGroup.add(g);
    mainGroup.rotation.set(0, 0, 0);

    // Restore toggle states
    bondMeshes.forEach(m  => m.visible = showBonds);
    angleMeshes.forEach(m => m.visible = showAngles && id === 'o3');
    loneMeshes.forEach(m  => m.visible = showLone);

    // Disable angle arc button for linear O₂
    const btnA = document.getElementById('btn-angles');
    btnA.style.opacity    = id === 'o2' ? '0.4' : '1';
    btnA.style.pointerEvents = id === 'o2' ? 'none' : 'auto';
    if (id === 'o2') { showAngles = false; btnA.classList.remove('active'); }

    document.querySelectorAll('.sw-btn')
        .forEach(b => b.classList.toggle('active', b.dataset.id === id));
    document.getElementById('overlay-name').textContent = PROPS[id].name;
    rebuildProps(id);
    closeInfo();
};

// ─── TOGGLE CONTROLS ──────────────────────────────────────────────────────────
window.toggleSpin = function() {
    spinning = !spinning;
    const b = document.getElementById('btn-spin');
    b.textContent = spinning ? '⏸ Пауза' : '▶ Старт';
    b.classList.toggle('active', !spinning);
};

window.toggleBonds = function() {
    showBonds = !showBonds;
    bondMeshes.forEach(m => m.visible = showBonds);
    document.getElementById('btn-bonds').classList.toggle('active', showBonds);
};

window.toggleAngles = function() {
    if (currentId === 'o2') return;
    showAngles = !showAngles;
    angleMeshes.forEach(m => m.visible = showAngles);
    document.getElementById('btn-angles').classList.toggle('active', showAngles);
};

window.toggleLone = function() {
    showLone = !showLone;
    loneMeshes.forEach(m => m.visible = showLone);
    document.getElementById('btn-lone').classList.toggle('active', showLone);
};

// ─── INFO PANEL ───────────────────────────────────────────────────────────────
window.closeInfo = function() {
    document.getElementById('info-panel').classList.remove('open');
};

function openInfo(id) {
    const d = INFO[id];
    if (!d) return;
    document.getElementById('ip-title').textContent = d.title;
    const tag = document.getElementById('ip-tag');
    tag.textContent = d.tag;
    tag.className   = 'ip-tag ' + d.tagClass;
    document.getElementById('ip-body').innerHTML = d.body;
    document.getElementById('info-panel').classList.add('open');
}

// ─── MOUSE ────────────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse2    = new THREE.Vector2();

renderer.domElement.addEventListener('mousedown', e => {
    isDragging = false;
    dragStart  = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mousemove', e => {
    if (e.buttons === 1) {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) isDragging = true;
        mainGroup.rotation.y += dx * 0.009;
        mainGroup.rotation.x += dy * 0.009;
        dragStart = { x: e.clientX, y: e.clientY };
    }
    mouse2.x = (e.clientX / innerWidth)  * 2 - 1;
    mouse2.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse2, camera);
    renderer.domElement.style.cursor =
        raycaster.intersectObjects(clickables).length ? 'pointer' : 'default';
});

renderer.domElement.addEventListener('click', e => {
    if (isDragging) return;
    openInfo(currentId);
});

renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    camera.position.z = Math.max(6, Math.min(26, camera.position.z + e.deltaY * 0.013));
}, { passive: false });

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// ─── ANIMATION ────────────────────────────────────────────────────────────────
let t = 0;
function animate() {
    requestAnimationFrame(animate);
    t += 0.016;
    if (spinning) mainGroup.rotation.y += 0.0018; // slow rotation
    // gentle breathe for O₃
    if (currentId === 'o3') {
        mainGroup.scale.setScalar(1 + Math.sin(t * 0.9) * 0.014);
    } else {
        mainGroup.scale.setScalar(1);
    }
    renderer.render(scene, camera);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
const initG = buildO2();
mainGroup.add(initG);
rebuildProps('o2');
document.getElementById('overlay-name').textContent = 'O₂ — Кислород';

animate();
</script>
</body>
</html>
