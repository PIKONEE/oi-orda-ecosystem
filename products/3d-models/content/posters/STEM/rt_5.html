<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робот-Манипулятор — 3D Модель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e293b;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: #e2e8f0;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            color: #f97316;
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .control-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            width: 300px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            padding: 20px;
            z-index: 10;
            border-left: 4px solid #f97316;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .slider-group {
            margin-bottom: 15px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        .slider-group label span.value {
            color: #f97316;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #f97316;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #f97316;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #ea580c;
        }

        .info-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 220px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            padding: 15px;
            z-index: 10;
            border-right: 4px solid #3b82f6;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .stat-val {
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }

        .checkbox-item {
            margin-top: 10px;
            font-size: 13px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #aaa;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
<script>
(function(){
  var lang = new URLSearchParams(location.search).get('lang') || 'ru';
  var T = {
    ru: {
      title: '🤖 Робот-Манипулятор',
      lbl_j1: 'Поворот (База):', lbl_j2: 'Плечо:', lbl_j3: 'Локоть:', lbl_grip: 'Захват:',
      btn_wave: '👋 Помахать', btn_reset: 'Сброс', lbl_ik: 'Управление кликом (IK)',
      lbl_status: 'Статус:', hint: 'ЛКМ: Вращение • ПКМ: Панорама • Клик по столу: Движение руки',
      st_ready: 'ГОТОВ', st_moving: 'ДВИЖЕНИЕ', st_unreachable: 'НЕДОСТИЖИМО', st_anim: 'АНИМАЦИЯ'
    },
    kz: {
      title: '🤖 Робот-Манипулятор',
      lbl_j1: 'Айналу (Негіз):', lbl_j2: 'Иық:', lbl_j3: 'Шынтақ:', lbl_grip: 'Ұстағыш:',
      btn_wave: '👋 Бұлғау', btn_reset: 'Қалпына Келтіру', lbl_ik: 'Шерту арқылы басқару (IK)',
      lbl_status: 'Күй:', hint: 'ЛТБ: Айналдыру • ОТБ: Жылжыту • Столды шерту: Қол қозғалысы',
      st_ready: 'ДАЙЫН', st_moving: 'ҚОЗҒАЛЫС', st_unreachable: 'ҚОЛ ЖЕТПЕЙДІ', st_anim: 'АНИМАЦИЯ'
    },
    en: {
      title: '🤖 Robot Arm',
      lbl_j1: 'Rotation (Base):', lbl_j2: 'Shoulder:', lbl_j3: 'Elbow:', lbl_grip: 'Gripper:',
      btn_wave: '👋 Wave', btn_reset: 'Reset', lbl_ik: 'Click Control (IK)',
      lbl_status: 'Status:', hint: 'LMB: Rotate • RMB: Pan • Click Table: Move Arm',
      st_ready: 'READY', st_moving: 'MOVING', st_unreachable: 'UNREACHABLE', st_anim: 'ANIMATION'
    }
  };
  window._t = T[lang] || T.ru;
  document.addEventListener('DOMContentLoaded', function(){
    var t = window._t;
    document.querySelector('h1').textContent = t.title;
    document.getElementById('lbl-j1').textContent = t.lbl_j1;
    document.getElementById('lbl-j2').textContent = t.lbl_j2;
    document.getElementById('lbl-j3').textContent = t.lbl_j3;
    document.getElementById('lbl-grip').textContent = t.lbl_grip;
    document.getElementById('btn-wave').textContent = t.btn_wave;
    document.getElementById('btn-reset').textContent = t.btn_reset;
    document.querySelector('label[for="check-ik"]').textContent = t.lbl_ik;
    document.getElementById('lbl-stat-status').textContent = t.lbl_status;
    document.getElementById('stat-status').textContent = t.st_ready;
    document.getElementById('hint-text').textContent = t.hint;
  });
})();
</script>

<div id="canvas-container"></div>

<div class="header">
    <h1>🤖 Робот-Манипулятор</h1>
</div>

<div class="control-panel">
    <div class="slider-group">
        <label><span id="lbl-j1">Поворот (База):</span><span class="value" id="val-j1">0°</span></label>
        <input type="range" id="input-j1" min="-180" max="180" value="0">
    </div>
    <div class="slider-group">
        <label><span id="lbl-j2">Плечо:</span><span class="value" id="val-j2">0°</span></label>
        <input type="range" id="input-j2" min="-45" max="135" value="0">
    </div>
    <div class="slider-group">
        <label><span id="lbl-j3">Локоть:</span><span class="value" id="val-j3">45°</span></label>
        <input type="range" id="input-j3" min="-135" max="135" value="45">
    </div>
    <div class="slider-group">
        <label><span id="lbl-grip">Захват:</span><span class="value" id="val-grip">0%</span></label>
        <input type="range" id="input-grip" min="0" max="100" value="0">
    </div>

    <button class="btn" id="btn-wave">👋 Помахать</button>
    <button class="btn" id="btn-reset" style="background: #475569; margin-top: 10px;">Сброс</button>

    <div class="checkbox-item">
        <input type="checkbox" id="check-ik" checked>
        <label for="check-ik">Управление кликом (IK)</label>
    </div>
</div>

<div class="info-panel">
    <div class="stat-row"><span id="lbl-stat-status">Статус:</span> <span class="stat-val" id="stat-status"
                                                     style="color:#22c55e">ГОТОВ</span></div>
    <div class="stat-row"><span>X:</span> <span class="stat-val" id="stat-x">0</span></div>
    <div class="stat-row"><span>Y:</span> <span class="stat-val" id="stat-y">0</span></div>
    <div class="stat-row"><span>Z:</span> <span class="stat-val" id="stat-z">0</span></div>
</div>

<div class="hint" id="hint-text">ЛКМ: Вращение • ПКМ: Панорама • Клик по столу: Движение руки</div>

<!-- Three.js -->
<script type="importmap">
    {
        "imports": {
            "three": "../../libs/vendor/three-0.160.0/three.module.js",
            "three/addons/": "../../libs/vendor/three-0.160.0/addons/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

    // --- Config ---
    const CONFIG = {
        arm1: 20,
        arm2: 15,
        gripper: 6,
        colorBase: 0x475569,
        colorOrange: 0xf97316,
        colorBlack: 0x1e293b,
        colorSilver: 0xe2e8f0
    };

    let state = {
        j1: 0, j2: 0, j3: 45, grip: 0,
        targetJ1: 0, targetJ2: 0, targetJ3: 45,
        isAnimating: false
    };

    let scene, camera, renderer, controls;
    let baseGroup, turret, arm1, arm2, wrist, gripperL, gripperR;
    let ikHelper, trailLine, trailPoints = [];

    function init() {
        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.Fog(0x1e293b, 50, 500);

        // Camera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 50, 60);
        camera.lookAt(0, 10, 0);

        // Renderer
        renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        hemiLight.position.set(0, 50, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const spotLight = new THREE.SpotLight(0xf97316, 0.8);
        spotLight.position.set(-20, 30, -20);
        scene.add(spotLight);

        // Controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 20;
        controls.maxDistance = 200;
        controls.target.set(0, 10, 0);

        // Build
        createEnvironment();
        createRobot();

        // Listeners
        window.addEventListener('resize', onResize);
        window.addEventListener('mousedown', onMouseDown);
        setupUI();

        // Loop
        animate();
    }

    function createEnvironment() {
        // Floor
        const planeGeo = new THREE.PlaneGeometry(200, 200);
        const planeMat = new THREE.MeshPhongMaterial({color: 0x334155, depthWrite: false});
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        const grid = new THREE.GridHelper(200, 40, 0x000000, 0x000000);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        // Table
        const tableGeo = new THREE.BoxGeometry(60, 2, 40);
        const tableMat = new THREE.MeshPhongMaterial({color: 0xd4a373});
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.position.y = 1;
        table.receiveShadow = true;
        scene.add(table);

        // Axes Helper (Red=X, Green=Y, Blue=Z)
        const axes = new THREE.AxesHelper(10);
        axes.position.y = 2.1;
        scene.add(axes);

        // IK Marker
        ikHelper = new THREE.Mesh(
                new THREE.SphereGeometry(1),
                new THREE.MeshBasicMaterial({color: 0x22c55e, transparent: true, opacity: 0.8})
        );
        ikHelper.visible = false;
        scene.add(ikHelper);

        // Trail
        const trailGeo = new THREE.BufferGeometry();
        const trailMat = new THREE.LineBasicMaterial({color: 0xf97316});
        trailLine = new THREE.Line(trailGeo, trailMat);
        scene.add(trailLine);
    }

    function createRobot() {
        // Base
        baseGroup = new THREE.Group();
        baseGroup.position.y = 2; // On table
        scene.add(baseGroup);

        const baseMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(6, 7, 2, 32),
                new THREE.MeshPhongMaterial({color: CONFIG.colorBase})
        );
        baseMesh.position.y = 1;
        baseMesh.castShadow = true;
        baseGroup.add(baseMesh);

        // Turret (Yaw)
        turret = new THREE.Group();
        turret.position.y = 2;
        baseGroup.add(turret);

        const servo1 = new THREE.Mesh(
                new THREE.BoxGeometry(6, 4, 6),
                new THREE.MeshPhongMaterial({color: CONFIG.colorOrange})
        );
        servo1.position.y = 2;
        servo1.castShadow = true;
        turret.add(servo1);

        const bracket = new THREE.Mesh(
                new THREE.BoxGeometry(4, 4, 4),
                new THREE.MeshPhongMaterial({color: CONFIG.colorBlack})
        );
        bracket.position.y = 5;
        turret.add(bracket);

        // Arm 1
        arm1 = new THREE.Group();
        arm1.position.y = 5; // Pivot point
        turret.add(arm1);

        const link1 = new THREE.Mesh(
                new THREE.BoxGeometry(3, CONFIG.arm1, 2),
                new THREE.MeshPhongMaterial({color: CONFIG.colorSilver})
        );
        link1.position.y = CONFIG.arm1 / 2;
        link1.castShadow = true;
        arm1.add(link1);

        // Arm 2
        arm2 = new THREE.Group();
        arm2.position.y = CONFIG.arm1; // Pivot at end of Arm 1
        arm1.add(arm2);

        const servo2 = new THREE.Mesh(
                new THREE.CylinderGeometry(2.5, 2.5, 4, 16),
                new THREE.MeshPhongMaterial({color: CONFIG.colorBlack})
        );
        servo2.rotation.z = Math.PI / 2;
        arm2.add(servo2);

        const link2 = new THREE.Mesh(
                new THREE.BoxGeometry(2.5, CONFIG.arm2, 1.5),
                new THREE.MeshPhongMaterial({color: CONFIG.colorSilver})
        );
        link2.position.y = CONFIG.arm2 / 2;
        link2.castShadow = true;
        arm2.add(link2);

        // Wrist
        wrist = new THREE.Group();
        wrist.position.y = CONFIG.arm2;
        arm2.add(wrist);

        const servo3 = new THREE.Mesh(
                new THREE.BoxGeometry(3, 3, 3),
                new THREE.MeshPhongMaterial({color: 0x3b82f6})
        );
        wrist.add(servo3);

        // Gripper
        const gripBase = new THREE.Mesh(
                new THREE.BoxGeometry(4, 1, 1.5),
                new THREE.MeshPhongMaterial({color: CONFIG.colorBlack})
        );
        gripBase.position.y = 2;
        wrist.add(gripBase);

        gripperL = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 4, 1),
                new THREE.MeshPhongMaterial({color: CONFIG.colorBlack})
        );
        gripperL.position.set(-1.5, 4, 0);
        wrist.add(gripperL);

        gripperR = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 4, 1),
                new THREE.MeshPhongMaterial({color: CONFIG.colorBlack})
        );
        gripperR.position.set(1.5, 4, 0);
        wrist.add(gripperR);
    }

    function updatePhysics() {
        const speed = 0.1;
        state.j1 += (state.targetJ1 - state.j1) * speed;
        state.j2 += (state.targetJ2 - state.j2) * speed;
        state.j3 += (state.targetJ3 - state.j3) * speed;

        // Apply Rotations
        turret.rotation.y = THREE.MathUtils.degToRad(state.j1);
        arm1.rotation.z = THREE.MathUtils.degToRad(state.j2);
        arm2.rotation.z = THREE.MathUtils.degToRad(state.j3);

        // Gripper Animation
        const offset = 1.5 - (state.grip / 100) * 1.0;
        gripperL.position.x = -offset;
        gripperR.position.x = offset;

        // Sync Sliders
        if (Math.abs(state.targetJ1 - state.j1) > 0.5) document.getElementById('input-j1').value = state.j1;
        if (Math.abs(state.targetJ2 - state.j2) > 0.5) document.getElementById('input-j2').value = state.j2;
        if (Math.abs(state.targetJ3 - state.j3) > 0.5) document.getElementById('input-j3').value = state.j3;

        updateStats();
        updateTrail();
    }

    function updateStats() {
        document.getElementById('val-j1').innerText = Math.round(state.j1) + '°';
        document.getElementById('val-j2').innerText = Math.round(state.j2) + '°';
        document.getElementById('val-j3').innerText = Math.round(state.j3) + '°';

        const pos = new THREE.Vector3();
        wrist.getWorldPosition(pos);
        document.getElementById('stat-x').innerText = pos.x.toFixed(1);
        document.getElementById('stat-y').innerText = pos.y.toFixed(1);
        document.getElementById('stat-z').innerText = pos.z.toFixed(1);
    }

    function updateTrail() {
        const pos = new THREE.Vector3();
        wrist.getWorldPosition(pos);
        trailPoints.push(pos);
        if (trailPoints.length > 50) trailPoints.shift();

        const arr = new Float32Array(trailPoints.length * 3);
        for (let i = 0; i < trailPoints.length; i++) {
            arr[i * 3] = trailPoints[i].x;
            arr[i * 3 + 1] = trailPoints[i].y;
            arr[i * 3 + 2] = trailPoints[i].z;
        }
        trailLine.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    }

    function solveIK(target) {
        // Simple 2D IK in rotated plane
        const x = target.x;
        const z = target.z;
        const y = target.y;

        // 1. Base Yaw
        const j1 = Math.atan2(x, z);

        // 2. Planar IK
        const dist = Math.sqrt(x * x + z * z);
        const shoulderY = 7; // 2(base)+2(turret)+3(bracket) approx
        const dy = y - shoulderY;
        const dx = dist;

        const c = Math.sqrt(dx * dx + dy * dy);
        const a = CONFIG.arm1;
        const b = CONFIG.arm2 + 4; // wrist length

        if (c > a + b) return null;

        const alpha = Math.atan2(dy, dx);
        const beta = Math.acos((a * a + c * c - b * b) / (2 * a * c));
        const gamma = Math.acos((a * a + b * b - c * c) / (2 * a * b));

        const j2_rad = (Math.PI / 2) - (alpha + beta); // From vertical
        const j3_rad = Math.PI - gamma;

        return {
            j1: THREE.MathUtils.radToDeg(j1),
            j2: THREE.MathUtils.radToDeg(j2_rad),
            j3: THREE.MathUtils.radToDeg(j3_rad)
        };
    }

    function onMouseDown(e) {
        if (!document.getElementById('check-ik').checked) return;
        if (e.target.closest('.control-panel')) return;

        const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
        );
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(scene.children);

        for (let hit of intersects) {
            // Check if we hit table or floor
            if (hit.object.geometry && (hit.object.geometry.type === 'BoxGeometry' || hit.object.geometry.type === 'PlaneGeometry')) {
                const target = hit.point;
                target.y = Math.max(target.y, 0); // Don't go below floor

                ikHelper.position.copy(target);
                ikHelper.visible = true;

                // Aim slightly above target for wrist
                const sol = solveIK(new THREE.Vector3(target.x, target.y + 6, target.z));

                if (sol) {
                    state.targetJ1 = sol.j1;
                    state.targetJ2 = sol.j2;
                    state.targetJ3 = sol.j3;
                    document.getElementById('stat-status').innerText = window._t ? window._t.st_moving : "ДВИЖЕНИЕ";
                    document.getElementById('stat-status').style.color = "#f97316";
                } else {
                    document.getElementById('stat-status').innerText = window._t ? window._t.st_unreachable : "НЕДОСТИЖИМО";
                    document.getElementById('stat-status').style.color = "#ef4444";
                }
                break;
            }
        }
    }

    function runWave() {
        const seq = [
            {j1: 0, j2: -20, j3: -40},
            {j1: 0, j2: -20, j3: -10},
            {j1: 0, j2: -20, j3: -60},
            {j1: 0, j2: -20, j3: -10},
            {j1: 0, j2: -20, j3: -60},
            {j1: 0, j2: 0, j3: 45}
        ];

        let i = 0;
        const next = () => {
            if (i >= seq.length) {
                document.getElementById('stat-status').innerText = window._t ? window._t.st_ready : "ГОТОВ";
                return;
            }
            state.targetJ1 = seq[i].j1;
            state.targetJ2 = seq[i].j2;
            state.targetJ3 = seq[i].j3;
            i++;
            setTimeout(next, 400);
        };
        document.getElementById('stat-status').innerText = window._t ? window._t.st_anim : "АНИМАЦИЯ";
        next();
    }

    function setupUI() {
        document.getElementById('input-j1').addEventListener('input', e => state.targetJ1 = parseFloat(e.target.value));
        document.getElementById('input-j2').addEventListener('input', e => state.targetJ2 = parseFloat(e.target.value));
        document.getElementById('input-j3').addEventListener('input', e => state.targetJ3 = parseFloat(e.target.value));
        document.getElementById('input-grip').addEventListener('input', e => state.grip = parseFloat(e.target.value));

        document.getElementById('btn-wave').addEventListener('click', runWave);
        document.getElementById('btn-reset').addEventListener('click', () => {
            state.targetJ1 = 0;
            state.targetJ2 = 0;
            state.targetJ3 = 45;
            state.grip = 0;
            document.getElementById('input-grip').value = 0;
            ikHelper.visible = false;
        });
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        updatePhysics();
        controls.update();
        renderer.render(scene, camera);
    }

    // Run
    window.onload = init;

</script>
</body>
</html>
