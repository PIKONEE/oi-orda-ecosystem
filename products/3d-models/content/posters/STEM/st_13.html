<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робот: Логика и Среда</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e293b;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: #f1f5f9;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .control-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            width: 320px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            padding: 20px;
            z-index: 10;
            border-left: 4px solid #10b981;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .slider-group label span.value {
            color: #38bdf8;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }

        .btn-obstacle {
            background: #f59e0b;
        }

        .btn-obstacle:hover {
            background: #d97706;
        }

        .btn-secondary {
            background: #475569;
            margin-top: 10px;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sensor-box {
            padding: 10px;
            background: #334155;
            border-radius: 8px;
            border: 1px solid #475569;
            text-align: center;
        }

        .sensor-box.alert {
            background: #7f1d1d;
            border-color: #ef4444;
        }

        .sensor-box.info {
            background: #1e3a8a;
            border-color: #3b82f6;
        }

        .sensor-label {
            font-size: 10px;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .sensor-val {
            font-size: 14px;
            font-weight: bold;
            margin-top: 2px;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 5;
        }

        /* Robot Status Label */
        #robot-label {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            display: none;
            white-space: nowrap;
            border: 1px solid #38bdf8;
        }
    </style>
</head>

<!-- Three.js -->
<script type="importmap">
    {
        "imports": {
            "three": "../../libs/vendor/three-0.160.0/three.module.js",
            "three/addons/": "../../libs/vendor/three-0.160.0/addons/"
        }

</script>

<script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

    // --- Config ---
    const CONFIG = {
        worldSize: 200,
        robotSpeed: 0.8,
        robotTurnSpeed: 0.05,
        sensorRange: 35,
        stopDist: 10,
        colors: {
            normal: 0x334155,
            ice: 0x3b82f6,
            lava: 0xef4444
        }
    };

    // --- State ---
    let state = {
        running: false,
        pos: new THREE.Vector2(0, 0),
        angle: 0,
        currentSpeed: 0,
        currentTurn: 0,

        dist: 100,
        surface: 'normal',
        lightLevel: 1.0,
        mode: 'PATROL',

        reversing: false,
        reverseTimer: 0,
        patrolTimer: 0,
        patrolTurn: 0
    };

    // --- Globals ---
    let scene, camera, renderer, controls;
    let robotGroup, headLight, sensorRay;
    let sunLight, ambientLight;
    let obstaclesGroup;
    let wheelMeshes = [];
    const labelEl = document.getElementById('robot-label');

    function init() {
        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.Fog(0x1e293b, 50, 300);

        // Camera
        const aspect = window.innerWidth / window.innerHeight;
        camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
        camera.position.set(0, 80, 80);
        camera.lookAt(0, 0, 0);

        // Renderer
        renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // Controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        // Build
        createEnvironment();
        createRobot();

        // UI
        setupUI();
        window.addEventListener('resize', onResize);

        animate();
    }

    // --- Logic: Surface Check (Pure Math, No Canvas) ---
    function getSurfaceTypeMath(x, z) {
        // Ice Zone: Circle at (50, 50) radius 40
        const dx = x - 50;
        const dz = z - 50;
        if (dx * dx + dz * dz < 40 * 40) return 'ice';

        // Lava Zone: Rect from (-60, -60) width 60, height 60
        if (x > -60 && x < 0 && z > -60 && z < 0) return 'lava';

        // World Edge
        if (Math.abs(x) > 95 || Math.abs(z) > 95) return 'void';

        return 'normal';
    }

    function createEnvironment() {
        // Create Texture manually via Canvas for visuals ONLY
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Normal
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, 512, 512);

        // Ice (Matches Math logic above mapped to 0..512)
        // World 0,0 is Canvas 256,256. 200 units = 512 px. Scale = 2.56
        const scale = 512 / 200;
        const cx = 256;
        const cy = 256;

        // Ice Circle at (50, 50) -> (256 + 50*2.56, 256 + 50*2.56)
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(cx + 50 * scale, cy + 50 * scale, 40 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Lava Rect at (-60, -60) to (0, 0)
        ctx.fillStyle = '#ef4444';
        // Rect x: -60 -> 256 - 60*2.56
        ctx.fillRect(cx - 60 * scale, cy - 60 * scale, 60 * scale, 60 * scale);

        const tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = 16;

        // Floor Mesh
        const geo = new THREE.PlaneGeometry(CONFIG.worldSize, CONFIG.worldSize);
        geo.rotateX(-Math.PI / 2);
        const mat = new THREE.MeshStandardMaterial({map: tex, roughness: 0.8});
        const floor = new THREE.Mesh(geo, mat);
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid
        const grid = new THREE.GridHelper(CONFIG.worldSize, 20, 0x000000, 0x000000);
        grid.material.opacity = 0.1;
        grid.material.transparent = true;
        grid.position.y = 0.1;
        scene.add(grid);

        // Obstacles
        obstaclesGroup = new THREE.Group();
        scene.add(obstaclesGroup);
        spawnObstacle(40, -40);
        spawnObstacle(-40, 40);
    }

    window.spawnObstacle = function (x, z) {
        if (x === undefined) {
            // In front of robot
            const dist = 25 + Math.random() * 10;
            x = state.pos.x + Math.sin(state.angle) * dist;
            z = state.pos.y + Math.cos(state.angle) * dist;
        }
        const h = 5 + Math.random() * 5;
        const geo = new THREE.BoxGeometry(6, h, 6);
        const mat = new THREE.MeshStandardMaterial({color: 0x64748b});
        const box = new THREE.Mesh(geo, mat);
        box.position.set(x, h / 2, z);
        box.castShadow = true;
        obstaclesGroup.add(box);
    }

    function createRobot() {
        robotGroup = new THREE.Group();
        scene.add(robotGroup);

        // Body
        const body = new THREE.Mesh(
                new THREE.BoxGeometry(5, 2, 7),
                new THREE.MeshStandardMaterial({color: 0xf59e0b}) // Orange
        );
        body.position.y = 1.5;
        body.castShadow = true;
        robotGroup.add(body);

        // Wheels
        const wGeo = new THREE.CylinderGeometry(1.5, 1.5, 1, 16);
        const wMat = new THREE.MeshStandardMaterial({color: 0x111111});
        const addWheel = (x, z) => {
            const w = new THREE.Mesh(wGeo, wMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(x, 1.5, z);
            w.castShadow = true;
            robotGroup.add(w);
            wheelMeshes.push(w);
        };
        addWheel(3, 2);
        addWheel(-3, 2);
        addWheel(3, -2);
        addWheel(-3, -2);

        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 2), new THREE.MeshStandardMaterial({color: 0x333333}));
        head.position.set(0, 3, 2);
        robotGroup.add(head);

        // Lights
        headLight = new THREE.SpotLight(0xffffee, 0);
        headLight.angle = Math.PI / 4;
        headLight.penumbra = 0.5;
        headLight.position.set(0, 3, 3);
        headLight.target.position.set(0, 0, 20);
        robotGroup.add(headLight);
        robotGroup.add(headLight.target);

        // Sensor Ray
        const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 1)]);
        sensorRay = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({color: 0x00ff00}));
        sensorRay.position.set(0, 3, 3);
        robotGroup.add(sensorRay);
    }

    // --- Logic ---
    function updateSensors() {
        if (!robotGroup) return;

        // 1. Raycast
        const origin = new THREE.Vector3(0, 3, 0).applyMatrix4(robotGroup.matrixWorld);
        const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(robotGroup.quaternion);

        const raycaster = new THREE.Raycaster(origin, dir, 0, CONFIG.sensorRange);
        const intersects = raycaster.intersectObjects(obstaclesGroup.children);

        if (intersects.length > 0) {
            state.dist = intersects[0].distance;
            sensorRay.scale.z = state.dist;
            sensorRay.material.color.setHex(0xff0000);
        } else {
            state.dist = 100;
            sensorRay.scale.z = 10;
            sensorRay.material.color.setHex(0x00ff00);
        }

        // 2. Surface
        state.surface = getSurfaceTypeMath(robotGroup.position.x, robotGroup.position.z);
        state.lightLevel = sunLight.intensity;
    }

    function updateLogic() {
        // Light Check
        headLight.intensity = state.lightLevel < 0.3 ? 2.0 : 0;

        let targetSpeed = CONFIG.robotSpeed;
        let targetTurn = 0;
        let newMode = 'PATROL';

        // Priority Logic
        if (state.surface === 'lava' || state.surface === 'void') {
            newMode = 'ESCAPE';
            state.reversing = true;
            state.reverseTimer = 60;
        } else if (state.dist < CONFIG.stopDist) {
            newMode = 'AVOID';
        }

        // State Machine
        if (state.reversing) {
            newMode = 'ESCAPE';
            targetSpeed = -CONFIG.robotSpeed * 0.5;
            targetTurn = CONFIG.robotTurnSpeed * 1.5;
            if (state.surface === 'normal' && state.reverseTimer-- <= 0) state.reversing = false;
        } else if (newMode === 'AVOID') {
            targetSpeed = 0;
            targetTurn = -CONFIG.robotTurnSpeed; // Spin right
        } else if (state.surface === 'ice') {
            newMode = 'SLOW';
            targetSpeed *= 0.3;
            targetTurn = Math.sin(Date.now() * 0.003) * 0.02; // Slip
        } else {
            // Normal Patrol
            targetTurn = Math.sin(Date.now() * 0.001) * 0.01; // Gentle wander
        }

        state.mode = newMode;

        if (state.running) {
            // Apply inertia
            state.currentSpeed += (targetSpeed - state.currentSpeed) * 0.1;
            state.currentTurn += (targetTurn - state.currentTurn) * 0.1;

            state.angle += state.currentTurn;

            // Move
            state.pos.x += Math.sin(state.angle) * state.currentSpeed;
            state.pos.y += Math.cos(state.angle) * state.currentSpeed;

            robotGroup.position.set(state.pos.x, 1.5, state.pos.y);
            robotGroup.rotation.y = state.angle;

            // Animate wheels
            wheelMeshes.forEach(w => w.rotation.x -= state.currentSpeed * 0.5);
        }

        updateUI();
    }

    function updateUI() {
        var _ui = window._t || {mUnit:'м', far_dist:'> 30м', surf_danger:'ОПАСНОСТЬ', surf_ice:'ЛЕД', surf_normal:'НОРМА', mode_labels:{PATROL:'ПАТРУЛЬ',ESCAPE:'ЭВАКУАЦИЯ',AVOID:'ОБХОД',SLOW:'ЛЕД'}};
        document.getElementById('val-dist').innerText = state.dist < 99 ? state.dist.toFixed(1) + _ui.mUnit : _ui.far_dist;

        const surfEl = document.getElementById('val-surf');
        const boxSurf = document.getElementById('sens-surf');
        if (state.surface === 'lava') {
            surfEl.innerText = _ui.surf_danger;
            surfEl.style.color = "#ef4444";
            boxSurf.className = "sensor-box alert";
        } else if (state.surface === 'ice') {
            surfEl.innerText = _ui.surf_ice;
            surfEl.style.color = "#3b82f6";
            boxSurf.className = "sensor-box info";
        } else {
            surfEl.innerText = _ui.surf_normal;
            surfEl.style.color = "#fff";
            boxSurf.className = "sensor-box";
        }

        var modeDisplay = (_ui.mode_labels && _ui.mode_labels[state.mode]) || state.mode;
        document.getElementById('val-light').innerText = Math.round(state.lightLevel * 100) + '%';
        document.getElementById('val-state').innerText = modeDisplay;

        // Label follows robot
        if (robotGroup) {
            const vec = new THREE.Vector3(0, 5, 0).applyMatrix4(robotGroup.matrixWorld).project(camera);
            const x = (vec.x * .5 + .5) * window.innerWidth;
            const y = (-(vec.y * .5) + .5) * window.innerHeight;
            labelEl.style.display = 'block';
            labelEl.style.left = x + 'px';
            labelEl.style.top = y + 'px';
            labelEl.innerText = modeDisplay;
            labelEl.style.borderColor = (state.mode === 'ESCAPE' || state.mode === 'AVOID') ? '#ef4444' : '#38bdf8';
        }
    }

    // --- Interaction ---
    window.toggleSim = () => {
        state.running = !state.running;
        var _b = window._t || {btn_pause:'⏸ ПАУЗА', btn_start:'▶ СТАРТ'};
        document.getElementById('btn-toggle').innerText = state.running ? _b.btn_pause : _b.btn_start;
    };

    window.resetSim = () => {
        state.pos.set(0, 0);
        state.angle = 0;
        state.running = false;
        robotGroup.position.set(0, 1.5, 0);
        robotGroup.rotation.set(0, 0, 0);
        document.getElementById('btn-toggle').innerText = window._t ? window._t.btn_start : "▶ СТАРТ";

        // Clear obstacles
        while (obstaclesGroup.children.length > 0) obstaclesGroup.remove(obstaclesGroup.children[0]);
    };

    function setupUI() {
        document.getElementById('input-time').addEventListener('input', (e) => {
            const h = parseFloat(e.target.value);
            let intensity = 1 - Math.abs(12 - h) / 10;
            intensity = Math.max(0.1, Math.min(1.0, intensity));
            sunLight.intensity = intensity;
            ambientLight.intensity = intensity * 0.6;

            const col = new THREE.Color(0x0f172a).lerp(new THREE.Color(0x3b82f6), intensity * 0.5);
            scene.background = col;
            scene.fog.color = col;
            document.getElementById('disp-time').innerText = `${Math.floor(h)}:00`;
        });
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (robotGroup) {
            updateSensors();
            updateLogic();

            // Camera follow
            controls.target.lerp(robotGroup.position, 0.1);
        }
        controls.update();
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
