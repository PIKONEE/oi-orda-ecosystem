<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Преобразования графиков функций</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f3f3f7;--surface:rgba(255,255,255,0.94);--border:rgba(25,25,55,0.08);
  --text:#171627;--muted:#63627a;--faint:#a3a1b4;
  --accent:#0d9488;--accent-dim:rgba(13,148,136,0.10);
  --base:#94a3b8;--curve:#0d9488;--pt:#ea580c;
  --shadow:0 2px 22px rgba(30,25,80,0.07);--shadow-lg:0 18px 56px rgba(35,28,90,0.15);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 760px at 70% 30%, rgba(13,148,136,0.10), transparent 60%),radial-gradient(820px 560px at 16% 84%, rgba(234,88,12,0.05), transparent 55%);}
#canvas-container{position:fixed;inset:0;z-index:1;}
#labels-layer{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}
.dim-label{position:absolute;transform:translate(-50%,-50%);font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;letter-spacing:-0.3px;background:rgba(255,255,255,0.97);box-shadow:0 3px 12px rgba(30,25,80,0.13);transition:opacity 0.18s;}
.dim-label.hidden{opacity:0;}
.dim-label.lpt{background:var(--pt);color:#fff;border:none;box-shadow:0 3px 12px rgba(234,88,12,0.42);font-size:14.5px;}
.dim-label.lbase{background:var(--base);color:#fff;border:none;box-shadow:0 3px 12px rgba(100,116,139,0.4);}
.dim-label.lax{color:var(--muted);border:1px solid rgba(25,25,55,0.12);font-weight:700;}
.header{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);padding:0 38px;height:84px;display:flex;align-items:center;gap:15px;box-shadow:var(--shadow);}
.h-badge{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#0d9488,#2dd4bf);display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(13,148,136,0.36);}
.h-badge svg{width:25px;height:25px;}
.header-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.header-tag{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--accent);background:var(--accent-dim);padding:4px 11px;border-radius:8px;}
.header-sub{font-size:14px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45;}
.eq-banner{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:10px 24px;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:var(--text);pointer-events:none;}
.eq-banner b{color:var(--accent);}
.panel{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);}
.panel h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);}
.panel-left{left:22px;top:98px;width:336px;padding:18px 18px;overflow:hidden;min-height:300px;}
.ld-list,.ld-detail{transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.28s;}
.ld-list h3{margin-bottom:12px;padding-left:4px;}
.ld-detail{position:absolute;inset:18px 18px;transform:translateX(26px);opacity:0;pointer-events:none;overflow-y:auto;}
.panel-left.detail .ld-list{transform:translateX(-26px);opacity:0;pointer-events:none;}
.panel-left.detail .ld-detail{transform:translateX(0);opacity:1;pointer-events:auto;}
.metric{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;margin-bottom:2px;}
.metric:hover{background:rgba(30,25,80,0.04);}
.metric.active{background:var(--accent-dim);border-color:rgba(13,148,136,0.22);}
.metric-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.metric-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.metric-name{font-size:15px;font-weight:700;line-height:1.15;}
.metric-sub{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--muted);}
.metric-val{font-family:'Roboto Mono',monospace;font-size:21px;font-weight:500;color:var(--accent);letter-spacing:-1px;flex-shrink:0;}
.ld-back{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--accent);padding:4px 6px 4px 0;margin-bottom:12px;}
.d-tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:10px;background:var(--accent-dim);color:var(--accent);}
.d-title{font-size:22px;font-weight:800;letter-spacing:-0.4px;line-height:1.15;margin-bottom:14px;}
.d-bigval{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;}
.d-bigval b{font-family:'Roboto Mono',monospace;font-size:35px;font-weight:500;color:var(--accent);letter-spacing:-1px;line-height:1;}
.d-bigval span{font-size:14px;color:var(--muted);font-weight:600;}
.d-formula{margin:13px 0 4px;padding:13px 15px;border-radius:13px;background:linear-gradient(135deg,rgba(45,212,191,0.13),rgba(13,148,136,0.05));border:1px solid rgba(13,148,136,0.16);font-family:'Roboto Mono',monospace;font-size:14px;color:#0f766e;font-weight:500;line-height:1.95;white-space:pre-line;}
.d-para{font-size:15px;line-height:1.62;color:#2a2735;margin-top:13px;}
.panel-right{right:22px;top:98px;width:300px;padding:18px;}
.seg-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:2px 2px 9px;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.mode-btn{padding:11px 5px;border-radius:13px;border:1.5px solid var(--border);background:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:5px;}
.mode-btn svg{width:30px;height:24px;}
.mode-btn:hover{border-color:var(--accent);}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.sliders{margin-bottom:6px;}
.sl-row{margin-bottom:12px;}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.sl-name{font-size:14px;font-weight:700;}.sl-name b{font-family:'Roboto Mono',monospace;font-style:italic;color:var(--accent);}
.sl-val{font-family:'Roboto Mono',monospace;font-size:16px;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:2px 9px;border-radius:8px;}
.sliders input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(13,148,136,0.16) var(--fill,50%));outline:none;cursor:pointer;}
.sliders input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(13,148,136,0.4);cursor:pointer;transition:transform 0.12s;}
.sliders input::-webkit-slider-thumb:hover{transform:scale(1.16);}
.show-chip{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;margin-top:6px;border-radius:14px;cursor:pointer;background:rgba(30,25,80,0.035);border:1.5px solid transparent;transition:all 0.16s;}
.show-chip:hover{background:rgba(30,25,80,0.06);}
.show-chip.on{background:var(--accent-dim);border-color:rgba(13,148,136,0.30);}
.chip-ico{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(13,148,136,0.10);transition:all 0.16s;}
.show-chip.on .chip-ico{background:var(--accent);}
.chip-text{flex:1;min-width:0;}.chip-name{font-size:14px;font-weight:700;}.chip-sub{font-size:11.5px;color:var(--muted);font-family:'Roboto Mono',monospace;}
.chip-state{width:21px;height:21px;border-radius:50%;flex-shrink:0;border:2px solid rgba(30,25,80,0.16);display:flex;align-items:center;justify-content:center;transition:all 0.16s;}
.show-chip.on .chip-state{background:var(--accent);border-color:var(--accent);}
.show-chip.on .chip-state::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.hint-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:9px 22px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:9px;}
.hint-grab{color:var(--accent);font-weight:700;}.hint-dot{color:var(--faint);}
@media (max-width:1180px){.panel-left{width:300px;}.panel-right{width:276px;}}
</style>
</head>
<body>
<div id="canvas-container"><canvas id="c"></canvas></div>
<div id="labels-layer"></div>
<header class="header">
  <div class="h-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 L3 3 M3 21 L21 21"/><path d="M5 17 C 9 5, 13 5, 20 16" /></svg></div>
  <div class="header-title" data-i18n="header_title">Преобразования графиков</div>
  <div class="header-tag">y = a·f(x−p)+q</div>
  <div class="header-sub" data-i18n-html="header_sub">Двигайте a, p, q — и базовый график<br>растягивается, сдвигается, отражается</div>
</header>
<div class="eq-banner" id="eq-banner"></div>
<div class="panel panel-left" id="panel-left">
  <div class="ld-list"><h3 data-i18n="props_title">Характеристики</h3><div id="metrics"></div></div>
  <div class="ld-detail"><button class="ld-back" onclick="window.showList()"><span>‹</span> <span data-i18n="back">Назад</span></button><div id="detail-content"></div></div>
</div>
<div class="panel panel-right">
  <div class="seg-title" data-i18n="fn_title">Базовая функция</div>
  <div class="mode-grid" id="fn-grid"></div>
  <div class="sliders" id="sliders"></div>
  <div class="show-chip on" id="chip-base" onclick="window.toggleBase()"><div class="chip-ico">∿</div><div class="chip-text"><span class="chip-name" data-i18n="ch_base">Базовый график</span><span class="chip-sub" data-i18n="ch_base_sub">до преобразования</span></div><div class="chip-state"></div></div>
  <div class="show-chip on" id="chip-anchor" onclick="window.toggleAnchor()"><div class="chip-ico">⌖</div><div class="chip-text"><span class="chip-name" data-i18n="ch_anchor">Опорная точка</span><span class="chip-sub" data-i18n="ch_anchor_sub">(0;0) → (p;q)</span></div><div class="chip-state"></div></div>
</div>
<div class="hint-bar" data-i18n-html="hint"><span class="hint-grab">Двигайте ползунки</span><span class="hint-dot">·</span><span>фон — поворот</span><span class="hint-dot">·</span><span>клик по строке — пояснение</span></div>

<script>
const FNS=['sq','abs','cubic'];
const ICONS={
  sq:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3 C 9 22, 21 22, 27 3"/></svg>',
  abs:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 4 L15 21 L27 4"/></svg>',
  cubic:'<svg viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21 C 12 21, 11 4, 26 3" transform="rotate(8 15 12)"/></svg>'};
const FBASE={sq:t=>t*t,abs:t=>Math.abs(t),cubic:t=>t*t*t};
const FSTR={sq:'x²',abs:'|x|',cubic:'x³'};
const SL=[['a','s_a',-3,3,0.25],['p','s_p',-6,6,0.5],['q','s_q',-6,6,0.5]];
const I18N={
ru:{page_title:'Преобразования графиков функций',header_title:'Преобразования графиков',
  header_sub:'Двигайте a, p, q — и базовый график<br>растягивается, сдвигается, отражается',
  props_title:'Характеристики',back:'Назад',fn_title:'Базовая функция',
  ch_base:'Базовый график',ch_base_sub:'до преобразования',ch_anchor:'Опорная точка',ch_anchor_sub:'(0;0) → (p;q)',
  hint:'<span class="hint-grab">Двигайте ползунки</span><span class="hint-dot">·</span><span>фон — поворот</span><span class="hint-dot">·</span><span>клик по строке — пояснение</span>',
  fn_sq:'Парабола',fn_abs:'Модуль',fn_cubic:'Кубическая',
  m_a:'Коэффициент a',m_p:'Сдвиг по x',m_q:'Сдвиг по y',m_anchor:'Опорная точка',
  sub_a:'растяжение / отражение',sub_p:'p (по горизонтали)',sub_q:'q (по вертикали)',sub_anchor:'(0;0) переходит в',
  s_a:'коэффициент a',s_p:'сдвиг p (по x)',s_q:'сдвиг q (по y)',
  about_a:'a — коэффициент при функции. Если |a|>1, график растягивается вертикально (становится «круче»); если |a|<1 — сжимается. При a<0 график отражается относительно оси x.',
  about_p:'p — сдвиг вдоль оси x. В записи f(x − p): при p>0 график сдвигается вправо, при p<0 — влево. Внимание: «минус» в скобке даёт сдвиг вправо.',
  about_q:'q — сдвиг вдоль оси y. Прибавляя q ко всей функции, мы поднимаем график вверх (q>0) или опускаем вниз (q<0).',
  about_anchor:'Опорная (характерная) точка базового графика — например, вершина параболы (0;0) — после преобразования попадает в точку (p; q). Коэффициент a на её положение не влияет.',
  dir_right:'вправо',dir_left:'влево',dir_up:'вверх',dir_down:'вниз',dir_refl:'отражение',
},
kz:{page_title:'Функциялар графиктерін түрлендіру',header_title:'Графиктерді түрлендіру',
  header_sub:'a, p, q-ны жылжытыңыз — базалық график<br>созылады, жылжиды, шағылысады',
  props_title:'Сипаттамалар',back:'Артқа',fn_title:'Базалық функция',
  ch_base:'Базалық график',ch_base_sub:'түрлендіруге дейін',ch_anchor:'Тірек нүкте',ch_anchor_sub:'(0;0) → (p;q)',
  hint:'<span class="hint-grab">Ползунктерді жылжытыңыз</span><span class="hint-dot">·</span><span>фон — бұру</span><span class="hint-dot">·</span><span>жолды басу — түсіндірме</span>',
  fn_sq:'Парабола',fn_abs:'Модуль',fn_cubic:'Кубтық',
  m_a:'Коэффициент a',m_p:'x бойынша ығысу',m_q:'y бойынша ығысу',m_anchor:'Тірек нүкте',
  sub_a:'созу / шағылысу',sub_p:'p (көлденеңінен)',sub_q:'q (тігінен)',sub_anchor:'(0;0) көшетін нүкте',
  s_a:'коэффициент a',s_p:'ығысу p (x)',s_q:'ығысу q (y)',
  about_a:'a — функция алдындағы коэффициент. |a|>1 болса, график тік бойымен созылады («тіктеу» болады); |a|<1 болса — сығылады. a<0 болғанда график x осіне қатысты шағылысады.',
  about_p:'p — x осі бойынша ығысу. f(x − p) жазуында: p>0 болса график оңға, p<0 болса солға жылжиды. Назар аударыңыз: жақшадағы «минус» оңға ығысуды береді.',
  about_q:'q — y осі бойынша ығысу. Бүкіл функцияға q қосып, графикті жоғары (q>0) немесе төмен (q<0) жылжытамыз.',
  about_anchor:'Базалық графиктің тірек (сипатты) нүктесі — мысалы, параболаның төбесі (0;0) — түрлендіруден кейін (p; q) нүктесіне көшеді. a коэффициенті оның орнына әсер етпейді.',
  dir_right:'оңға',dir_left:'солға',dir_up:'жоғары',dir_down:'төмен',dir_refl:'шағылысу',
},
en:{page_title:'Graph Transformations',header_title:'Graph Transformations',
  header_sub:'Move a, p, q — and the base graph<br>stretches, shifts and reflects',
  props_title:'Properties',back:'Back',fn_title:'Base function',
  ch_base:'Base graph',ch_base_sub:'before the transform',ch_anchor:'Anchor point',ch_anchor_sub:'(0;0) → (p;q)',
  hint:'<span class="hint-grab">Move the sliders</span><span class="hint-dot">·</span><span>background — rotate</span><span class="hint-dot">·</span><span>click a row — explanation</span>',
  fn_sq:'Parabola',fn_abs:'Modulus',fn_cubic:'Cubic',
  m_a:'Coefficient a',m_p:'Shift along x',m_q:'Shift along y',m_anchor:'Anchor point',
  sub_a:'stretch / reflection',sub_p:'p (horizontal)',sub_q:'q (vertical)',sub_anchor:'(0;0) maps to',
  s_a:'coefficient a',s_p:'shift p (x)',s_q:'shift q (y)',
  about_a:'a is the coefficient in front of the function. If |a|>1 the graph stretches vertically (gets "steeper"); if |a|<1 it compresses. When a<0 the graph reflects across the x-axis.',
  about_p:'p is the shift along the x-axis. In f(x − p): when p>0 the graph moves right, when p<0 it moves left. Note: the minus inside the brackets gives a shift to the right.',
  about_q:'q is the shift along the y-axis. Adding q to the whole function raises the graph up (q>0) or lowers it down (q<0).',
  about_anchor:'The anchor (key) point of the base graph — e.g. the vertex of the parabola (0;0) — after the transformation lands at (p; q). The coefficient a does not affect its position.',

}
};
const LANG=(()=>{const q=new URLSearchParams(location.search).get('lang');return(q&&I18N[q])?q:'ru';})();
const tr=key=>(I18N[LANG]&&I18N[LANG][key])!==undefined?I18N[LANG][key]:I18N.ru[key];
function applyStaticI18N(){document.documentElement.lang=LANG;const tv=tr('page_title');if(tv)document.title=tv;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=tr(el.getAttribute('data-i18n'));if(v!==undefined)el.textContent=v;});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{const v=tr(el.getAttribute('data-i18n-html'));if(v!==undefined)el.innerHTML=v;});}
applyStaticI18N();
const fmtN=x=>{let r=Math.round(x*100)/100;if(Object.is(r,-0))r=0;return r.toString();};
window.A={fn:'sq',a:1.5,p:2,q:1};
function ftrans(x){return window.A.a*FBASE[window.A.fn](x-window.A.p)+window.A.q;}
const METRICS=[
  {key:'a',dot:'var(--accent)',i:'m_a',fmt:()=>fmtN(window.A.a),sub:()=>tr('sub_a')},
  {key:'p',dot:'#64748b',i:'m_p',fmt:()=>fmtN(window.A.p),sub:()=>tr('sub_p')},
  {key:'q',dot:'#64748b',i:'m_q',fmt:()=>fmtN(window.A.q),sub:()=>tr('sub_q')},
  {key:'anchor',dot:'var(--pt)',i:'m_anchor',fmt:()=>'('+fmtN(window.A.p)+'; '+fmtN(window.A.q)+')',sub:()=>tr('sub_anchor')},
];
function bannerStr(){const a=fmtN(window.A.a),p=window.A.p,q=window.A.q,fn=window.A.fn;
  const inner=p===0?'x':(p>0?`x−${fmtN(p)}`:`x+${fmtN(-p)}`);
  const body=fn==='abs'?`|${inner}|`:`(${inner})${fn==='sq'?'²':'³'}`;
  const tail=q===0?'':(q>0?` + ${fmtN(q)}`:` − ${fmtN(-q)}`);
  return `y = ${a}·<b>${body}</b>${tail}`;}
function renderMetrics(){document.getElementById('metrics').innerHTML=METRICS.map(m=>`
  <div class="metric" data-key="${m.key}" onclick="window.openDetail('${m.key}')"><div class="metric-dot" style="background:${m.dot}"></div>
  <div class="metric-main"><span class="metric-name">${tr(m.i)}</span><span class="metric-sub" id="ms-${m.key}"></span></div>
  <span class="metric-val" id="mv-${m.key}">—</span></div>`).join('');}
