<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Симметрия</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f3f2f6;--surface:rgba(255,255,255,0.94);--border:rgba(30,20,55,0.08);
  --text:#1b1525;--muted:#6b6377;--faint:#a59cb2;
  --fig:#7c3aed;--img:#e11d48;--h:#ea580c;
  --accent:#7c3aed;--accent-dim:rgba(124,58,237,0.10);
  --shadow:0 2px 22px rgba(40,25,80,0.07);--shadow-lg:0 18px 56px rgba(45,28,90,0.15);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 760px at 70% 30%, rgba(167,139,250,0.12), transparent 60%),radial-gradient(820px 560px at 16% 84%, rgba(225,29,72,0.05), transparent 55%);}
#canvas-container{position:fixed;inset:0;z-index:1;}
#labels-layer{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}
.dim-label{position:absolute;transform:translate(-50%,-50%);font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;letter-spacing:-0.3px;background:rgba(255,255,255,0.97);box-shadow:0 3px 12px rgba(40,25,80,0.13);transition:opacity 0.18s;}
.dim-label.hidden{opacity:0;}
.dim-label.la{background:var(--fig);color:#fff;border:none;box-shadow:0 3px 12px rgba(124,58,237,0.4);}
.dim-label.li{background:var(--img);color:#fff;border:none;box-shadow:0 3px 12px rgba(225,29,72,0.4);}
.dim-label.lo{background:var(--h);color:#fff;border:none;box-shadow:0 3px 12px rgba(234,88,12,0.4);}
.header{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);padding:0 38px;height:84px;display:flex;align-items:center;gap:15px;box-shadow:var(--shadow);}
.h-badge{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(124,58,237,0.36);}
.h-badge svg{width:25px;height:25px;}
.header-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.header-tag{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--accent);background:var(--accent-dim);padding:4px 11px;border-radius:8px;}
.header-sub{font-size:14px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45;}
.eq-banner{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:10px 24px;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:var(--text);pointer-events:none;}
.eq-banner b{color:var(--img);}
.panel{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);}
.panel h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);}
.panel-left{left:22px;top:98px;width:330px;padding:18px 18px;overflow:hidden;min-height:280px;}
.ld-list,.ld-detail{transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.28s;}
.ld-list h3{margin-bottom:12px;padding-left:4px;}
.ld-detail{position:absolute;inset:18px 18px;transform:translateX(26px);opacity:0;pointer-events:none;overflow-y:auto;}
.panel-left.detail .ld-list{transform:translateX(-26px);opacity:0;pointer-events:none;}
.panel-left.detail .ld-detail{transform:translateX(0);opacity:1;pointer-events:auto;}
.metric{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;margin-bottom:2px;}
.metric:hover{background:rgba(40,25,80,0.04);}
.metric.active{background:var(--accent-dim);border-color:rgba(124,58,237,0.22);}
.metric-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.metric-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.metric-name{font-size:15px;font-weight:700;line-height:1.15;}
.metric-sub{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--muted);}
.metric-val{font-family:'Roboto Mono',monospace;font-size:21px;font-weight:500;color:var(--accent);letter-spacing:-1px;flex-shrink:0;}
.ld-back{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--accent);padding:4px 6px 4px 0;margin-bottom:12px;}
.d-tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:10px;background:var(--accent-dim);color:var(--accent);}
.d-title{font-size:22px;font-weight:800;letter-spacing:-0.4px;line-height:1.15;margin-bottom:14px;}
.d-bigval{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;}
.d-bigval b{font-family:'Roboto Mono',monospace;font-size:35px;font-weight:500;color:var(--accent);letter-spacing:-1px;line-height:1;}
.d-bigval span{font-size:14px;color:var(--muted);font-weight:600;}
.d-formula{margin:13px 0 4px;padding:13px 15px;border-radius:13px;background:linear-gradient(135deg,rgba(167,139,250,0.12),rgba(124,58,237,0.05));border:1px solid rgba(124,58,237,0.16);font-family:'Roboto Mono',monospace;font-size:14px;color:#5b21b6;font-weight:500;line-height:1.95;white-space:pre-line;}
.d-para{font-size:15px;line-height:1.62;color:#2c2735;margin-top:13px;}
.panel-right{right:22px;top:98px;width:300px;padding:18px;}
.seg-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:2px 2px 9px;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.mode-grid.three{grid-template-columns:1fr 1fr 1fr;}
.mode-btn{padding:11px 6px;border-radius:13px;border:1.5px solid var(--border);background:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.mode-btn svg{width:26px;height:20px;}
.mode-btn:hover{border-color:var(--accent);}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.sliders{margin-bottom:6px;}
.sl-row{margin-bottom:11px;}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.sl-name{font-size:14px;font-weight:700;}.sl-name b{font-family:'Roboto Mono',monospace;font-style:italic;color:var(--accent);}
.sl-val{font-family:'Roboto Mono',monospace;font-size:16px;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:2px 9px;border-radius:8px;}
.sliders input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(124,58,237,0.16) var(--fill,50%));outline:none;cursor:pointer;}
.sliders input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(124,58,237,0.4);cursor:pointer;transition:transform 0.12s;}
.sliders input::-webkit-slider-thumb:hover{transform:scale(1.16);}
.show-chip{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;margin-top:6px;border-radius:14px;cursor:pointer;background:rgba(40,25,80,0.035);border:1.5px solid transparent;transition:all 0.16s;}
.show-chip:hover{background:rgba(40,25,80,0.06);}
.show-chip.on{background:var(--accent-dim);border-color:rgba(124,58,237,0.30);}
.chip-ico{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(124,58,237,0.10);transition:all 0.16s;}
.show-chip.on .chip-ico{background:var(--accent);}
.chip-text{flex:1;min-width:0;}.chip-name{font-size:14.5px;font-weight:700;}.chip-sub{font-size:12.5px;color:var(--muted);font-family:'Roboto Mono',monospace;}
.chip-state{width:21px;height:21px;border-radius:50%;flex-shrink:0;border:2px solid rgba(40,25,80,0.16);display:flex;align-items:center;justify-content:center;transition:all 0.16s;}
.show-chip.on .chip-state{background:var(--accent);border-color:var(--accent);}
.show-chip.on .chip-state::after{content:'✓';color:#fff;font-size:13px;font-weight:700;}
.hint-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:9px 22px;font-size:13.5px;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:9px;}
.hint-grab{color:var(--accent);font-weight:700;}.hint-dot{color:var(--faint);}
@media (max-width:1180px){.panel-left{width:296px;}.panel-right{width:272px;}}
</style>
</head>
<body>
<div id="canvas-container"><canvas id="c"></canvas></div>
<div id="labels-layer"></div>
<header class="header">
  <div class="h-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3 L12 21"/><path d="M5 7 L9 12 L5 17 Z"/><path d="M19 7 L15 12 L19 17 Z"/></svg></div>

</div>
<div class="hint-bar" data-i18n-html="hint"><span class="hint-grab">Двигайте ось / центр</span><span class="hint-dot">·</span><span>фон — поворот</span><span class="hint-dot">·</span><span>клик по строке — пояснение</span></div>

<script>
const TYPES=['axial','central'];

  m_dist:'Расстояние d',m_side:'Сторона |AB|',m_perim:'Периметр P',

  s_angle:'угол оси',s_shift:'сдвиг оси',s_cx:'центр X',s_cy:'центр Y',
  about_dist_ax:'При осевой симметрии точка A и её образ A′ равноудалены от оси, а отрезок AA′ перпендикулярен оси. Ось симметрии — это серединный перпендикуляр к отрезку AA′.',

},

const LANG=(()=>{const q=new URLSearchParams(location.search).get('lang');return(q&&I18N[q])?q:'ru';})();
const tr=key=>(I18N[LANG]&&I18N[LANG][key])!==undefined?I18N[LANG][key]:I18N.ru[key];
function applyStaticI18N(){document.documentElement.lang=LANG;const tv=tr('page_title');if(tv)document.title=tv;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=tr(el.getAttribute('data-i18n'));if(v!==undefined)el.textContent=v;});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{const v=tr(el.getAttribute('data-i18n-html'));if(v!==undefined)el.innerHTML=v;});}
applyStaticI18N();
const f1=x=>x.toFixed(1);
window.A={type:'axial',shape:'flag',angle:90,shift:0,cx:0,cy:0};
const SL={axial:[['angle','s_angle',30,150,1],['shift','s_shift',-8,8,0.5]],
  central:[['cx','s_cx',-8,8,0.5],['cy','s_cy',-6,6,0.5]]};
function shapeV(){return SHAPES[window.A.shape];}
function axisData(){const a=window.A.angle*Math.PI/180;const u=[Math.cos(a),Math.sin(a)];const nrm=[Math.sin(a),-Math.cos(a)];const A0=[nrm[0]*window.A.shift,nrm[1]*window.A.shift];return {u,nrm,A0};}
function reflect(p){if(window.A.type==='central')return [2*window.A.cx-p[0],2*window.A.cy-p[1]];
  const {u,A0}=axisData();const v=[p[0]-A0[0],p[1]-A0[1]];const d=v[0]*u[0]+v[1]*u[1];const pr=[d*u[0],d*u[1]];return [A0[0]+2*pr[0]-v[0],A0[1]+2*pr[1]-v[1]];}
function distA(){const A=shapeV()[MARK_A];if(window.A.type==='central')return Math.hypot(A[0]-window.A.cx,A[1]-window.A.cy);
