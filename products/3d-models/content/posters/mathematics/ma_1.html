<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Куб</title>
<style>


*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#f3f2ee;
  --surface:rgba(255,255,255,0.94);
  --border:rgba(28,20,55,0.07);
  --text:#1a1722;
  --muted:#7a7587;
  --faint:#aaa5b6;
  --accent:#6d28d9;
  --accent-2:#8b5cf6;
  --accent-dim:rgba(109,40,217,0.08);
  --amber:#e0820a;
  --red:#e0463a;
  --cyan:#0e9bb8;
  --green:#16a34a;
  --shadow:0 2px 22px rgba(40,25,80,0.07);
  --shadow-lg:0 18px 56px rgba(45,28,90,0.15);
}

body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;}

body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 760px at 70% 34%, rgba(139,92,246,0.12), transparent 60%),
    radial-gradient(820px 560px at 16% 82%, rgba(109,40,217,0.06), transparent 55%);
}

#canvas-container{position:fixed;inset:0;z-index:1;}
#labels-layer{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}

.dim-label{
  position:absolute;transform:translate(-50%,-50%);
  font-family:'Roboto Mono',monospace;font-size:13.5px;font-weight:500;
  padding:3px 9px;border-radius:9px;white-space:nowrap;
  background:rgba(255,255,255,0.97);color:var(--accent);
  border:1px solid rgba(109,40,217,0.20);
  box-shadow:0 3px 12px rgba(40,25,80,0.13);
  transition:opacity 0.18s;letter-spacing:-0.2px;
}
.dim-label.hidden{opacity:0;}
.dim-label.face{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;font-size:14.5px;box-shadow:0 5px 18px rgba(109,40,217,0.42);}
.dim-label.amber{color:var(--amber);border-color:rgba(224,130,10,0.32);}
.dim-label.red{color:var(--red);border-color:rgba(224,70,58,0.32);}

/* ── HEADER ── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 38px;height:84px;
  display:flex;align-items:center;gap:15px;
  box-shadow:var(--shadow);
}
.h-badge{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#7c3aed,#a78bfa);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 7px 20px rgba(124,58,237,0.36);
}
.h-badge svg{width:25px;height:25px;}
.header-title{font-size:25px;font-weight:800;letter-spacing:-0.5px;}
.header-tag{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--accent);background:var(--accent-dim);padding:4px 11px;border-radius:8px;}
.header-sub{font-size:14px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45;}

/* ── PANEL base ── */
.panel{
  position:fixed;z-index:100;
  background:var(--surface);
  border:1px solid var(--border);border-radius:22px;
  box-shadow:var(--shadow-lg);
}
.panel h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);}

/* ── LEFT (master-detail) ── */
.panel-left{left:22px;top:98px;width:338px;padding:18px 18px;overflow:hidden;min-height:430px;}
.ld-list,.ld-detail{transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.28s;}
.ld-list h3{margin-bottom:12px;padding-left:4px;}
.ld-detail{position:absolute;inset:18px 18px;transform:translateX(26px);opacity:0;pointer-events:none;overflow-y:auto;}
.ld-detail::-webkit-scrollbar{width:4px;}
.ld-detail::-webkit-scrollbar-thumb{background:rgba(40,25,80,0.16);border-radius:4px;}
.panel-left.detail .ld-list{transform:translateX(-26px);opacity:0;pointer-events:none;}
.panel-left.detail .ld-detail{transform:translateX(0);opacity:1;pointer-events:auto;}

.metric{
  display:flex;align-items:center;gap:13px;
  padding:11px 12px;border-radius:14px;cursor:pointer;
  border:1px solid transparent;transition:all 0.15s;margin-bottom:2px;
}
.metric:hover{background:var(--accent-dim);}
.metric.active{background:var(--accent-dim);border-color:rgba(109,40,217,0.22);}
.metric-ico{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  background:rgba(109,40,217,0.10);
}
.metric-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.metric-name{font-size:15.5px;font-weight:700;color:var(--text);line-height:1.15;}
.metric-sub{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--muted);}
.metric-val{font-family:'Roboto Mono',monospace;font-size:23px;font-weight:500;color:var(--accent);letter-spacing:-1px;flex-shrink:0;}

/* detail page */
.ld-back{
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:none;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--accent);
  padding:4px 6px 4px 0;margin-bottom:12px;
}
.ld-back:hover{opacity:0.7;}
.d-tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:10px;background:var(--accent-dim);color:var(--accent);}
.d-title{font-size:22px;font-weight:800;letter-spacing:-0.4px;line-height:1.15;margin-bottom:14px;}
.d-bigval{
  display:flex;align-items:baseline;gap:9px;margin-bottom:4px;
}
.d-bigval b{font-family:'Roboto Mono',monospace;font-size:41px;font-weight:500;color:var(--accent);letter-spacing:-1.5px;line-height:1;}
.d-bigval span{font-size:14px;color:var(--muted);font-weight:600;}
.d-formula{
  margin:13px 0 4px;padding:13px 15px;border-radius:13px;
  background:linear-gradient(135deg,rgba(124,58,237,0.08),rgba(167,139,250,0.05));
  border:1px solid rgba(109,40,217,0.15);
  font-family:'Roboto Mono',monospace;font-size:14.5px;color:#5b21b6;font-weight:500;line-height:1.9;white-space:pre-line;
}
.d-para{font-size:15px;line-height:1.62;color:#3a3545;margin-top:13px;}

/* ── RIGHT (controls) ── */
.panel-right{right:22px;top:98px;width:296px;padding:18px;}
.slider-card{
  background:linear-gradient(135deg,rgba(124,58,237,0.08),rgba(167,139,250,0.05));
  border:1px solid rgba(109,40,217,0.16);border-radius:16px;padding:15px 16px;margin-bottom:18px;
}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px;}
.slider-name{font-size:16px;font-weight:700;}
.slider-name b{color:var(--accent);font-style:italic;}
.slider-pill{
  font-family:'Roboto Mono',monospace;font-size:23px;font-weight:500;color:#fff;
  background:linear-gradient(135deg,#7c3aed,#9333ea);padding:3px 15px;border-radius:11px;
  letter-spacing:-0.5px;box-shadow:0 5px 14px rgba(124,58,237,0.38);
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--fill,33%),rgba(109,40,217,0.15) var(--fill,33%));
  outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);cursor:pointer;
  box-shadow:0 4px 12px rgba(124,58,237,0.45);transition:transform 0.13s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.16);}
.slider-scale{display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace;font-size:12px;color:var(--faint);margin-top:8px;}

.show-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:0 0 11px 2px;}
.show-chip{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 15px;margin-bottom:9px;border-radius:14px;cursor:pointer;
  background:rgba(28,20,55,0.035);border:1.5px solid transparent;
  transition:all 0.16s;
}
.show-chip:hover{background:rgba(28,20,55,0.06);}
.show-chip.on{background:var(--accent-dim);border-color:rgba(109,40,217,0.30);}
.chip-ico{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:rgba(109,40,217,0.10);transition:all 0.16s;
}
.show-chip.on .chip-ico{background:var(--accent);}
.chip-text{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
.chip-name{font-size:15px;font-weight:700;}
.chip-sub{font-size:13px;color:var(--muted);font-family:'Roboto Mono',monospace;}
.chip-state{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;border:2px solid rgba(28,20,55,0.16);
  display:flex;align-items:center;justify-content:center;transition:all 0.16s;
}
.show-chip.on .chip-state{background:var(--accent);border-color:var(--accent);}
.show-chip.on .chip-state::after{content:'✓';color:#fff;font-size:14px;font-weight:700;}

/* ── HINT ── */
.hint-bar{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;
  background:var(--surface);
  border:1px solid var(--border);border-radius:99px;
  padding:9px 22px;font-size:13.5px;color:var(--muted);
  box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:9px;
}
.hint-bar kbd{background:rgba(28,20,55,0.07);border-radius:5px;padding:2px 7px;font-family:'Roboto Mono',monospace;font-size:12.5px;}
.hint-dot{color:var(--faint);}

@media (max-width:1180px){.panel-left{width:300px;}.panel-right{width:264px;}}
</style>
</head>

const cube=new THREE.Group(); root.add(cube);

const C={face:0x8b5cf6,faceSel:0xc4b5fd,edge:0x5b21b6,vertex:0x6d28d9,amber:0xe0820a,red:0xe0463a,cyan:0x0e9bb8};
const FACE_NORMALS=[V(1,0,0),V(-1,0,0),V(0,1,0),V(0,-1,0),V(0,0,1),V(0,0,-1)];

const faceMats=FACE_NORMALS.map(()=>new THREE.MeshStandardMaterial({
  color:C.face,roughness:0.32,metalness:0.0,transparent:true,opacity:0.84,
  side:THREE.DoubleSide,emissive:0x000000,emissiveIntensity:0,
}));
let selectedFace=-1;
function applyFaceMats(){
  faceMats.forEach((m,i)=>{
    const sel=(i===selectedFace);
    m.opacity=sel?0.97:0.84;
    m.depthWrite=!sel;
    m.color.setHex(sel?C.faceSel:C.face);
    m.emissive.setHex(sel?C.faceSel:0x000000);
    m.emissiveIntensity=sel?0.42:0;
    m.needsUpdate=true;
  });
}

let facesMesh=null,edgeGroup=null,vertGroup=null,diagGroup=null,sphereGroup=null;
let showDiag=false,showSphere=false;

function cubeVerts(s){const h=s/2,out=[];for(const x of[-h,h])for(const y of[-h,h])for(const z of[-h,h])out.push(V(x,y,z));return out;}
function cyl(from,to,r,mat){
  const dir=new THREE.Vector3().subVectors(to,from),len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,16),mat);
  m.position.addVectors(from,to).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0,1,0),dir.normalize());return m;
}
function disposeGroup(g){if(!g)return;g.traverse(o=>{if(o.geometry)o.geometry.dispose();});cube.remove(g);}

function buildCube(){
  const a=window.A,h=a/2;
  disposeGroup(facesMesh);disposeGroup(edgeGroup);disposeGroup(vertGroup);disposeGroup(diagGroup);disposeGroup(sphereGroup);

  facesMesh=new THREE.Mesh(new THREE.BoxGeometry(a,a,a),faceMats);
  cube.add(facesMesh);

  const verts=cubeVerts(a);
  const eMat=new THREE.MeshStandardMaterial({color:C.edge,roughness:0.4,metalness:0.12});
  const vMat=new THREE.MeshStandardMaterial({color:C.vertex,roughness:0.34,metalness:0.16});
  const er=a*0.0080, vr=a*0.0125;
  edgeGroup=new THREE.Group();vertGroup=new THREE.Group();
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){
    let d=0;if(Math.abs(verts[i].x-verts[j].x)>1e-6)d++;if(Math.abs(verts[i].y-verts[j].y)>1e-6)d++;if(Math.abs(verts[i].z-verts[j].z)>1e-6)d++;
    if(d===1)edgeGroup.add(cyl(verts[i],verts[j],er,eMat));
  }
  verts.forEach(v=>{const s=new THREE.Mesh(new THREE.SphereGeometry(vr,20,16),vMat);s.position.copy(v);vertGroup.add(s);});
  cube.add(edgeGroup);cube.add(vertGroup);

  // diagonals
  diagGroup=new THREE.Group();
  diagGroup.add(cyl(V(-h,-h,h),V(h,h,h),er*0.9,new THREE.MeshStandardMaterial({color:C.amber,roughness:0.4})));
  diagGroup.add(cyl(V(-h,-h,-h),V(h,h,h),er*0.9,new THREE.MeshStandardMaterial({color:C.red,roughness:0.4})));
  diagGroup.visible=showDiag;cube.add(diagGroup);

  // inscribed (r=a/2) + circumscribed (R=a√3/2) spheres
  sphereGroup=new THREE.Group();
  const ins=new THREE.Mesh(new THREE.SphereGeometry(a/2,40,28),
    new THREE.MeshStandardMaterial({color:C.cyan,roughness:0.2,metalness:0,transparent:true,opacity:0.16,depthWrite:false}));
  const cir=new THREE.Mesh(new THREE.SphereGeometry(a*Math.sqrt(3)/2,24,18),
    new THREE.MeshBasicMaterial({color:C.cyan,wireframe:true,transparent:true,opacity:0.20}));
  sphereGroup.add(ins);sphereGroup.add(cir);
  sphereGroup.visible=showSphere;cube.add(sphereGroup);

  applyFaceMats();
  // shadow scale & position
  shadow.scale.setScalar(a*2.4);
  shadow.position.y=-(a*Math.sqrt(3)/2)-a*0.025;
  updateLabelAnchors();
}

/* ── PROJECTED LABELS ── */
const layer=document.getElementById('labels-layer');
function mkLabel(cls){const d=document.createElement('div');d.className='dim-label '+cls;layer.appendChild(d);return d;}
const L_edge=[mkLabel(''),mkLabel(''),mkLabel('')];
const L_face=mkLabel('face');
const L_fdiag=mkLabel('amber'),L_sdiag=mkLabel('red');
const anc={edge:[V(),V(),V()],face:V(),fdiag:V(),sdiag:V()};

function updateLabelAnchors(){
  const a=window.A,h=a/2,off=a*0.12;
  anc.edge[0].set(0,-h-off,h);
  anc.edge[1].set(h,-h-off,0);
  anc.edge[2].set(h+off,0,h);
  if(selectedFace>=0) anc.face.copy(FACE_NORMALS[selectedFace]).multiplyScalar(h+a*0.015);
  anc.fdiag.set(0,0,h);
  anc.sdiag.set(0,0,0);
  const v=f1(a);
  L_edge.forEach(el=>el.textContent='a = '+v);
  L_fdiag.textContent='a√2 = '+f2(a*Math.SQRT2);
  L_sdiag.textContent='a√3 = '+f2(a*Math.sqrt(3));
  if(selectedFace>=0) L_face.textContent='S = '+f1(a*a);
}
function project(localVec){
  const w=localVec.clone().applyMatrix4(cube.matrixWorld).project(camera);
  return {x:(w.x*0.5+0.5)*innerWidth,y:(-w.y*0.5+0.5)*innerHeight,behind:w.z>1};
}
function place(el,localVec,visible){
  if(!visible){el.classList.add('hidden');return;}
  const s=project(localVec);
  if(s.behind){el.classList.add('hidden');return;}
  el.classList.remove('hidden');el.style.left=s.x+'px';el.style.top=s.y+'px';
}
function updateLabels(){
  L_edge.forEach((el,i)=>place(el,anc.edge[i],true));
  place(L_face,anc.face,selectedFace>=0);
  place(L_fdiag,anc.fdiag,showDiag);
  place(L_sdiag,anc.sdiag,showDiag);
}

/* ── SELECTION + DETAIL ── */
function setSelectedFace(idx){
  selectedFace=(selectedFace===idx)?-1:idx;
  applyFaceMats();updateLabelAnchors();
}

const DETAIL=DETAIL_ALL[LANG]||DETAIL_ALL.ru;

function openDetail(keyMetric){
  const d=DETAIL[keyMetric];if(!d)return;
  const a=window.A;
  document.querySelectorAll('.metric').forEach(m=>m.classList.toggle('active',m.dataset.key===keyMetric));
  // contextual 3D highlight
  if(keyMetric==='farea'||keyMetric==='fper'||keyMetric==='surf'){ if(selectedFace<0){selectedFace=4;applyFaceMats();updateLabelAnchors();} }
  if((keyMetric==='fdiag'||keyMetric==='sdiag')&&!showDiag){window.toggleDiag();}
  document.getElementById('detail-content').innerHTML=`
    <div class="d-tag">${d.tag}</div>
    <div class="d-title">${d.title}</div>
    <div class="d-bigval"><b>${f1(METRICS.find(m=>m.key===keyMetric).val(a))}</b><span>${tr(d.unit)}</span></div>
    <div class="d-formula">${d.calc(a)}</div>
    <div class="d-para">${d.p}</div>`;
  document.getElementById('panel-left').classList.add('detail');
  currentDetail=keyMetric;
  markInteract();
}
let currentDetail=null;
window.openDetail=openDetail;
window.showList=function(){
  document.getElementById('panel-left').classList.remove('detail');
  currentDetail=null;
  document.querySelectorAll('.metric').forEach(m=>m.classList.remove('active'));
  if(selectedFace>=0){selectedFace=-1;applyFaceMats();updateLabelAnchors();}
};

/* ── CONTROLS ── */
window.A=4.0;
window.setA=function(val){
  window.A=val;buildCube();updateMetricValues();
  if(currentDetail) openDetail(currentDetail);
};
window.toggleDiag=function(){
  showDiag=!showDiag;
  document.getElementById('chip-diag').classList.toggle('on',showDiag);
  if(diagGroup)diagGroup.visible=showDiag;
  markInteract();
};
window.toggleSphere=function(){
  showSphere=!showSphere;
  document.getElementById('chip-sphere').classList.toggle('on',showSphere);
  if(sphereGroup)sphereGroup.visible=showSphere;
  markInteract();
};

/* ── RAYCAST ── */
const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
canvas.addEventListener('click',e=>{
  if(isDragging)return;
  m2.x=(e.clientX/innerWidth)*2-1;m2.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(m2,camera);
  const hit=ray.intersectObject(facesMesh,false);
  if(hit.length>0){
    setSelectedFace(hit[0].face.materialIndex);
    if(selectedFace>=0) openDetail('farea'); else window.showList();
  }
  markInteract();
});

/* ── DRAG + ZOOM + idle rotation ── */
let isDragging=false,dragStart=null,last={x:0,y:0},dd=0,rotX=0.30;
let lastInteract=performance.now()-11000;      // start rotating shortly after load
let autoSpeed=0; const AUTO_TARGET=0.0016, IDLE_MS=15000;
function markInteract(){lastInteract=performance.now();}
window.__mark=markInteract;

canvas.addEventListener('mousedown',e=>{dragStart={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY};isDragging=false;dd=0;markInteract();});
canvas.addEventListener('mousemove',e=>{
  if(!dragStart)return;
  dd=Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y);
  if(dd>4)isDragging=true;
  if(isDragging){
    root.rotation.y+=(e.clientX-last.x)*0.010;
    rotX=Math.max(-1.1,Math.min(1.1,rotX+(e.clientY-last.y)*0.008));
    root.rotation.x=rotX;markInteract();
  }
  last={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('mouseup',()=>{dragStart=null;});
canvas.addEventListener('mouseleave',()=>{dragStart=null;isDragging=false;});
canvas.addEventListener('wheel',e=>{e.preventDefault();userZoom=Math.max(0.6,Math.min(1.7,userZoom+e.deltaY*0.0015));markInteract();},{passive:false});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ── LOOP ── */
function animate(){
  requestAnimationFrame(animate);
  const idle=performance.now()-lastInteract;
  if(idle>IDLE_MS) autoSpeed += (AUTO_TARGET-autoSpeed)*0.025;   // smooth resume
  else            autoSpeed += (0-autoSpeed)*0.18;              // quick, gentle stop
  root.rotation.y+=autoSpeed;
  root.rotation.x=rotX;
  camDistTarget=computeCamTarget();
  camDist+=(camDistTarget-camDist)*0.18;
  applyCamera();
  renderer.render(scene,camera);
  cube.updateWorldMatrix(true,false);
  updateLabels();
}

// init
root.rotation.x=rotX;
buildCube();
updateMetricValues();
camDistTarget=computeCamTarget();camDist=camDistTarget;applyCamera();
animate();
</script>
