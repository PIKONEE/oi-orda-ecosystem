<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Прямая и обратная пропорциональность</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f3f3f7;--surface:rgba(255,255,255,0.94);--border:rgba(25,25,55,0.08);
  --text:#171627;--muted:#63627a;--faint:#a3a1b4;
  --accent:#4f46e5;--accent-dim:rgba(79,70,229,0.10);
  --curve:#4f46e5;--pt:#ea580c;--inv:#0d9488;
  --shadow:0 2px 22px rgba(30,25,80,0.07);--shadow-lg:0 18px 56px rgba(35,28,90,0.15);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 760px at 70% 30%, rgba(99,102,241,0.11), transparent 60%),radial-gradient(820px 560px at 16% 84%, rgba(13,148,136,0.05), transparent 55%);}
#canvas-container{position:fixed;inset:0;z-index:1;}
#labels-layer{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}
.dim-label{position:absolute;transform:translate(-50%,-50%);font-family:'Roboto Mono',monospace;font-size:14px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;letter-spacing:-0.3px;background:rgba(255,255,255,0.97);box-shadow:0 3px 12px rgba(30,25,80,0.13);transition:opacity 0.18s;}
.dim-label.hidden{opacity:0;}
.dim-label.lm{background:var(--pt);color:#fff;border:none;box-shadow:0 3px 12px rgba(234,88,12,0.42);font-size:14.5px;}
.dim-label.linv{background:var(--inv);color:#fff;border:none;box-shadow:0 3px 12px rgba(13,148,136,0.42);}
.dim-label.lax{color:var(--muted);border:1px solid rgba(25,25,55,0.12);font-weight:700;}
.header{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);padding:0 38px;height:84px;display:flex;align-items:center;gap:15px;box-shadow:var(--shadow);}
.h-badge{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#4f46e5,#818cf8);display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(79,70,229,0.36);}
.h-badge svg{width:25px;height:25px;}
.header-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.header-tag{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--accent);background:var(--accent-dim);padding:4px 11px;border-radius:8px;}
.header-sub{font-size:14px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45;}
.eq-banner{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:10px 24px;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:700;color:var(--text);pointer-events:none;white-space:pre;}
.eq-banner b{color:var(--inv);}
.panel{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);}
.panel h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);}
.panel-left{left:22px;top:98px;width:336px;padding:18px 18px;overflow:hidden;min-height:300px;}
.ld-list,.ld-detail{transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.28s;}
.ld-list h3{margin-bottom:12px;padding-left:4px;}
.ld-detail{position:absolute;inset:18px 18px;transform:translateX(26px);opacity:0;pointer-events:none;overflow-y:auto;}
.panel-left.detail .ld-list{transform:translateX(-26px);opacity:0;pointer-events:none;}
.panel-left.detail .ld-detail{transform:translateX(0);opacity:1;pointer-events:auto;}
.metric{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;margin-bottom:2px;}
.metric:hover{background:rgba(30,25,80,0.04);}
.metric.active{background:var(--accent-dim);border-color:rgba(79,70,229,0.22);}
.metric-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.metric-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.metric-name{font-size:15px;font-weight:700;line-height:1.15;}
.metric-sub{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--muted);}
.metric-val{font-family:'Roboto Mono',monospace;font-size:21px;font-weight:500;color:var(--accent);letter-spacing:-1px;flex-shrink:0;}
.ld-back{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--accent);padding:4px 6px 4px 0;margin-bottom:12px;}
.d-tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:10px;background:var(--accent-dim);color:var(--accent);}
.d-title{font-size:22px;font-weight:800;letter-spacing:-0.4px;line-height:1.15;margin-bottom:14px;}
.d-bigval{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;}
.d-bigval b{font-family:'Roboto Mono',monospace;font-size:35px;font-weight:500;color:var(--accent);letter-spacing:-1px;line-height:1;}
.d-bigval span{font-size:14px;color:var(--muted);font-weight:600;}
.d-formula{margin:13px 0 4px;padding:13px 15px;border-radius:13px;background:linear-gradient(135deg,rgba(129,140,248,0.13),rgba(79,70,229,0.05));border:1px solid rgba(79,70,229,0.16);font-family:'Roboto Mono',monospace;font-size:14px;color:#3730a3;font-weight:500;line-height:1.95;white-space:pre-line;}
.d-para{font-size:15px;line-height:1.62;color:#2a2735;margin-top:13px;}
.panel-right{right:22px;top:98px;width:300px;padding:18px;}
.seg-title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:2px 2px 9px;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.mode-btn{padding:11px 6px;border-radius:13px;border:1.5px solid var(--border);background:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:5px;}
.mode-btn svg{width:30px;height:22px;}
.mode-btn small{font-family:'Roboto Mono',monospace;font-size:11.5px;font-weight:600;opacity:0.8;}
.mode-btn:hover{border-color:var(--accent);}
.mode-btn.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.sliders{margin-bottom:6px;}
.sl-row{margin-bottom:12px;}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.sl-name{font-size:14px;font-weight:700;}.sl-name b{font-family:'Roboto Mono',monospace;font-style:italic;color:var(--accent);}
.sl-val{font-family:'Roboto Mono',monospace;font-size:16px;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:2px 9px;border-radius:8px;}
.sliders input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(79,70,229,0.16) var(--fill,50%));outline:none;cursor:pointer;}
.sliders input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(79,70,229,0.4);cursor:pointer;transition:transform 0.12s;}
.sliders input::-webkit-slider-thumb:hover{transform:scale(1.16);}
.show-chip{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;margin-top:6px;border-radius:14px;cursor:pointer;background:rgba(30,25,80,0.035);border:1.5px solid transparent;transition:all 0.16s;}
.show-chip:hover{background:rgba(30,25,80,0.06);}
.show-chip.on{background:var(--accent-dim);border-color:rgba(79,70,229,0.30);}
.chip-ico{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(79,70,229,0.10);transition:all 0.16s;}
.show-chip.on .chip-ico{background:var(--accent);}
.chip-text{flex:1;min-width:0;}.chip-name{font-size:14px;font-weight:700;}.chip-sub{font-size:11.5px;color:var(--muted);font-family:'Roboto Mono',monospace;}
.chip-state{width:21px;height:21px;border-radius:50%;flex-shrink:0;border:2px solid rgba(30,25,80,0.16);display:flex;align-items:center;justify-content:center;transition:all 0.16s;}
.show-chip.on .chip-state{background:var(--accent);border-color:var(--accent);}
.show-chip.on .chip-state::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.hint-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:9px 22px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:9px;}
.hint-grab{color:var(--accent);font-weight:700;}.hint-dot{color:var(--faint);}
@media (max-width:1180px){.panel-left{width:300px;}.panel-right{width:276px;}}
</style>
</head>
<body>
<div id="canvas-container"><canvas id="c"></canvas></div>
<div id="labels-layer"></div>
<header class="header">
  <div class="h-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 L21 3"/><path d="M3 3 L3 21 L21 21"/></svg></div>
  <div class="header-title" data-i18n="header_title">Пропорциональность</div>
  <div class="header-tag" id="head-formula">y = k·x</div>
  <div class="header-sub" data-i18n-html="header_sub">Меняйте коэффициент и положение точки<br>смотрите, какая величина остаётся постоянной</div>
</header>
<div class="eq-banner" id="eq-banner"></div>
<div class="panel panel-left" id="panel-left">
  <div class="ld-list"><h3 data-i18n="props_title">Характеристики</h3><div id="metrics"></div></div>
  <div class="ld-detail"><button class="ld-back" onclick="window.showList()"><span>‹</span> <span data-i18n="back">Назад</span></button><div id="detail-content"></div></div>
</div>
<div class="panel panel-right">
  <div class="seg-title" data-i18n="type_title">Вид зависимости</div>
  <div class="mode-grid" id="type-grid"></div>
  <div class="sliders" id="sliders"></div>
  <div class="show-chip on" id="chip-proj" onclick="window.toggleProj()"><div class="chip-ico">⌐</div><div class="chip-text"><span class="chip-name" data-i18n="ch_proj">Проекции</span><span class="chip-sub" data-i18n="ch_proj_sub">отрезки к осям</span></div><div class="chip-state"></div></div>
  <div class="show-chip on" id="chip-area" onclick="window.toggleArea()"><div class="chip-ico">▧</div><div class="chip-text"><span class="chip-name" data-i18n="ch_area">Область</span><span class="chip-sub" data-i18n="ch_area_sub">инвариант пропорции</span></div><div class="chip-state"></div></div>
</div>
<div class="hint-bar" data-i18n-html="hint"><span class="hint-grab">Двигайте ползунки</span><span class="hint-dot">·</span><span>фон — поворот</span><span class="hint-dot">·</span><span>клик по строке — пояснение</span></div>

<script>
const TYPES=['direct','inverse'];
const ICONS={
  direct:'<svg viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 20 L20 20 M4 20 L4 2" opacity="0.4"/><path d="M3 19 L21 4" stroke-width="2"/></svg>',
  inverse:'<svg viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 20 L28 20 M4 22 L4 2" opacity="0.4"/><path d="M6 3 C 6 12, 9 18, 26 18.5" stroke-width="2"/></svg>'};
const DEF={direct:{k:1.5,px:3},inverse:{k:6,px:2}};
const SL={direct:[['k','s_k',0.25,2.5,0.05],['px','s_px',0.5,5,0.5]],
  inverse:[['k','s_k',1,8,0.5],['px','s_px',1,9,0.5]]};
const I18N={
ru:{page_title:'Прямая и обратная пропорциональность',header_title:'Пропорциональность',
  header_sub:'Меняйте коэффициент и положение точки<br>смотрите, какая величина остаётся постоянной',
  props_title:'Характеристики',back:'Назад',type_title:'Вид зависимости',
  ch_proj:'Проекции',ch_proj_sub:'отрезки к осям',ch_area:'Область',ch_area_sub:'инвариант пропорции',
  hint:'<span class="hint-grab">Двигайте ползунки</span><span class="hint-dot">·</span><span>фон — поворот</span><span class="hint-dot">·</span><span>клик по строке — пояснение</span>',
  type_direct:'Прямая',type_inverse:'Обратная',
  m_k:'Коэффициент k',m_ratio:'Отношение y/x',m_prod:'Произвед. x·y',m_x:'Координата x',m_y:'Координата y',
  sub_k:'множитель пропорции',sub_ratio:'= k (постоянно)',sub_prod:'= k (постоянно)',sub_x:'точки M',sub_y:'точки M',
  s_k:'коэффициент k',s_px:'положение точки x',
  about_k_direct:'k — коэффициент прямой пропорциональности. Чем больше k, тем круче прямая y = k·x, которая всегда проходит через начало координат.',
  about_k_inverse:'k — коэффициент обратной пропорциональности в формуле y = k/x. График — гипербола из двух ветвей, которая не пересекает оси.',
  about_ratio:'При прямой пропорциональности отношение y/x всегда равно k, как бы точка ни двигалась по прямой. Увеличишь x в 2 раза — y тоже вырастет в 2 раза.',
  about_prod:'При обратной пропорциональности произведение x·y всегда равно k. Площадь прямоугольника под точкой постоянна! Увеличишь x в 2 раза — y уменьшится в 2 раза.',
  about_x:'x-координата движущейся точки M на графике. Управляется ползунком «положение точки x».',
  about_y:'y-координата точки M. Для прямой y = k·x, для обратной y = k/x.',
},
kz:{page_title:'Тура және кері пропорционалдық',header_title:'Пропорционалдық',
  header_sub:'Коэффициент пен нүкте орнын өзгертіңіз<br>қай шама тұрақты болатынын қараңыз',
  props_title:'Сипаттамалар',back:'Артқа',type_title:'Тәуелділік түрі',
  ch_proj:'Проекциялар',ch_proj_sub:'оське кесінділер',ch_area:'Аймақ',ch_area_sub:'пропорция инварианты',
  hint:'<span class="hint-grab">Ползунктерді жылжытыңыз</span><span class="hint-dot">·</span><span>фон — бұру</span><span class="hint-dot">·</span><span>жолды басу — түсіндірме</span>',
  type_direct:'Тура',type_inverse:'Кері',
  m_k:'Коэффициент k',m_ratio:'Қатынас y/x',m_prod:'Көбейтінді x·y',m_x:'x координатасы',m_y:'y координатасы',
  sub_k:'пропорция көбейткіші',sub_ratio:'= k (тұрақты)',sub_prod:'= k (тұрақты)',sub_x:'M нүктесінің',sub_y:'M нүктесінің',
  s_k:'коэффициент k',s_px:'нүкте орны x',
  about_k_direct:'k — тура пропорционалдық коэффициенті. k неғұрлым үлкен болса, координат басынан өтетін y = k·x түзуі соғұрлым тік болады.',
  about_k_inverse:'k — y = k/x формуласындағы кері пропорционалдық коэффициенті. График — екі тармақты гипербола, ол осьтерді қиып өтпейді.',
  about_ratio:'Тура пропорционалдықта y/x қатынасы нүкте қалай жылжыса да әрқашан k-ға тең. x-ті 2 есе арттырсаң — y да 2 есе артады.',
  about_prod:'Кері пропорционалдықта x·y көбейтіндісі әрқашан k-ға тең. Нүкте астындағы тіктөртбұрыш ауданы тұрақты! x-ті 2 есе арттырсаң — y 2 есе кемиді.',
  about_x:'Графиктегі жылжитын M нүктесінің x-координатасы. «нүкте орны x» ползункімен басқарылады.',
  about_y:'M нүктесінің y-координатасы. Түзу үшін y = k·x, гипербола үшін y = k/x.',
},
en:{page_title:'Direct and Inverse Proportionality',header_title:'Proportionality',
  header_sub:'Change the coefficient and the point position<br>watch which quantity stays constant',
  props_title:'Properties',back:'Back',type_title:'Type of relation',
  ch_proj:'Projections',ch_proj_sub:'segments to the axes',ch_area:'Region',ch_area_sub:'invariant of the relation',
  hint:'<span class="hint-grab">Move the sliders</span><span class="hint-dot">·</span><span>background — rotate</span><span class="hint-dot">·</span><span>click a row — explanation</span>',
  type_direct:'Direct',type_inverse:'Inverse',
  m_k:'Coefficient k',m_ratio:'Ratio y/x',m_prod:'Product x·y',m_x:'Coordinate x',m_y:'Coordinate y',
  sub_k:'factor of the relation',sub_ratio:'= k (constant)',sub_prod:'= k (constant)',sub_x:'of point M',sub_y:'of point M',
  s_k:'coefficient k',s_px:'point position x',
  about_k_direct:'k is the coefficient of direct proportionality. The larger k, the steeper the line y = k·x, which always passes through the origin.',
  about_k_inverse:'k is the coefficient of inverse proportionality in y = k/x. The graph is a hyperbola of two branches that never crosses the axes.',
  about_ratio:'In direct proportionality the ratio y/x always equals k, no matter how the point moves along the line. Double x and y also doubles.',
  about_prod:'In inverse proportionality the product x·y always equals k. The area of the rectangle under the point is constant! Double x and y is halved.',
  about_x:'The x-coordinate of the moving point M on the graph. Controlled by the "point position x" slider.',
  about_y:'The y-coordinate of point M. For the line y = k·x, for the hyperbola y = k/x.',
}
};
const LANG=(()=>{const q=new URLSearchParams(location.search).get('lang');return(q&&I18N[q])?q:'ru';})();
const tr=key=>(I18N[LANG]&&I18N[LANG][key])!==undefined?I18N[LANG][key]:I18N.ru[key];
function applyStaticI18N(){document.documentElement.lang=LANG;const tv=tr('page_title');if(tv)document.title=tv;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=tr(el.getAttribute('data-i18n'));if(v!==undefined)el.textContent=v;});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{const v=tr(el.getAttribute('data-i18n-html'));if(v!==undefined)el.innerHTML=v;});}
applyStaticI18N();
const fmtN=x=>{let r=Math.round(x*100)/100;if(Object.is(r,-0))r=0;return r.toString();};
window.A={mode:'direct',k:1.5,px:3};
function yAt(x){return window.A.mode==='direct'?window.A.k*x:window.A.k/x;}
function invariant(){const x=window.A.px,y=yAt(x);return window.A.mode==='direct'?y/x:x*y;}
function metricLabel(m){return typeof m.i==='function'?m.i():tr(m.i);}
const METRICS=[
  {key:'k',dot:'var(--accent)',i:'m_k',fmt:()=>fmtN(window.A.k),sub:()=>tr('sub_k')},
  {key:'inv',dot:'var(--inv)',i:()=>tr(window.A.mode==='direct'?'m_ratio':'m_prod'),fmt:()=>fmtN(invariant()),sub:()=>tr(window.A.mode==='direct'?'sub_ratio':'sub_prod')},
  {key:'mx',dot:'#64748b',i:'m_x',fmt:()=>fmtN(window.A.px),sub:()=>tr('sub_x')},
  {key:'my',dot:'#64748b',i:'m_y',fmt:()=>fmtN(yAt(window.A.px)),sub:()=>tr('sub_y')},
];
function bannerStr(){const k=fmtN(window.A.k);return window.A.mode==='direct'
  ?`y = k·x = ${k}·x      y/x = <b>${k}</b>`:`y = k/x = ${k}/x      x·y = <b>${k}</b>`;}
function headFormula(){return window.A.mode==='direct'?'y = k·x':'y = k/x';}
function renderMetrics(){document.getElementById('metrics').innerHTML=METRICS.map(m=>`
  <div class="metric" data-key="${m.key}" onclick="window.openDetail('${m.key}')"><div class="metric-dot" style="background:${m.dot}"></div>
  <div class="metric-main"><span class="metric-name" id="mn-${m.key}">${metricLabel(m)}</span><span class="metric-sub" id="ms-${m.key}"></span></div>
