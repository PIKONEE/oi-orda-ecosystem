<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Правильная треугольная призма</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f3f2ee;--surface:rgba(255,255,255,0.94);--border:rgba(28,20,55,0.07);
  --text:#1a1722;--muted:#7a7587;--faint:#aaa5b6;
  --a:#0891b2;--a-dim:rgba(8,145,178,0.10);
  --h:#ea580c;--h-dim:rgba(234,88,12,0.10);
  --accent:#0891b2;--accent-dim:rgba(8,145,178,0.10);--lateral:#7c3aed;
  --shadow:0 2px 22px rgba(20,40,80,0.07);--shadow-lg:0 18px 56px rgba(20,40,90,0.15);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 760px at 70% 32%, rgba(34,211,238,0.10), transparent 60%),radial-gradient(820px 560px at 14% 84%, rgba(234,88,12,0.06), transparent 55%);}
#canvas-container{position:fixed;inset:0;z-index:1;}
#labels-layer{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}
.dim-label{position:absolute;transform:translate(-50%,-50%);font-family:'Roboto Mono',monospace;font-size:14px;font-weight:600;padding:3px 10px;border-radius:9px;white-space:nowrap;letter-spacing:-0.3px;background:rgba(255,255,255,0.97);box-shadow:0 3px 12px rgba(20,40,90,0.13);transition:opacity 0.18s;}
.dim-label.hidden{opacity:0;}
.dim-label.la{color:var(--a);border:1px solid rgba(8,145,178,0.28);}
.dim-label.lh{color:var(--h);border:1px solid rgba(234,88,12,0.28);}
.dim-label.lat{color:var(--lateral);border:1px solid rgba(124,58,237,0.3);}
.header{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--surface);border-bottom:1px solid var(--border);padding:0 38px;height:84px;display:flex;align-items:center;gap:15px;box-shadow:var(--shadow);}
.h-badge{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#0891b2,#22d3ee);display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(8,145,178,0.36);}
.h-badge svg{width:25px;height:25px;}
.header-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.header-tag{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--accent);background:var(--accent-dim);padding:4px 11px;border-radius:8px;}
.header-sub{font-size:14px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45;}
.panel{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);}
.panel h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);}
.panel-left{left:22px;top:98px;width:336px;padding:18px 18px;overflow:hidden;min-height:430px;}
.ld-list,.ld-detail{transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.28s;}
.ld-list h3{margin-bottom:12px;padding-left:4px;}
.ld-detail{position:absolute;inset:18px 18px;transform:translateX(26px);opacity:0;pointer-events:none;overflow-y:auto;}
.panel-left.detail .ld-list{transform:translateX(-26px);opacity:0;pointer-events:none;}
.panel-left.detail .ld-detail{transform:translateX(0);opacity:1;pointer-events:auto;}
.metric{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;margin-bottom:2px;}
.metric:hover{background:rgba(20,40,90,0.04);}
.metric.active{background:var(--accent-dim);border-color:rgba(8,145,178,0.22);}
.metric-ico{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(8,145,178,0.10);}
.metric-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.metric-name{font-size:15px;font-weight:700;line-height:1.15;}
.metric-sub{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--muted);}
.metric-val{font-family:'Roboto Mono',monospace;font-size:21px;font-weight:500;color:var(--accent);letter-spacing:-1px;flex-shrink:0;}
.ld-back{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--accent);padding:4px 6px 4px 0;margin-bottom:12px;}
.d-tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:10px;background:var(--accent-dim);color:var(--accent);}
.d-title{font-size:22px;font-weight:800;letter-spacing:-0.4px;line-height:1.15;margin-bottom:14px;}
.d-bigval{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;}
.d-bigval b{font-family:'Roboto Mono',monospace;font-size:37px;font-weight:500;color:var(--accent);letter-spacing:-1.5px;line-height:1;}
.d-bigval span{font-size:14px;color:var(--muted);font-weight:600;}
.d-formula{margin:13px 0 4px;padding:13px 15px;border-radius:13px;background:linear-gradient(135deg,rgba(34,211,238,0.12),rgba(8,145,178,0.05));border:1px solid rgba(8,145,178,0.16);font-family:'Roboto Mono',monospace;font-size:14px;color:#0e7490;font-weight:500;line-height:1.95;white-space:pre-line;}
.d-para{font-size:15px;line-height:1.62;color:#3a3545;margin-top:13px;}
.panel-right{right:22px;top:98px;width:300px;padding:18px;}
.dim-slider{margin-bottom:14px;border-radius:15px;padding:12px 14px;border:1px solid;}
.dim-slider.sa{background:var(--a-dim);border-color:rgba(8,145,178,0.18);}
.dim-slider.sh{background:var(--h-dim);border-color:rgba(234,88,12,0.18);}
.ds-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ds-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;}
.ds-key{font-family:'Roboto Mono',monospace;font-style:italic;font-size:18px;}
.sa .ds-key{color:var(--a);} .sh .ds-key{color:var(--h);}
.ds-dimname{color:var(--muted);font-weight:600;font-size:13.5px;}
.ds-pill{font-family:'Roboto Mono',monospace;font-size:19px;font-weight:500;color:#fff;padding:2px 13px;border-radius:9px;letter-spacing:-0.5px;}
.sa .ds-pill{background:var(--a);} .sh .ds-pill{background:var(--h);}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;cursor:pointer;}
.sa input[type=range]{background:linear-gradient(90deg,var(--a) var(--fill,50%),rgba(8,145,178,0.16) var(--fill,50%));}
.sh input[type=range]{background:linear-gradient(90deg,var(--h) var(--fill,50%),rgba(234,88,12,0.16) var(--fill,50%));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:21px;height:21px;border-radius:50%;background:#fff;cursor:pointer;transition:transform 0.12s;}
.sa input::-webkit-slider-thumb{border:3px solid var(--a);box-shadow:0 3px 10px rgba(8,145,178,0.4);}
.sh input::-webkit-slider-thumb{border:3px solid var(--h);box-shadow:0 3px 10px rgba(234,88,12,0.4);}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18);}
.show-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:11px 0 11px 2px;}
.show-chip{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;margin-bottom:9px;border-radius:14px;cursor:pointer;background:rgba(20,40,90,0.035);border:1.5px solid transparent;transition:all 0.16s;}
.show-chip:hover{background:rgba(20,40,90,0.06);}
.show-chip.on{background:var(--accent-dim);border-color:rgba(8,145,178,0.30);}
.chip-ico{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(8,145,178,0.10);transition:all 0.16s;}
.show-chip.on .chip-ico{background:var(--accent);}
.chip-text{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
.chip-name{font-size:15px;font-weight:700;}
.chip-sub{font-size:13px;color:var(--muted);font-family:'Roboto Mono',monospace;}
.chip-state{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:2px solid rgba(20,40,90,0.16);display:flex;align-items:center;justify-content:center;transition:all 0.16s;}
.show-chip.on .chip-state{background:var(--accent);border-color:var(--accent);}
.show-chip.on .chip-state::after{content:'✓';color:#fff;font-size:14px;font-weight:700;}
.hint-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:9px 22px;font-size:13.5px;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:9px;}
.hint-grab{color:var(--accent);font-weight:700;}.hint-dot{color:var(--faint);}
@media (max-width:1180px){.panel-left{width:300px;}.panel-right{width:268px;}}
</style>

function cyl(from,to,rr,mat){const dir=new THREE.Vector3().subVectors(to,from),len=dir.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,len,12),mat);m.position.addVectors(from,to).multiplyScalar(0.5);if(len>1e-6)m.quaternion.setFromUnitVectors(V(0,1,0),dir.normalize());return m;}
function cone(at,dir,rr,hh,mat){const m=new THREE.Mesh(new THREE.ConeGeometry(rr,hh,16),mat);m.position.copy(at);m.quaternion.setFromUnitVectors(V(0,1,0),dir.clone().normalize());return m;}
function sphere(r,mat){return new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat);}
function disposeGroup(g){if(!g)return;g.traverse(o=>{if(o.geometry)o.geometry.dispose();});obj.remove(g);}
// equilateral triangle base corners (centroid at origin), circumradius Rc = a/√3
function triCorners(a,y){const Rc=a/SQ3;return [0,1,2].map(i=>{const ang=PI/2+i*2*PI/3;return V(Rc*Math.cos(ang),y,Rc*Math.sin(ang));});}
// build the prism body directly from the same corners the wireframe uses (so they match exactly)
function prismGeo(top,bot){
  const pos=[];const tri=(p,q,r)=>pos.push(p.x,p.y,p.z,q.x,q.y,q.z,r.x,r.y,r.z);
  tri(bot[0],bot[2],bot[1]);            // bottom cap
  tri(top[0],top[1],top[2]);            // top cap
  for(let i=0;i<3;i++){const j=(i+1)%3; // 3 side rectangles
    tri(bot[i],bot[j],top[j]);tri(bot[i],top[j],top[i]);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return g;
}
function buildScene(){
  const {a,h}=window.A,hy=h/2;
  const S=Math.max(a,h);const er=S*0.009,tR=S*0.0045,aR=S*0.018,aH=S*0.05,hR=S*0.024,g=a*0.42;
  disposeGroup(bodyMesh);disposeGroup(ringGroup);disposeGroup(dimGroup);disposeGroup(unrollGroup);disposeGroup(baseGroup);
  handles.length=0;
  const top=triCorners(a,hy),bot=triCorners(a,-hy);
  // body — explicit geometry from the corner points (matches the edges)
  bodyMesh=new THREE.Mesh(prismGeo(top,bot),bodyMat);obj.add(bodyMesh);
  // edges
  ringGroup=new THREE.Group();
  const eMat=new THREE.MeshStandardMaterial({color:COL.bodyDeep,roughness:0.36,metalness:0.14});
  for(let i=0;i<3;i++){ringGroup.add(cyl(top[i],top[(i+1)%3],er,eMat));ringGroup.add(cyl(bot[i],bot[(i+1)%3],er,eMat));ringGroup.add(cyl(bot[i],top[i],er*0.85,eMat));}
  obj.add(ringGroup);
  // dim lines + handles — small offsets so the lines hug the edges
  dimGroup=new THREE.Group();
  const off=a*0.16;
  const aMat=new THREE.MeshStandardMaterial({color:COL.a,roughness:0.34,metalness:0.18});
  const hMat=new THREE.MeshStandardMaterial({color:COL.h,roughness:0.34,metalness:0.18});
  // side a: along bottom edge bot[0]-bot[1], offset outward in the base plane (away from centroid)
  const aMid=bot[0].clone().add(bot[1]).multiplyScalar(0.5);
  const aOut=V(aMid.x,0,aMid.z).normalize().multiplyScalar(off);   // perpendicular-ish, in base plane
  const e1=bot[0].clone().add(aOut),e2=bot[1].clone().add(aOut);
  dimGroup.add(cyl(e1,e2,tR,aMat));dimGroup.add(cone(e1,new THREE.Vector3().subVectors(e1,e2).normalize(),aR*0.55,aH*0.55,aMat));dimGroup.add(cone(e2,new THREE.Vector3().subVectors(e2,e1).normalize(),aR*0.55,aH*0.55,aMat));
  // height: along the vertical edge at vertex top[0]/bot[0], offset radially outward (small)
  const hOut=V(top[0].x,0,top[0].z).normalize().multiplyScalar(off);
  const hTop=top[0].clone().add(hOut),hBot=bot[0].clone().add(hOut);
  dimGroup.add(cyl(hBot,hTop,tR,hMat));
  dimGroup.add(cone(hTop,V(0,1,0),aR*0.55,aH*0.55,hMat));dimGroup.add(cone(hBot,V(0,-1,0),aR*0.55,aH*0.55,hMat));
  // handles sit on the dimension lines (the grab points)
  const hMatA=new THREE.MeshStandardMaterial({color:COL.a,roughness:0.2,metalness:0.3,emissive:COL.a,emissiveIntensity:0.2});
  const hMatH=new THREE.MeshStandardMaterial({color:COL.h,roughness:0.2,metalness:0.3,emissive:COL.h,emissiveIntensity:0.2});
  const ha=sphere(hR,hMatA);ha.position.copy(e2);ha.userData.handle='a';dimGroup.add(ha);
  const hh=sphere(hR,hMatH);hh.position.copy(hTop);hh.userData.handle='h';dimGroup.add(hh);
  handles.push({mesh:ha,key:'a',dir:new THREE.Vector3().subVectors(bot[1],bot[0]).normalize(),factor:1});
  handles.push({mesh:hh,key:'h',dir:V(0,1,0),factor:2});
  obj.add(dimGroup);
  // unrolled lateral = rectangle 3a × h, behind
  unrollGroup=new THREE.Group();
  const uW=3*a,uZ=-(a/SQ3+a*0.55);
  const uMat=new THREE.MeshStandardMaterial({color:COL.lateral,roughness:0.45,transparent:true,opacity:0.4,side:THREE.DoubleSide});
  const rect=new THREE.Mesh(new THREE.PlaneGeometry(uW,h),uMat);rect.position.set(0,0,uZ);unrollGroup.add(rect);
  const bMat=new THREE.MeshStandardMaterial({color:COL.bodyDeep,roughness:0.4});
  [[V(-uW/2,-hy,uZ),V(uW/2,-hy,uZ)],[V(-uW/2,hy,uZ),V(uW/2,hy,uZ)],[V(-uW/2,-hy,uZ),V(-uW/2,hy,uZ)],[V(uW/2,-hy,uZ),V(uW/2,hy,uZ)]].forEach(([p,q])=>unrollGroup.add(cyl(p,q,tR*0.9,bMat)));
  // inner dividers (3 faces)
  for(let i=1;i<3;i++){const x=-uW/2+uW*i/3;unrollGroup.add(cyl(V(x,-hy,uZ),V(x,hy,uZ),tR*0.55,bMat));}
  unrollGroup.visible=showUnroll;obj.add(unrollGroup);
  // base triangle height m = a√3/2 (median to one side)
  baseGroup=new THREE.Group();
  const mMat=new THREE.MeshStandardMaterial({color:COL.m,roughness:0.34,metalness:0.18});
  const mid=bot[0].clone().add(bot[1]).multiplyScalar(0.5);   // midpoint of side 0-1
  baseGroup.add(cyl(bot[2],mid,tR*1.1,mMat));                 // median from opposite vertex
  baseGroup.visible=showBase;obj.add(baseGroup);
  applyFaceHi();
  shadow.scale.setScalar(a*2.2+a);shadow.position.y=-hy-a*0.05;
  updateLabelAnchors();
}
function applyFaceHi(){if(bodyMesh){bodyMesh.material.emissive.setHex(hiKey==='base'||hiKey==='vol'?0x0891b2:0x000000);bodyMesh.material.emissiveIntensity=(hiKey==='base'||hiKey==='vol')?0.18:0;}}
const layer=document.getElementById('labels-layer');
function mkLabel(cls){const d=document.createElement('div');d.className='dim-label '+cls;layer.appendChild(d);return d;}
const L_a=mkLabel('la'),L_h=mkLabel('lh'),L_u=mkLabel('lat'),L_m=mkLabel('lat');
const anc={a:V(),h:V(),u:V(),m:V()};
function updateLabelAnchors(){
  const {a,h}=window.A,hy=h/2,off=a*0.16;const bot=triCorners(a,-hy),top=triCorners(a,hy);
  const aMid=bot[0].clone().add(bot[1]).multiplyScalar(0.5);
  anc.a.copy(aMid).add(V(aMid.x,0,aMid.z).normalize().multiplyScalar(off+a*0.14));
  const out=V(top[0].x,0,top[0].z).normalize().multiplyScalar(off+a*0.14);anc.h.copy(top[0]).setY(0).add(out);
  anc.u.set(0,-hy-a*0.16,-(a/SQ3+a*0.55));anc.m.set(0,-hy-a*0.001,0);
  L_a.textContent='a = '+f1(a);L_h.textContent='h = '+f1(h);
  L_u.textContent='3a = '+f1(3*a);L_m.textContent='m = '+f1(SQ3/2*a);
}
function project(localVec){const w=localVec.clone().applyMatrix4(obj.matrixWorld).project(camera);return {x:(w.x*0.5+0.5)*innerWidth,y:(-w.y*0.5+0.5)*innerHeight,behind:w.z>1};}
function place(el,v,vis){if(!vis){el.classList.add('hidden');return;}const s=project(v);if(s.behind){el.classList.add('hidden');return;}el.classList.remove('hidden');el.style.left=s.x+'px';el.style.top=s.y+'px';}
function updateLabels(){place(L_a,anc.a,true);place(L_h,anc.h,true);place(L_u,anc.u,showUnroll);place(L_m,anc.m,showBase);}
const DETAIL_ALL={

  h:{tag:'Высота',p:'Высота h — расстояние между двумя основаниями, длина бокового ребра. У прямой призмы оно перпендикулярно основаниям.'},
  base:{tag:'Основание',p:'Площадь равностороннего треугольника со стороной a равна S = (√3/4)·a². Это можно получить как ½·a·m, где m = a√3/2 — высота треугольника. Оснований два.'},

  perim:{tag:'Периметр',p:'Табан периметрі P = 3a — үш тең қабырға қосындысы. Бүйір бетті жайғанда тіктөртбұрыш ені болады.'},

const DETAIL=DETAIL_ALL[LANG]||DETAIL_ALL.ru;
let savedUnroll=false,savedBase=false,hiKey=null;
function openDetail(key){const d=DETAIL[key];if(!d)return;const {a,h}=window.A,m=METRICS.find(x=>x.key===key);
  if(!document.getElementById('panel-left').classList.contains('detail')){savedUnroll=showUnroll;savedBase=showBase;}
  document.querySelectorAll('.metric').forEach(el=>el.classList.toggle('active',el.dataset.key===key));
  hiKey=key;
  if(key==='lat'&&!showUnroll)window.toggleUnroll();
  else if(key==='base'&&!showBase)window.toggleBase();
  else buildScene();
  const S=SQ3/4*a*a;
  const calc={a:`a = ${f1(a)}`,h:`h = ${f1(h)}`,
    base:`S = (√3/4)·a²\n  = 0.433·${f1(a)}² = ${f1(S)}`,
    perim:`P = 3·a = 3·${f1(a)} = ${f1(3*a)}`,
    lat:`S = P·h = 3a·h\n  = 3·${f1(a)}·${f1(h)} = ${f1(3*a*h)}`,
    surf:`S = 2·${f1(S)} + 3·${f1(a)}·${f1(h)}\n  = ${f1(2*S+3*a*h)}`,
    vol:`V = S·h = ${f1(S)}·${f1(h)} = ${f1(S*h)}`}[key];
  document.getElementById('detail-content').innerHTML=`<div class="d-tag">${d.tag}</div><div class="d-title">${tr(m.i)}</div>
    <div class="d-bigval"><b>${f1(m.val())}</b><span>${tr(m.unit)}</span></div><div class="d-formula">${calc}</div><div class="d-para">${d.p}</div>`;
  document.getElementById('panel-left').classList.add('detail');currentDetail=key;markInteract();}
let currentDetail=null;window.openDetail=openDetail;
window.showList=function(){document.getElementById('panel-left').classList.remove('detail');currentDetail=null;
  document.querySelectorAll('.metric').forEach(m=>m.classList.remove('active'));hiKey=null;
  if(showUnroll!==savedUnroll)window.toggleUnroll();if(showBase!==savedBase)window.toggleBase();buildScene();};
window.setDim=function(k,val){window.A[k]=val;buildScene();updateMetricValues();if(currentDetail)openDetail(currentDetail);markInteract();};
window.toggleUnroll=function(){showUnroll=!showUnroll;document.getElementById('chip-unroll').classList.toggle('on',showUnroll);if(unrollGroup)unrollGroup.visible=showUnroll;markInteract();};
window.toggleBase=function(){showBase=!showBase;document.getElementById('chip-base').classList.toggle('on',showBase);if(baseGroup)baseGroup.visible=showBase;markInteract();};
const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
function pick(e,objs){m2.x=(e.clientX/innerWidth)*2-1;m2.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(m2,camera);return ray.intersectObjects(objs,false);}
let mode=null,dragKey=null,dragFactor=1,pxVec=null,startVal=0,startMouse=null;
let last={x:0,y:0},dd=0,isDragging=false,rotX=0.22;
let lastInteract=performance.now()-16000,autoSpeed=0;const AUTO_TARGET=0.0015,IDLE_MS=15000;
function markInteract(){lastInteract=performance.now();}
function screenPxPerUnit(dirLocal){const o=project(V(0,0,0)),p=project(dirLocal);return {x:p.x-o.x,y:p.y-o.y};}
canvas.addEventListener('mousedown',e=>{markInteract();const hHit=pick(e,handles.map(h=>h.mesh));
  if(hHit.length>0){const key=hHit[0].object.userData.handle,hd=handles.find(h=>h.key===key);
    mode='handle';dragKey=key;dragFactor=hd.factor;startVal=window.A[key];startMouse={x:e.clientX,y:e.clientY};pxVec=screenPxPerUnit(hd.dir);canvas.style.cursor='grabbing';return;}
  mode='rotate';last={x:e.clientX,y:e.clientY};isDragging=false;dd=0;});
canvas.addEventListener('mousemove',e=>{
  if(mode==='handle'){const mdx=e.clientX-startMouse.x,mdy=e.clientY-startMouse.y,denom=pxVec.x*pxVec.x+pxVec.y*pxVec.y;
    if(denom>1){const units=(mdx*pxVec.x+mdy*pxVec.y)/denom;const nv=Math.max(1,Math.min(100,startVal+dragFactor*units));window.A[dragKey]=Math.round(nv*2)/2;buildScene();updateMetricValues();document.getElementById('slider-'+dragKey).value=window.A[dragKey];if(currentDetail)openDetail(currentDetail);}markInteract();return;}
  if(mode==='rotate'){dd=Math.hypot(e.clientX-last.x,e.clientY-last.y);if(dd>4)isDragging=true;
    if(isDragging){root.rotation.y+=(e.clientX-last.x)*0.010;rotX=Math.max(-1.1,Math.min(1.1,rotX+(e.clientY-last.y)*0.008));root.rotation.x=rotX;markInteract();}last={x:e.clientX,y:e.clientY};return;}
  const hHit=pick(e,handles.map(h=>h.mesh));canvas.style.cursor=hHit.length>0?'grab':'default';});
window.addEventListener('mouseup',()=>{if(mode==='handle')canvas.style.cursor='default';mode=null;dragKey=null;});
canvas.addEventListener('click',e=>{if(isDragging||mode==='handle')return;if(!bodyMesh)return;const hit=pick(e,[bodyMesh]);
  if(hit.length>0){const p=hit[0].point.clone();obj.updateWorldMatrix(true,false);p.applyMatrix4(new THREE.Matrix4().copy(obj.matrixWorld).invert());const hy=window.A.h/2;
    if(Math.abs(p.y)>=hy-Math.max(0.001,hy*0.03))openDetail('base');else openDetail('lat');}markInteract();});
canvas.addEventListener('wheel',e=>{e.preventDefault();userZoom=Math.max(0.6,Math.min(1.7,userZoom+e.deltaY*0.0015));markInteract();},{passive:false});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
let t=0;
function animate(){requestAnimationFrame(animate);t+=0.016;const idle=performance.now()-lastInteract;
  if(idle>IDLE_MS)autoSpeed+=(AUTO_TARGET-autoSpeed)*0.025;else autoSpeed+=(0-autoSpeed)*0.18;
  root.rotation.y+=autoSpeed;root.rotation.x=rotX;if(mode!=='handle'){camDistTarget=computeCamTarget();}camDist+=(camDistTarget-camDist)*0.18;applyCamera();
  const pulse=idle>IDLE_MS?(1+Math.sin(t*2.2)*0.11):1;handles.forEach(h=>h.mesh.scale.setScalar(pulse));
  renderer.render(scene,camera);obj.updateWorldMatrix(true,false);updateLabels();}
root.rotation.x=rotX;buildScene();updateMetricValues();camDistTarget=computeCamTarget();camDist=camDistTarget;applyCamera();animate();
</script>
