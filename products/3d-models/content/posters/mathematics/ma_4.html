<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Цилиндр</title>
<style>


*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#f3f2ee;
  --surface:rgba(255,255,255,0.94);
  --border:rgba(28,20,55,0.07);
  --text:#1a1722;
  --muted:#7a7587;
  --faint:#aaa5b6;
  --r:#4f46e5;  --r-dim:rgba(79,70,229,0.10);   /* radius — indigo */
  --h:#d97706;  --h-dim:rgba(217,119,6,0.10);    /* height — amber  */
  --accent:#4f46e5;
  --accent-dim:rgba(79,70,229,0.10);
  --lateral:#0d9488;
  --shadow:0 2px 22px rgba(40,25,80,0.07);
  --shadow-lg:0 18px 56px rgba(45,28,90,0.15);
}

body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 760px at 70% 32%, rgba(99,102,241,0.12), transparent 60%),
    radial-gradient(820px 560px at 14% 84%, rgba(13,148,136,0.07), transparent 55%);
}

#canvas-container{position:fixed;inset:0;z-index:1;}
#labels-layer{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}

.dim-label{
  position:absolute;transform:translate(-50%,-50%);
  font-family:'Roboto Mono',monospace;font-size:14px;font-weight:600;
  padding:3px 10px;border-radius:9px;white-space:nowrap;letter-spacing:-0.3px;
  background:rgba(255,255,255,0.97);box-shadow:0 3px 12px rgba(40,25,80,0.13);
  transition:opacity 0.18s;
}
.dim-label.hidden{opacity:0;}
.dim-label.lr{color:var(--r);border:1px solid rgba(79,70,229,0.28);}
.dim-label.lh{color:var(--h);border:1px solid rgba(217,119,6,0.28);}
.dim-label.lat{color:var(--lateral);border:1px solid rgba(13,148,136,0.30);}
.dim-label.sec{background:#1a1722;color:#fff;border:none;font-weight:600;box-shadow:0 5px 18px rgba(0,0,0,0.3);}

/* ── HEADER ── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--surface);
  border-bottom:1px solid var(--border);padding:0 38px;height:84px;
  display:flex;align-items:center;gap:15px;box-shadow:var(--shadow);
}
.h-badge{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#4f46e5,#818cf8);display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(79,70,229,0.36);}
.h-badge svg{width:25px;height:25px;}
.header-title{font-size:25px;font-weight:800;letter-spacing:-0.5px;}
.header-tag{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--accent);background:var(--accent-dim);padding:4px 11px;border-radius:8px;}
.header-sub{font-size:14px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45;}

/* ── PANELS ── */
.panel{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);}
.panel h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);}

.panel-left{left:22px;top:98px;width:336px;padding:18px 18px;overflow:hidden;min-height:430px;}
.ld-list,.ld-detail{transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.28s;}
.ld-list h3{margin-bottom:12px;padding-left:4px;}
.ld-detail{position:absolute;inset:18px 18px;transform:translateX(26px);opacity:0;pointer-events:none;overflow-y:auto;}
.ld-detail::-webkit-scrollbar{width:4px;}
.ld-detail::-webkit-scrollbar-thumb{background:rgba(40,25,80,0.16);border-radius:4px;}
.panel-left.detail .ld-list{transform:translateX(-26px);opacity:0;pointer-events:none;}
.panel-left.detail .ld-detail{transform:translateX(0);opacity:1;pointer-events:auto;}

.metric{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;margin-bottom:2px;}
.metric:hover{background:rgba(40,25,80,0.04);}
.metric.active{background:var(--accent-dim);border-color:rgba(79,70,229,0.22);}
.metric-ico{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(79,70,229,0.10);}
.metric-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.metric-name{font-size:15.5px;font-weight:700;line-height:1.15;}
.metric-sub{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--muted);}
.metric-val{font-family:'Roboto Mono',monospace;font-size:22px;font-weight:500;color:var(--accent);letter-spacing:-1px;flex-shrink:0;}

.ld-back{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:none;background:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--accent);padding:4px 6px 4px 0;margin-bottom:12px;}
.ld-back:hover{opacity:0.7;}
.d-tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:10px;background:var(--accent-dim);color:var(--accent);}
.d-title{font-size:22px;font-weight:800;letter-spacing:-0.4px;line-height:1.15;margin-bottom:14px;}
.d-bigval{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;}
.d-bigval b{font-family:'Roboto Mono',monospace;font-size:39px;font-weight:500;color:var(--accent);letter-spacing:-1.5px;line-height:1;}
.d-bigval span{font-size:14px;color:var(--muted);font-weight:600;}
.d-formula{margin:13px 0 4px;padding:13px 15px;border-radius:13px;background:linear-gradient(135deg,rgba(99,102,241,0.10),rgba(79,70,229,0.05));border:1px solid rgba(79,70,229,0.16);font-family:'Roboto Mono',monospace;font-size:14px;color:#4338ca;font-weight:500;line-height:1.95;white-space:pre-line;}
.d-para{font-size:15px;line-height:1.62;color:#3a3545;margin-top:13px;}

/* ── RIGHT ── */
.panel-right{right:22px;top:98px;width:300px;padding:18px;}
.dim-slider{margin-bottom:15px;border-radius:15px;padding:12px 14px;border:1px solid;}
.dim-slider.sr{background:var(--r-dim);border-color:rgba(79,70,229,0.18);}
.dim-slider.sh{background:var(--h-dim);border-color:rgba(217,119,6,0.18);}
.ds-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ds-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;}
.ds-key{font-family:'Roboto Mono',monospace;font-style:italic;font-size:18px;}
.sr .ds-key{color:var(--r);} .sh .ds-key{color:var(--h);}
.ds-dimname{color:var(--muted);font-weight:600;font-size:13.5px;}
.ds-pill{font-family:'Roboto Mono',monospace;font-size:19px;font-weight:500;color:#fff;padding:2px 13px;border-radius:9px;letter-spacing:-0.5px;}
.sr .ds-pill{background:var(--r);} .sh .ds-pill{background:var(--h);}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;cursor:pointer;}
.sr input[type=range]{background:linear-gradient(90deg,var(--r) var(--fill,50%),rgba(79,70,229,0.16) var(--fill,50%));}
.sh input[type=range]{background:linear-gradient(90deg,var(--h) var(--fill,50%),rgba(217,119,6,0.16) var(--fill,50%));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:21px;height:21px;border-radius:50%;background:#fff;cursor:pointer;transition:transform 0.12s;}
.sr input::-webkit-slider-thumb{border:3px solid var(--r);box-shadow:0 3px 10px rgba(79,70,229,0.4);}
.sh input::-webkit-slider-thumb{border:3px solid var(--h);box-shadow:0 3px 10px rgba(217,119,6,0.4);}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18);}

.show-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);margin:4px 0 11px 2px;}
.show-chip{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;margin-bottom:9px;border-radius:14px;cursor:pointer;background:rgba(40,25,80,0.035);border:1.5px solid transparent;transition:all 0.16s;}
.show-chip:hover{background:rgba(40,25,80,0.06);}
.show-chip.on{background:var(--accent-dim);border-color:rgba(79,70,229,0.30);}
.chip-ico{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(79,70,229,0.10);transition:all 0.16s;}
.show-chip.on .chip-ico{background:var(--accent);}
.chip-text{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
.chip-name{font-size:15px;font-weight:700;}
.chip-sub{font-size:13px;color:var(--muted);font-family:'Roboto Mono',monospace;}
.chip-state{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:2px solid rgba(40,25,80,0.16);display:flex;align-items:center;justify-content:center;transition:all 0.16s;}
.show-chip.on .chip-state{background:var(--accent);border-color:var(--accent);}
.show-chip.on .chip-state::after{content:'✓';color:#fff;font-size:14px;font-weight:700;}

.hint-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:9px 22px;font-size:13.5px;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:9px;}
.hint-grab{color:var(--accent);font-weight:700;}
.hint-dot{color:var(--faint);}

@media (max-width:1180px){.panel-left{width:300px;}.panel-right{width:268px;}}
</style>
</head>
<body>

<div id="canvas-container"><canvas id="c"></canvas></div>
<div id="labels-layer"></div>

<header class="header">
  <div class="h-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="7" ry="2.6"/><path d="M5 5 V19"/><path d="M19 5 V19"/><ellipse cx="12" cy="19" rx="7" ry="2.6"/>
    </svg>
  </div>
  <div class="header-title" data-i18n="header_title">Цилиндр</div>
  <div class="header-tag">r · h</div>
  <div class="header-sub" data-i18n-html="header_sub">Два равных круга-основания, соединённых стенкой<br>тяните цветные ручки — радиус и высота</div>
</header>

<!-- LEFT -->
<div class="panel panel-left" id="panel-left">
  <div class="ld-list">
    <h3 data-i18n="props_title">Что получается</h3>
    <div id="metrics"></div>
  </div>
  <div class="ld-detail">
    <button class="ld-back" onclick="window.showList()"><span>‹</span> <span data-i18n="back">Назад</span></button>
    <div id="detail-content"></div>
  </div>
</div>

<!-- RIGHT -->
<div class="panel panel-right">
  <h3 data-i18n="set_title" style="margin-bottom:13px;padding-left:2px;">Измерения</h3>
  <div class="dim-slider sr">
    <div class="ds-top">
      <span class="ds-name"><span class="ds-key">r</span><span class="ds-dimname" data-i18n="dn_r">радиус</span></span>
      <span class="ds-pill" id="pill-r">12.0</span>
    </div>
    <input type="range" min="1" max="100" step="0.5" value="12" id="slider-r" oninput="window.setDim('r',+this.value)">
  </div>
  <div class="dim-slider sh">
    <div class="ds-top">
      <span class="ds-name"><span class="ds-key">h</span><span class="ds-dimname" data-i18n="dn_h">высота</span></span>
      <span class="ds-pill" id="pill-h">26.0</span>
    </div>
    <input type="range" min="1" max="100" step="0.5" value="26" id="slider-h" oninput="window.setDim('h',+this.value)">
  </div>

  <div class="show-label" data-i18n="show_title">Показать</div>
  <div class="show-chip" id="chip-unroll" onclick="window.toggleUnroll()">
    <div class="chip-ico">🧻</div>
    <div class="chip-text"><span class="chip-name" data-i18n="ch_unroll">Развёртка стенки</span><span class="chip-sub">2πr × h</span></div>
    <div class="chip-state"></div>
  </div>
  <div class="show-chip" id="chip-section" onclick="window.toggleSection()">
    <div class="chip-ico">▭</div>
    <div class="chip-text"><span class="chip-name" data-i18n="ch_section">Осевое сечение</span><span class="chip-sub">2r × h</span></div>
    <div class="chip-state"></div>
  </div>
</div>

<div class="hint-bar" data-i18n-html="hint">
  <span class="hint-grab">Тяните ручки</span><span>— размер</span><span class="hint-dot">·</span>
  <span>фон — поворот</span><span class="hint-dot">·</span><span>клик по стенке или основанию</span>
</div>

const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const shadowTex=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');
  const g=x.createRadialGradient(128,128,8,128,128,124);g.addColorStop(0,'rgba(40,30,90,0.28)');g.addColorStop(1,'rgba(40,30,90,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);return new THREE.CanvasTexture(cv);})();
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));
shadow.rotation.x=-PI/2;scene.add(shadow);

const root=new THREE.Group();scene.add(root);
const obj=new THREE.Group();root.add(obj);

const COL={body:0x818cf8,bodyDeep:0x4f46e5,ring:0x4f46e5,r:0x4f46e5,h:0xd97706,lateral:0x0d9488,section:0x1a1722};
const bodyMat=new THREE.MeshStandardMaterial({color:COL.body,roughness:0.32,metalness:0.05,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false});

let bodyMesh=null,ringGroup=null,dimGroup=null,unrollGroup=null,sectionGroup=null;
const handles=[];   // {mesh,key,dir,factor}

function cyl(from,to,rr,mat){
  const dir=new THREE.Vector3().subVectors(to,from),len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,len,16),mat);
  m.position.addVectors(from,to).multiplyScalar(0.5);
  if(len>1e-6)m.quaternion.setFromUnitVectors(V(0,1,0),dir.normalize());return m;
}
function cone(at,dir,rr,hh,mat){const m=new THREE.Mesh(new THREE.ConeGeometry(rr,hh,16),mat);m.position.copy(at);m.quaternion.setFromUnitVectors(V(0,1,0),dir.clone().normalize());return m;}
function torus(radius,tube,seg,mat){return new THREE.Mesh(new THREE.TorusGeometry(radius,tube,12,seg),mat);}
function disposeGroup(g){if(!g)return;g.traverse(o=>{if(o.geometry)o.geometry.dispose();});obj.remove(g);}

function buildScene(){
  const {r,h}=window.A, hy=h/2;
  const S=Math.max(r,h);
  const er=S*0.009, tR=S*0.0045, aR=S*0.018, aH=S*0.05, hR=S*0.024, g=r*0.34;
  disposeGroup(bodyMesh);disposeGroup(ringGroup);disposeGroup(dimGroup);disposeGroup(unrollGroup);disposeGroup(sectionGroup);
  handles.length=0;

  // body
  bodyMesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,64,1,false),bodyMat);
  obj.add(bodyMesh);

  // top & bottom rings + a couple vertical edges
  ringGroup=new THREE.Group();
  const ringMat=new THREE.MeshStandardMaterial({color:COL.ring,roughness:0.34,metalness:0.15});
  const top=torus(r,er,96,ringMat);top.rotation.x=PI/2;top.position.y=hy;ringGroup.add(top);
  const bot=torus(r,er,96,ringMat);bot.rotation.x=PI/2;bot.position.y=-hy;ringGroup.add(bot);
  const vMat=new THREE.MeshStandardMaterial({color:COL.bodyDeep,roughness:0.4,metalness:0.1,transparent:true,opacity:0.55});
  [0,PI/2,PI,3*PI/2].forEach(a=>{ringGroup.add(cyl(V(r*Math.cos(a),-hy,r*Math.sin(a)),V(r*Math.cos(a),hy,r*Math.sin(a)),er*0.6,vMat));});
  obj.add(ringGroup);

  // dimension lines + handles
  dimGroup=new THREE.Group();
  const rMat=new THREE.MeshStandardMaterial({color:COL.r,roughness:0.34,metalness:0.18});
  const hMat=new THREE.MeshStandardMaterial({color:COL.h,roughness:0.34,metalness:0.18});
  // radius: on the TOP face from centre to edge
  dimGroup.add(cyl(V(0,hy,0),V(r*0.86,hy,0),tR,rMat));
  dimGroup.add(cone(V(r*0.86,hy,0),V(1,0,0),aR*0.6,aH*0.6,rMat));
  // height: beside the cylinder at x=r+g, bottom to top
  dimGroup.add(cyl(V(r+g,-hy,0),V(r+g,hy,0),tR,hMat));
  dimGroup.add(cone(V(r+g,hy,0),V(0,1,0),aR*0.6,aH*0.6,hMat));
  dimGroup.add(cone(V(r+g,-hy,0),V(0,-1,0),aR*0.6,aH*0.6,hMat));
  // handles
  const hMatR=new THREE.MeshStandardMaterial({color:COL.r,roughness:0.2,metalness:0.3,emissive:COL.r,emissiveIntensity:0.2});
  const hMatH=new THREE.MeshStandardMaterial({color:COL.h,roughness:0.2,metalness:0.3,emissive:COL.h,emissiveIntensity:0.2});
  const hr=new THREE.Mesh(new THREE.SphereGeometry(hR,22,18),hMatR);hr.position.set(r,0,0);hr.userData.handle='r';dimGroup.add(hr);
  const hh=new THREE.Mesh(new THREE.SphereGeometry(hR,22,18),hMatH);hh.position.set(0,hy,0);hh.userData.handle='h';dimGroup.add(hh);
  handles.push({mesh:hr,key:'r',dir:V(1,0,0),factor:1});
  handles.push({mesh:hh,key:'h',dir:V(0,1,0),factor:2});
  obj.add(dimGroup);

  // unrolled lateral surface (behind), width 2πr, height h
  unrollGroup=new THREE.Group();
  const uW=2*PI*r, uZ=-(r+r*0.45);
  const uMat=new THREE.MeshStandardMaterial({color:COL.lateral,roughness:0.45,transparent:true,opacity:0.42,side:THREE.DoubleSide});
  const rect=new THREE.Mesh(new THREE.PlaneGeometry(uW,h),uMat);rect.position.set(0,0,uZ);unrollGroup.add(rect);
  const bMat=new THREE.MeshStandardMaterial({color:COL.lateral,roughness:0.4});
  // border frame
  [[V(-uW/2,-hy,uZ),V(uW/2,-hy,uZ)],[V(-uW/2,hy,uZ),V(uW/2,hy,uZ)],[V(-uW/2,-hy,uZ),V(-uW/2,hy,uZ)],[V(uW/2,-hy,uZ),V(uW/2,hy,uZ)]]
    .forEach(([p,q])=>unrollGroup.add(cyl(p,q,tR*0.9,bMat)));
  unrollGroup.visible=showUnroll;obj.add(unrollGroup);

  // axial section: rectangle 2r × h in the x-y plane (z=0)
  sectionGroup=new THREE.Group();
  const sMat=new THREE.MeshStandardMaterial({color:COL.section,transparent:true,opacity:0.30,side:THREE.DoubleSide,depthWrite:false});
  const sect=new THREE.Mesh(new THREE.PlaneGeometry(2*r,h),sMat);sect.position.set(0,0,0);sectionGroup.add(sect);
  const sbMat=new THREE.MeshStandardMaterial({color:COL.section,roughness:0.4});
  [[V(-r,-hy,0),V(r,-hy,0)],[V(-r,hy,0),V(r,hy,0)],[V(-r,-hy,0),V(-r,hy,0)],[V(r,-hy,0),V(r,hy,0)]]
    .forEach(([p,q])=>sectionGroup.add(cyl(p,q,tR*0.8,sbMat)));
  sectionGroup.visible=showSection;obj.add(sectionGroup);

  shadow.scale.setScalar(Math.max(r,PI*r*(showUnroll?1:0.4))*2.4+r);
  shadow.position.y=-hy-r*0.05;
  updateLabelAnchors();
}

/* ── LABELS ── */
const layer=document.getElementById('labels-layer');
function mkLabel(cls){const d=document.createElement('div');d.className='dim-label '+cls;layer.appendChild(d);return d;}
const L_r=mkLabel('lr'),L_h=mkLabel('lh'),L_uW=mkLabel('lat'),L_uS=mkLabel('lat'),L_sec=mkLabel('sec');
const anc={r:V(),h:V(),uW:V(),uS:V(),sec:V()};
function updateLabelAnchors(){
  const {r,h}=window.A,hy=h/2,g=r*0.34;
  anc.r.set(r*0.45,hy,0);
  anc.h.set(r+g+r*0.12,0,0);
  anc.uW.set(0,-hy-r*0.18,-(r+r*0.45));
  anc.uS.set(0,0,-(r+r*0.45));
  anc.sec.set(0,0,0);
  L_r.textContent='r = '+f1(r);
  L_h.textContent='h = '+f1(h);
  L_uW.textContent='2πr = '+f1(2*PI*r);
  L_uS.textContent='S = '+f1(2*PI*r*h);
  L_sec.textContent='2r × h = '+f1(2*r*h);
}
function project(localVec){const w=localVec.clone().applyMatrix4(obj.matrixWorld).project(camera);return {x:(w.x*0.5+0.5)*innerWidth,y:(-w.y*0.5+0.5)*innerHeight,behind:w.z>1};}
function place(el,v,vis){if(!vis){el.classList.add('hidden');return;}const s=project(v);if(s.behind){el.classList.add('hidden');return;}el.classList.remove('hidden');el.style.left=s.x+'px';el.style.top=s.y+'px';}
function updateLabels(){
  place(L_r,anc.r,true);
  place(L_h,anc.h,true);
  place(L_uW,anc.uW,showUnroll);
  place(L_uS,anc.uS,showUnroll);
  place(L_sec,anc.sec,showSection);
}

/* ── DETAIL ── */
const DETAIL_ALL={
ru:{
  r:{tag:'Радиус',p:'Радиус — расстояние от оси цилиндра до его боковой стенки, то есть радиус круга-основания. Оба основания — одинаковые круги радиуса r.'},
  h:{tag:'Высота',p:'Высота — расстояние между двумя основаниями, длина стенки. У прямого цилиндра высота перпендикулярна основаниям.'},
  circ:{tag:'Окружность',p:'Длина окружности основания L = 2πr. Это важнейшая величина: именно она становится шириной прямоугольника, если «развернуть» боковую стенку. Включите «Развёртку».'},
  base:{tag:'Основание',p:'Каждое основание — круг площадью S = π·r². Оснований два, поэтому в полную поверхность они входят дважды: 2·π·r².'},
  lat:{tag:'Боковая поверхность',p:'Если разрезать стенку вдоль и развернуть, получится прямоугольник: ширина = длина окружности 2πr, высота = h. Поэтому боковая поверхность S = 2πr·h. Включите «Развёртку», чтобы увидеть этот прямоугольник.'},
  surf:{tag:'Полная поверхность',p:'Полная поверхность = боковая стенка + два круга-основания: S = 2πr·h + 2π·r² = 2πr·(r + h).'},
  vol:{tag:'Объём',p:'Объём цилиндра = площадь основания × высота: V = π·r²·h. Можно представить его как стопку из множества одинаковых тонких кругов высотой h.'},
},
kz:{
  r:{tag:'Радиус',p:'Радиус — цилиндр білігінен бүйір қабырғасына дейінгі қашықтық, яғни табан-дөңгелектің радиусы. Екі табан да r радиусты бірдей дөңгелектер.'},
  h:{tag:'Биіктік',p:'Биіктік — екі табан арасындағы қашықтық, қабырға ұзындығы. Тік цилиндрде биіктік табандарға перпендикуляр.'},
  circ:{tag:'Шеңбер',p:'Табан шеңберінің ұзындығы L = 2πr. Бұл маңызды шама: бүйір қабырғаны «жайсақ», осы ұзындық тіктөртбұрыштың ені болады.'},
  base:{tag:'Табан',p:'Әр табан — ауданы S = π·r² дөңгелек. Табан екеу, сондықтан толық бетке екі рет кіреді: 2·π·r².'},
  lat:{tag:'Бүйір беті',p:'Қабырғаны бойлай кесіп жайсақ, тіктөртбұрыш шығады: ені = 2πr, биіктігі = h. Сондықтан бүйір беті S = 2πr·h. «Жайманы» қосыңыз.'},
  surf:{tag:'Толық бет',p:'Толық бет = бүйір қабырға + екі табан-дөңгелек: S = 2πr·h + 2π·r² = 2πr·(r + h).'},
  vol:{tag:'Көлем',p:'Цилиндр көлемі = табан ауданы × биіктік: V = π·r²·h. Оны бірдей жұқа дөңгелектердің биіктігі h болатын дестесі деп елестетуге болады.'},
},
en:{
  r:{tag:'Radius',p:'The radius is the distance from the cylinder\'s axis to its wall — the radius of the circular base. Both bases are equal circles of radius r.'},
  h:{tag:'Height',p:'The height is the distance between the two bases, the length of the wall. In a right cylinder the height is perpendicular to the bases.'},
  circ:{tag:'Circle',p:'The base circumference L = 2πr. This is the key length: it becomes the width of the rectangle when you unroll the wall. Turn on "Unroll".'},
  base:{tag:'Base',p:'Each base is a circle of area S = π·r². There are two bases, so they enter the total surface twice: 2·π·r².'},
  lat:{tag:'Lateral surface',p:'Cut the wall lengthwise and unroll it: you get a rectangle of width 2πr (the circumference) and height h. So the lateral surface S = 2πr·h. Turn on "Unroll" to see the rectangle.'},
  surf:{tag:'Total surface',p:'Total surface = the wall + two circular bases: S = 2πr·h + 2π·r² = 2πr·(r + h).'},
  vol:{tag:'Volume',p:'Volume of a cylinder = base area × height: V = π·r²·h. Picture it as a stack of many identical thin discs of total height h.'},
}
};
const DETAIL=DETAIL_ALL[LANG]||DETAIL_ALL.ru;

let savedUnroll=false,savedSection=false;
function openDetail(key){
  const d=DETAIL[key];if(!d)return;
  const {r,h}=window.A;
  const m=METRICS.find(x=>x.key===key);
  if(!document.getElementById('panel-left').classList.contains('detail')){savedUnroll=showUnroll;savedSection=showSection;}
  document.querySelectorAll('.metric').forEach(el=>el.classList.toggle('active',el.dataset.key===key));
  if((key==='lat'||key==='circ')&&!showUnroll) window.toggleUnroll();
  const calc={
    r:`r = ${f1(r)}`,
    h:`h = ${f1(h)}`,
    circ:`L = 2π · r = 2π · ${f1(r)} = ${f2(2*PI*r)}`,
    base:`S = π · r² = π · ${f1(r)}² = ${f2(PI*r*r)}`,
    lat:`S = 2π · r · h\n  = 2π · ${f1(r)} · ${f1(h)} = ${f2(2*PI*r*h)}`,
    surf:`S = 2πr·(r + h)\n  = 2π·${f1(r)}·(${f1(r)}+${f1(h)}) = ${f2(2*PI*r*(r+h))}`,
    vol:`V = π · r² · h\n  = π · ${f1(r)}² · ${f1(h)} = ${f2(PI*r*r*h)}`,
  }[key];
  document.getElementById('detail-content').innerHTML=`
    <div class="d-tag">${d.tag}</div>
    <div class="d-title">${tr(m.i)}</div>
    <div class="d-bigval"><b>${f1(m.val())}</b><span>${tr(m.unit)}</span></div>
    <div class="d-formula">${calc}</div>
    <div class="d-para">${d.p}</div>`;
  document.getElementById('panel-left').classList.add('detail');
  currentDetail=key;markInteract();
}
let currentDetail=null;
window.openDetail=openDetail;
window.showList=function(){
  document.getElementById('panel-left').classList.remove('detail');currentDetail=null;
  document.querySelectorAll('.metric').forEach(m=>m.classList.remove('active'));
  if(showUnroll!==savedUnroll) window.toggleUnroll();
  if(showSection!==savedSection) window.toggleSection();
};

/* ── CONTROLS ── */
window.setDim=function(k,val){
  window.A[k]=val;buildScene();updateMetricValues();
  if(currentDetail) openDetail(currentDetail);
  markInteract();
};
window.toggleUnroll=function(){
  showUnroll=!showUnroll;document.getElementById('chip-unroll').classList.toggle('on',showUnroll);
  if(unrollGroup) unrollGroup.visible=showUnroll;markInteract();
};
window.toggleSection=function(){
  showSection=!showSection;document.getElementById('chip-section').classList.toggle('on',showSection);
  if(sectionGroup) sectionGroup.visible=showSection;markInteract();
};

/* ── RAYCAST ── */
const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
function pick(e,objs){m2.x=(e.clientX/innerWidth)*2-1;m2.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(m2,camera);return ray.intersectObjects(objs,false);}

let mode=null,dragKey=null,dragFactor=1,pxVec=null,startVal=0,startMouse=null;
let last={x:0,y:0},dd=0,isDragging=false,rotX=0.28;
let lastInteract=performance.now()-11000,autoSpeed=0;const AUTO_TARGET=0.0015,IDLE_MS=15000;
function markInteract(){lastInteract=performance.now();}
function screenPxPerUnit(dirLocal){const o=project(V(0,0,0)),p=project(dirLocal);return {x:p.x-o.x,y:p.y-o.y};}

canvas.addEventListener('mousedown',e=>{
  markInteract();
  const hHit=pick(e,handles.map(h=>h.mesh));
  if(hHit.length>0){
    const key=hHit[0].object.userData.handle, hd=handles.find(h=>h.key===key);
    mode='handle';dragKey=key;dragFactor=hd.factor;startVal=window.A[key];startMouse={x:e.clientX,y:e.clientY};
    pxVec=screenPxPerUnit(hd.dir);canvas.style.cursor='grabbing';return;
  }
  mode='rotate';last={x:e.clientX,y:e.clientY};isDragging=false;dd=0;
});
canvas.addEventListener('mousemove',e=>{
  if(mode==='handle'){
    const mdx=e.clientX-startMouse.x,mdy=e.clientY-startMouse.y,denom=pxVec.x*pxVec.x+pxVec.y*pxVec.y;
    if(denom>1){
      const units=(mdx*pxVec.x+mdy*pxVec.y)/denom;
      const nv=Math.max(1,Math.min(100,startVal+dragFactor*units));
      window.A[dragKey]=Math.round(nv*2)/2;
      buildScene();updateMetricValues();
      document.getElementById('slider-'+dragKey).value=window.A[dragKey];
      if(currentDetail)openDetail(currentDetail);
    }
    markInteract();return;
  }
  if(mode==='rotate'){
    dd=Math.hypot(e.clientX-last.x,e.clientY-last.y);if(dd>4)isDragging=true;
    if(isDragging){root.rotation.y+=(e.clientX-last.x)*0.010;rotX=Math.max(-1.1,Math.min(1.1,rotX+(e.clientY-last.y)*0.008));root.rotation.x=rotX;markInteract();}
    last={x:e.clientX,y:e.clientY};return;
  }
  const hHit=pick(e,handles.map(h=>h.mesh));canvas.style.cursor=hHit.length>0?'grab':'default';
});
window.addEventListener('mouseup',()=>{if(mode==='handle')canvas.style.cursor='default';mode=null;dragKey=null;});

canvas.addEventListener('click',e=>{
  if(isDragging||mode==='handle')return;
  if(!bodyMesh)return;
  const hit=pick(e,[bodyMesh]);
  if(hit.length>0){
    const p=hit[0].point.clone();
    obj.updateWorldMatrix(true,false);
    p.applyMatrix4(new THREE.Matrix4().copy(obj.matrixWorld).invert());
    const hy=window.A.h/2;
    if(Math.abs(p.y)>=hy-Math.max(0.001,hy*0.02)) openDetail('base'); else openDetail('lat');
  }
  markInteract();
});
canvas.addEventListener('wheel',e=>{e.preventDefault();userZoom=Math.max(0.6,Math.min(1.7,userZoom+e.deltaY*0.0015));markInteract();},{passive:false});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ── LOOP ── */
let t=0;
function animate(){
  requestAnimationFrame(animate);t+=0.016;
  const idle=performance.now()-lastInteract;
  if(idle>IDLE_MS)autoSpeed+=(AUTO_TARGET-autoSpeed)*0.025;else autoSpeed+=(0-autoSpeed)*0.18;
  root.rotation.y+=autoSpeed;root.rotation.x=rotX;
  if(mode!=='handle'){camDistTarget=computeCamTarget();}
  camDist+=(camDistTarget-camDist)*0.18;applyCamera();
  const pulse=idle>IDLE_MS?(1+Math.sin(t*2.2)*0.11):1;
  handles.forEach(h=>h.mesh.scale.setScalar(pulse));
  renderer.render(scene,camera);
  obj.updateWorldMatrix(true,false);
  updateLabels();
}

root.rotation.x=rotX;
buildScene();updateMetricValues();
camDistTarget=computeCamTarget();camDist=camDistTarget;applyCamera();
animate();
</script>
