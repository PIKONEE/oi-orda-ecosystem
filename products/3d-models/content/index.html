<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D-модели</title>
<style>
  :root{--bg:#0a0e27;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);
        --muted:rgba(255,255,255,.6);--accent:#3b82f6;--accent2:#8b5cf6;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{height:100%;}
  body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:#fff;
       background:var(--bg);
       background-image:radial-gradient(at 20% 30%,rgba(59,130,246,.12),transparent 50%),
                        radial-gradient(at 80% 70%,rgba(168,85,247,.12),transparent 50%);
       min-height:100vh;overflow-x:hidden;}

  /* верхняя панель (без backdrop-filter — он тормозит слабые панели) */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
          padding:12px 18px;background:#0c1130;border-bottom:1px solid var(--bd);min-height:62px;}
  .tbtn{display:none;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bd);
        background:rgba(255,255,255,.07);color:#fff;font:inherit;font-weight:600;
        padding:9px 15px;border-radius:11px;cursor:pointer;transition:background .15s,border-color .15s;
        white-space:nowrap;}
  .tbtn:hover{background:rgba(59,130,246,.25);border-color:var(--accent);}
  .tbtn:disabled{opacity:.3;cursor:default;}
  .nav{width:46px;padding:9px 0;font-size:18px;}
  .ttl{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .lang{display:flex;gap:3px;background:rgba(255,255,255,.07);
        border:1px solid var(--bd);border-radius:11px;padding:3px;}
  .lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;
        font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;letter-spacing:.5px;}
  .lang button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
  .lang button:hover{color:#fff;}

  main{max-width:1200px;margin:0 auto;padding:44px 20px 60px;position:relative;z-index:1;}
  .view{display:none;} .view.active{display:block;}

  .hero{text-align:center;margin-bottom:50px;}
  .hero h1{font-size:46px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6 50%,#ec4899);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .hero p{font-size:18px;color:var(--muted);margin-top:12px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;}
  .card{background:var(--card);border:1px solid var(--bd);
        border-radius:22px;padding:42px 30px;cursor:pointer;text-align:center;
        transition:transform .2s,border-color .2s;min-height:220px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .card:hover{transform:translateY(-6px);border-color:rgba(59,130,246,.55);}
  .card .ico{font-size:70px;margin-bottom:18px;}
  .card h2{font-size:25px;font-weight:700;}
  .card .sub{font-size:14px;color:var(--muted);margin-top:8px;}

  /* темы */
  .topbar2{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .topbar2 h1{font-size:32px;font-weight:800;letter-spacing:-.5px;}
  .search{flex:1;min-width:200px;max-width:360px;margin-left:auto;}
  .search input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);
        background:rgba(0,0,0,.25);color:#fff;font:inherit;outline:none;-webkit-user-select:text;user-select:text;}
  .search input:focus{border-color:var(--accent);}
  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .topic{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;
        cursor:pointer;transition:transform .15s,border-color .15s;display:flex;align-items:center;gap:14px;}
  .topic:hover{transform:translateY(-3px);border-color:rgba(59,130,246,.5);}
  .topic .d{width:42px;height:42px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
        font-size:22px;background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(139,92,246,.25));}
  .topic .nm{font-size:15px;font-weight:600;line-height:1.35;}
  .empty{color:var(--muted);text-align:center;padding:40px;}
  @keyframes flashT{from{background:rgba(59,130,246,.32);border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.45);}
                    to{background:var(--card);border-color:var(--bd);box-shadow:none;}}
  .topic.flash{animation:flashT 1.4s ease;}

  /* плакат */
  #view-poster{position:fixed;inset:62px 0 0 0;display:none;padding:0;}
  #view-poster.active{display:block;}
  #frame{width:100%;height:100%;border:0;background:var(--bg);}
</style>
</head>
<body>
  <div class="topbar">
    <button class="tbtn" id="back">← <span id="backTxt">Назад</span></button>
    <button class="tbtn nav" id="prev" title="Предыдущий">◀</button>
    <div class="ttl" id="title">3D-модели</div>
    <button class="tbtn nav" id="next" title="Следующий">▶</button>
    <div class="lang" id="lang"></div>
  </div>

  <main>
    <section class="view active" id="view-subjects">
      <div class="hero"><h1 id="heroH">3D-модели</h1><p id="heroP">Выберите предмет</p></div>
      <div class="grid" id="subjects"></div>
    </section>

    <section class="view" id="view-topics">
      <div class="topbar2">
        <h1 id="subjTitle"></h1>
        <div class="search"><input id="search" type="text" placeholder="Поиск…" autocomplete="off"></div>
      </div>
      <div class="topics" id="topics"></div>
    </section>
  </main>

  <section class="view" id="view-poster"><iframe id="frame" title="3D" allow="xr-spatial-tracking"></iframe></section>

<script>
'use strict';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
         set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);

const I18N={
  ru:{hero:'3D-модели',pick:'Выберите предмет',back:'Назад',search:'Поиск…',title:'3D-модели'},
  kz:{hero:'3D-модельдер',pick:'Пәнді таңдаңыз',back:'Артқа',search:'Іздеу…',title:'3D-модельдер'},
  en:{hero:'3D Models',pick:'Choose a subject',back:'Back',search:'Search…',title:'3D Models'},
};
let lang=LS.get('models3d-lang')||'ru'; if(!I18N[lang])lang='ru';

let SUBJECTS=[], LOCALE={}, view='subjects', curSubject=null, curTopics=[], curIdx=-1;

async function fetchJSON(url){ const r=await fetch(url,{cache:'no-store'}); return r.json(); }

async function loadData(){
  try{
    const data=await fetchJSON('subjects.json');
    SUBJECTS = Array.isArray(data) ? data : (data.subjects||[]);
  }catch(e){ SUBJECTS=[]; }
  try{ LOCALE=await fetchJSON('locales/'+lang+'.json'); }catch(e){ LOCALE={}; }
}

function tr(key,fallback){ const v=LOCALE[key]; return (v&&v.name)?v.name:(fallback||key); }
function subjName(s){ return tr(s.name_key||s.id, s.name||s.id); }
function topicName(t){
  const loc=LOCALE[t.name_key]; if(loc&&loc.name) return loc.name;
  if(lang==='ru'&&t.title_ru) return t.title_ru;
  return t.name||t.title_ru||t.id;
}

function renderLang(){
  $('lang').innerHTML='';
  for(const code of ['ru','kz','en']){
    const b=document.createElement('button'); b.textContent=code.toUpperCase();
    if(code===lang)b.classList.add('active');
    b.onclick=()=>{ if(code===lang)return; lang=code; LS.set('models3d-lang',code); applyLang(); };
    $('lang').append(b);
  }
}
async function applyLang(){
  document.documentElement.lang = lang==='kz'?'kk':lang;
  await loadData();
  const t=I18N[lang];
  $('heroH').textContent=t.hero; $('heroP').textContent=t.pick;
  $('backTxt').textContent=t.back; $('search').placeholder=t.search;
  renderLang();
  renderSubjects();
  if(view==='topics'&&curSubject) renderTopics();
  if(view==='poster'&&curIdx>=0){ loadPoster(curIdx,false); } // перезагрузить плакат на новом языке
  updateHeader();
}

// единая шапка: в плакате — название плаката + стрелки; иначе — предмет/раздел
function updateHeader(){
  if(view==='poster' && curIdx>=0){
    $('title').textContent=topicName(curTopics[curIdx]);
    $('prev').style.display='inline-flex'; $('next').style.display='inline-flex';
    $('prev').disabled=curIdx<=0; $('next').disabled=curIdx>=curTopics.length-1;
  }else{
    $('prev').style.display='none'; $('next').style.display='none';
    $('title').textContent = view==='subjects'? I18N[lang].title : subjName(curSubject);
  }
  $('back').style.display = view==='subjects' ? 'none' : 'inline-flex';
}

function show(v){
  view=v;
  for(const id of ['subjects','topics','poster']) $('view-'+id).classList.toggle('active', id===v);
  updateHeader();
}

function renderSubjects(){
  const g=$('subjects'); g.innerHTML='';
  SUBJECTS.forEach(s=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="ico">${s.icon||'📦'}</div><h2>${subjName(s)}</h2>`;
    c.onclick=()=>openSubject(s);
    g.append(c);
  });
}

function openSubject(s){ curSubject=s; $('subjTitle').textContent=subjName(s); $('search').value=''; renderTopics(); show('topics'); }

function renderTopics(filter){
  const g=$('topics'); g.innerHTML='';
  const topics=(curSubject.topics||[]).filter(t=>{
    if(!filter)return true; return topicName(t).toLowerCase().includes(filter.toLowerCase());
  });
  if(!topics.length){ g.innerHTML='<div class="empty">—</div>'; return; }
  topics.forEach(t=>{
    const el=document.createElement('div'); el.className='topic'; el.dataset.id=t.id;
    el.innerHTML=`<div class="nm">${topicName(t)}</div>`;
    el.onclick=()=>openPoster(t);
    g.append(el);
  });
}
$('search').addEventListener('input',e=>renderTopics(e.target.value.trim()));

// плакаты темы для листания ◀▶ — весь список предмета
function openPoster(t){
  curTopics = curSubject.topics||[];
  curIdx = curTopics.indexOf(t);
  if(curIdx<0){ curTopics=[t]; curIdx=0; }
  show('poster');
  loadPoster(curIdx,true);
}
function loadPoster(idx,scroll){
  curIdx=idx;
  const t=curTopics[idx];
  const base='posters/'+curSubject.id+'/'+t.id+'.html';
  $('frame').setAttribute('data-base', base);
  $('frame').src=base+'?lang='+lang+'&embed=1';
  updateHeader();
}
function gotoPoster(delta){
  const n=curIdx+delta;
  if(n<0||n>=curTopics.length) return;
  loadPoster(n,true);
}
$('prev').onclick=()=>gotoPoster(-1);
$('next').onclick=()=>gotoPoster(1);

// скрыть ВСЮ внутреннюю шапку плаката (навигация теперь у оболочки) + мост touch→mouse
$('frame').addEventListener('load',()=>{
  try{
    const d=$('frame').contentDocument; if(!d)return;
    const st=d.createElement('style');
    st.textContent=
      '.back-button,#lang-switcher,#lang-switch,.lang-switcher,.language-switcher,'+
      '[onclick*="goBack"],.header,header,.top-bar,.topbar,.navbar,.nav-bar,.poster-header,.page-header{display:none!important;}'+
      'body{padding-top:0!important;margin-top:0!important;}'+
      // убрать синее выделение/подсветку тапа при зажатии пальцем
      '*{-webkit-user-select:none!important;user-select:none!important;'+
      '-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;}';
    d.head.appendChild(st);

    // Мост касание→мышь: оживляет вращение в старых плакатах (события только мышиные).
    // Плакаты, которые сами обрабатывают касания (OrbitControls ставит touch-action:none) — пропускаем.
    const dv=d.defaultView;
    const mk=(cvs,type,p,buttons)=>cvs.dispatchEvent(new dv.MouseEvent(type,
      {clientX:p.clientX,clientY:p.clientY,bubbles:true,cancelable:true,view:dv,button:0,buttons:buttons}));
    var tapStart=null;
    const onT=(ev)=>{
      const t=ev.target;
      if(!t||t.tagName!=='CANVAS')return;
      const ta=t.style.touchAction||dv.getComputedStyle(t).touchAction;
      if(ta==='none')return;                          // плакат сам обрабатывает касания
      if(ev.type!=='touchend'&&ev.touches.length!==1)return; // вращение — один палец
      ev.preventDefault();
      const p=ev.type==='touchend'?ev.changedTouches[0]:ev.touches[0];
      if(ev.type==='touchstart'){ tapStart={x:p.clientX,y:p.clientY}; mk(t,'mousedown',p,1); }
      else if(ev.type==='touchmove'){ mk(t,'mousemove',p,1); }
      else {
        mk(t,'mouseup',p,0);
        // тап без сдвига → синтезируем click (иначе выбор грани/свойств не срабатывает),
        // т.к. preventDefault гасит нативный click
        if(tapStart && Math.hypot(p.clientX-tapStart.x, p.clientY-tapStart.y) < 12) mk(t,'click',p,0);
        tapStart=null;
      }
    };
    d.addEventListener('touchstart',onT,{passive:false,capture:true});
    d.addEventListener('touchmove', onT,{passive:false,capture:true});
    d.addEventListener('touchend',  onT,{passive:false,capture:true});

    // Освобождать WebGL-контекст при уходе с плаката: иначе контексты копятся
    // (лимит браузера ~8-16) → новые модели не появляются, старые сбрасываются.
    dv.addEventListener('pagehide',()=>{
      try{ d.querySelectorAll('canvas').forEach(c=>{
        const gl=c.getContext('webgl2')||c.getContext('webgl');
        const ext=gl&&gl.getExtension('WEBGL_lose_context'); if(ext)ext.loseContext();
      }); }catch(e){}
    });
  }catch(e){}
});

// при возврате из плаката — прокрутить к нему и кратко подсветить
function flashTopic(id){
  if(!id) return;
  requestAnimationFrame(()=>{
    const el=document.querySelector('.topic[data-id="'+id+'"]');
    if(!el) return;
    el.scrollIntoView({block:'center'});
    void el.offsetWidth; el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'),1500);
  });
}
$('back').onclick=()=>{
  if(view==='poster'){
    const tid=(curTopics[curIdx]&&curTopics[curIdx].id)||null;
    $('frame').src='about:blank'; show('topics'); flashTopic(tid);
  }
  else if(view==='topics'){ show('subjects'); }
};

(async()=>{ await applyLang(); show('subjects'); })();
</script>
</body>
</html>
