<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальные стенды</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M3 9h18M9 21V9"/>
                </svg>
                <h1>Виртуальные стенды</h1>
            </div>

            <nav class="subject-tabs" id="subjectTabs"></nav>

            <div class="header-actions">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                    <input type="search" id="searchInput" placeholder="Поиск по названию или номеру…" autocomplete="off">
                </div>
                <!-- <a class="mode-link" href="compare.html" title="Сравнение RU / KZ версий">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="7" height="16" rx="1"/>
                        <rect x="14" y="4" width="7" height="16" rx="1"/>
                    </svg>
                    <span>Сравнение</span>
                </a> -->
                <button class="icon-btn" id="themeToggle" title="Сменить тему">
                    <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="stats" id="stats"></div>
        <div class="grid" id="posterGrid"></div>
        <div class="empty-state" id="emptyState" hidden>
            <p>Ничего не найдено</p>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="modal" hidden>
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <header class="modal-header">
                <div class="modal-title">
                    <span class="modal-num" id="modalNum"></span>
                    <h2 id="modalTitle"></h2>
                </div>
                <div class="modal-actions">
                    <div class="lang-toggle" id="langToggle">
                        <button data-lang="ru" class="active">Русский</button>
                        <button data-lang="kz">Қазақша</button>
                    </div>
                    <a class="icon-btn" id="downloadBtn" title="Скачать" download>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                    </a>
                    <button class="icon-btn" id="modalClose" title="Закрыть (Esc)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </header>
            <div class="modal-body">
                <button class="nav-btn nav-prev" id="navPrev" title="Предыдущий (←)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                </button>
                <div class="modal-image-wrap" id="modalImageWrap">
                    <img id="modalImage" alt="">
                    <div class="placeholder" id="placeholder" hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 8v4M12 16h.01"/>
                        </svg>
                        <p>Қазақша нұсқасы әлі қосылмаған</p>
                        <p class="sub">Казахская версия пока недоступна</p>
                    </div>
                </div>
                <button class="nav-btn nav-next" id="navNext" title="Следующий (→)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </button>
            </div>
            <footer class="modal-footer">
                <span id="modalPosition"></span>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
