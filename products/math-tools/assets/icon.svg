<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a33"/>
      <stop offset="1" stop-color="#0a0e1d"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6a5af9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- фон во весь квадрат (без прозрачных углов) -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="none"/>

  <!-- координатные оси -->
  <line x1="40" y1="196" x2="224" y2="196" stroke="#5b6a93" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="40" x2="52" y2="212" stroke="#5b6a93" stroke-width="3" stroke-linecap="round"/>

  <!-- кривая функции (синусоида) -->
  <path d="M40 150 C 80 60, 110 60, 132 118 S 196 200, 224 96"
        fill="none" stroke="url(#curve)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- кость вероятностей (нижний правый угол) -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="74" height="74" rx="16" fill="#0e1430" stroke="#22d3ee" stroke-width="3.5" opacity="0.96"/>
    <circle cx="20" cy="20" r="6.5" fill="#22d3ee"/>
    <circle cx="54" cy="20" r="6.5" fill="#6a5af9"/>
    <circle cx="37" cy="37" r="6.5" fill="#a78bfa"/>
    <circle cx="20" cy="54" r="6.5" fill="#6a5af9"/>
    <circle cx="54" cy="54" r="6.5" fill="#22d3ee"/>
  </g>
</svg>
